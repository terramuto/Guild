<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중세 용병 길드 타이쿤</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-wood: #2e1d15; --bg-wood-dark: #1c100b;
            --parchment: #f4e8d3; --parchment-dark: #e6d3b3;
            --border-gold: #c5a059; --border-dark: #5c3a21;
            --text-main: #3e2723; --text-light: #5d4037;
            --gold: #b8860b; --red-fail: #900c3f;
            --font-title: 'Cinzel', serif; --font-main: 'Noto Serif KR', serif;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-wood), var(--bg-wood-dark));
            color: var(--text-main); font-family: var(--font-main);
            margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        }

        header {
            background: linear-gradient(135deg, #1f1209, #3a2416); padding: 15px 40px;
            border-radius: 4px; border: 3px solid var(--border-gold);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5); color: #fff;
        }

        .guild-title { font-family: var(--font-title); font-size: 1.6rem; color: var(--border-gold); text-shadow: 2px 2px 4px #000; letter-spacing: 2px; }
        
        .guild-stats { display: flex; gap: 40px; align-items: center; font-family: var(--font-title); text-shadow: 1px 1px 2px #000; }
        
        /* ⏳ 시간 진행 UI 스타일 */
        .time-container { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 200px; }
        .time-text { font-size: 1.1rem; font-weight: 700; color: #f4e8d3; }
        .time-bg { width: 100%; height: 8px; background: #111; border: 1px solid var(--border-gold); border-radius: 4px; overflow: hidden; }
        .time-fill { height: 100%; background: linear-gradient(90deg, #f1c40f, #d35400, #2c3e50); width: 0%; transition: width 1s linear; }
        
        .money-text { font-size: 1.3rem; font-weight: 700; color: var(--border-gold); }

        main { display: grid; grid-template-columns: 1fr 1.6fr 1fr; gap: 20px; flex: 1; overflow: hidden; }

        .panel { 
            background: var(--parchment); border: 4px solid var(--border-dark); border-radius: 8px; 
            display: flex; flex-direction: column; box-shadow: 5px 5px 15px rgba(0,0,0,0.7), inset 0 0 20px rgba(139, 69, 19, 0.1);
        }
        
        .panel-header { 
            background: var(--border-dark); color: #f4e8d3; padding: 12px; font-weight: 900; font-size: 1.1rem; 
            border-bottom: 3px solid #3a1f0f; display: flex; justify-content: space-between; align-items: center;
            font-family: var(--font-title); letter-spacing: 1px; text-shadow: 1px 1px 2px #000;
        }
        
        .panel-content { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px; }

        .card { 
            background: var(--parchment-dark); border: 2px solid #a68b6c; border-radius: 4px; padding: 12px; 
            display: flex; flex-direction: column; gap: 8px; box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; border-bottom: 1px solid #c9b18c; padding-bottom: 6px;}
        .merc-name { font-weight: 900; font-size: 1.15rem; color: #2e1b0f; }
        .merc-class { font-size: 0.75rem; padding: 4px 8px; border-radius: 3px; font-weight: bold; color: #fff; box-shadow: 1px 1px 2px rgba(0,0,0,0.5);}
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; font-size: 0.9rem; color: var(--text-light); row-gap: 6px; font-weight: 700; margin-top: 4px; }
        .stat-highlight { color: #8a2be2; }
        .status-badge { padding: 2px 6px; border-radius: 4px; color: #fff; font-size: 0.7rem; text-shadow: 1px 1px 0 #000;}
        
        button { 
            background: linear-gradient(to bottom, #5c3a21, #3a1f0f); color: #f4e8d3; border: 2px solid #1a0b05; 
            padding: 8px 12px; border-radius: 3px; font-weight: 700; cursor: pointer; transition: 0.1s; font-family: var(--font-main);
            box-shadow: 0 3px 0 #1a0b05, 0 3px 4px rgba(0,0,0,0.5); text-shadow: 1px 1px 2px #000; font-size: 0.85rem;
        }
        button:hover:not(:disabled) { background: linear-gradient(to bottom, #6e462a, #4a2e1b); transform: translateY(1px); box-shadow: 0 2px 0 #1a0b05; }
        button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 #1a0b05; }
        button:disabled { background: #887a6c; color: #b3aba0; box-shadow: 0 2px 0 #4a423a; cursor: not-allowed; border-color: #4a423a; transform: translateY(1px);}
        
        button.action-promote { background: linear-gradient(to bottom, #5b2c6f, #4a235a); border-color: #1a0b1c; box-shadow: 0 3px 0 #1a0b1c; }
        button.action-dispatch { background: linear-gradient(to bottom, #b9770e, #935116); border-color: #4a2205; box-shadow: 0 3px 0 #4a2205; }
        
        .btn-group { display: flex; gap: 4px; margin-top: 6px; }
        .btn-group button { flex: 1; padding: 6px; font-size: 0.8rem; }
        .btn-drink { background: linear-gradient(to bottom, #27ae60, #145a32) !important; border-color: #0e3e23 !important; box-shadow: 0 3px 0 #0e3e23 !important;}
        .btn-sleep { background: linear-gradient(to bottom, #2980b9, #154360) !important; border-color: #0b2331 !important; box-shadow: 0 3px 0 #0b2331 !important;}
        .btn-train { background: linear-gradient(to bottom, #c0392b, #78281f) !important; border-color: #4a1111 !important; box-shadow: 0 3px 0 #4a1111 !important;}

        .progress-bg { background: #3e2723; height: 10px; border-radius: 5px; border: 1px solid #1a0b05; overflow: hidden; margin-top: 4px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);}
        .fill-exp { background: linear-gradient(90deg, #2ecc71, #f1c40f); height: 100%; width: 0%; transition: width 0.3s; }
        .fill-stamina { background: linear-gradient(90deg, #3498db, #00ffff); height: 100%; width: 0%; transition: width 0.3s; }
        .fill-action { background: linear-gradient(90deg, #f39c12, #e67e22); height: 100%; width: 0%; transition: width 1s linear; }

        #log-container { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: linear-gradient(to bottom, rgba(46, 29, 21, 0.95), rgba(28, 16, 11, 0.95)); 
            padding: 15px 30px; border-radius: 4px; border: 2px solid var(--border-gold); 
            display: none; z-index: 100; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }
        #log-text { color: #f4e8d3; font-weight: 700; font-size: 1.1rem; text-shadow: 1px 1px 3px #000; }

        select { padding: 6px; background: #e6d3b3; color: #3e2723; border: 2px solid #8b5a2b; border-radius: 3px; font-family: inherit; font-weight: bold; outline: none; font-size: 0.9rem; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--parchment); border-left: 1px solid var(--border-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="guild-title">⚔️ 픽셀 용병 길드</div>
        <div class="guild-stats">
            <!-- ⏳ 시각적 시간 흐름 UI -->
            <div class="time-container">
                <div class="time-text" id="ui-time">DAY 1 [ 08:00 ]</div>
                <div class="time-bg"><div class="time-fill" id="ui-time-bar"></div></div>
            </div>
            <div class="money-text">🪙 <span id="ui-money">2,000</span> G</div>
        </div>
    </header>

    <main>
        <section class="panel">
            <div class="panel-header" style="justify-content: center;">🍺 낡은 선술집 (고용)</div>
            <div class="panel-content" id="tavern-list"></div>
        </section>

        <section class="panel" style="border-color: #2c3e50;">
            <div class="panel-header" style="background: #1a252f; border-color:#0f171e; justify-content: center;">🛡️ 길드 소속 명부 & 복지</div>
            <div class="panel-content" id="roster-list"></div>
        </section>

        <section class="panel" style="border-color: #78281f;">
            <div class="panel-header" style="background: #4a1111; border-color:#2c0808;">
                <span>📜 의뢰 게시판</span>
                <button id="btn-auto-dispatch" onclick="toggleAutoDispatch()" style="font-size:0.75rem; padding:4px 8px; background: #555; box-shadow: 0 3px 0 #222;">자동 파견 끄기</button>
            </div>
            <div class="panel-content" id="quest-list"></div>
        </section>
    </main>

    <div id="log-container"><span id="log-text"></span></div>

    <script>
        const CLASS_DB = {
            "W_0": { tier: 0, name: "초보 전사", color: "#c0392b", nextJobs: ["W_1"], reqLevel: 0, cost: 0 },
            "W_1": { tier: 1, name: "검사", color: "#e74c3c", nextJobs: ["W_2A", "W_2B"], reqLevel: 5, cost: 500 },
            "W_2A": { tier: 2, name: "기사", color: "#922b21", nextJobs: ["W_3A1", "W_3A2"], reqLevel: 15, cost: 2000 },
            "W_2B": { tier: 2, name: "광전사", color: "#7b241c", nextJobs: ["W_3B1", "W_3B2"], reqLevel: 15, cost: 2000 },
            "W_3A1": { tier: 3, name: "성기사", color: "#f1c40f", nextJobs: [], reqLevel: 30, cost: 10000 },
            "W_3A2": { tier: 3, name: "다크나이트", color: "#4a235a", nextJobs: [], reqLevel: 30, cost: 10000 },
            "W_3B1": { tier: 3, name: "워로드", color: "#641e16", nextJobs: [], reqLevel: 30, cost: 10000 },
            "W_3B2": { tier: 3, name: "블러드마스터", color: "#a93226", nextJobs: [], reqLevel: 30, cost: 10000 },

            "A_0": { tier: 0, name: "초보 궁수", color: "#27ae60", nextJobs: ["A_1"], reqLevel: 0, cost: 0 },
            "A_1": { tier: 1, name: "헌터", color: "#2ecc71", nextJobs: ["A_2A", "A_2B"], reqLevel: 5, cost: 500 },
            "A_2A": { tier: 2, name: "스나이퍼", color: "#1e8449", nextJobs: ["A_3A1"], reqLevel: 15, cost: 2000 }, 
            "A_2B": { tier: 2, name: "트래퍼", color: "#145a32", nextJobs: ["A_3B1"], reqLevel: 15, cost: 2000 },
            "A_3A1": { tier: 3, name: "보우마스터", color: "#117a65", nextJobs: [], reqLevel: 30, cost: 10000 },
            "A_3B1": { tier: 3, name: "생존전문가", color: "#0b5345", nextJobs: [], reqLevel: 30, cost: 10000 },

            "R_0": { tier: 0, name: "초보 도적", color: "#7f8c8d", nextJobs: ["R_1"], reqLevel: 0, cost: 0 },
            "R_1": { tier: 1, name: "암살자", color: "#95a5a6", nextJobs: ["R_2A", "R_2B"], reqLevel: 5, cost: 500 },
            "R_2A": { tier: 2, name: "섀도우", color: "#34495e", nextJobs: ["R_3A1"], reqLevel: 15, cost: 2000 },
            "R_2B": { tier: 2, name: "시프마스터", color: "#2c3e50", nextJobs: ["R_3B1"], reqLevel: 15, cost: 2000 },
            "R_3A1": { tier: 3, name: "나이트로드", color: "#1a252f", nextJobs: [], reqLevel: 30, cost: 10000 },
            "R_3B1": { tier: 3, name: "팬텀", color: "#5d6d7e", nextJobs: [], reqLevel: 30, cost: 10000 },

            "M_0": { tier: 0, name: "초보 마법사", color: "#8e44ad", nextJobs: ["M_1"], reqLevel: 0, cost: 0 },
            "M_1": { tier: 1, name: "워록", color: "#9b59b6", nextJobs: ["M_2A", "M_2B"], reqLevel: 5, cost: 500 },
            "M_2A": { tier: 2, name: "아크메이지", color: "#5b2c6f", nextJobs: ["M_3A1"], reqLevel: 15, cost: 2000 },
            "M_2B": { tier: 2, name: "서머너", color: "#4a235a", nextJobs: ["M_3B1"], reqLevel: 15, cost: 2000 },
            "M_3A1": { tier: 3, name: "엘리멘탈마스터", color: "#154360", nextJobs: [], reqLevel: 30, cost: 10000 },
            "M_3B1": { tier: 3, name: "일루저니스트", color: "#1b4f72", nextJobs: [], reqLevel: 30, cost: 10000 },

            "C_0": { tier: 0, name: "초보 성직자", color: "#e67e22", nextJobs: ["C_1"], reqLevel: 0, cost: 0 },
            "C_1": { tier: 1, name: "프리스트", color: "#d35400", nextJobs: ["C_2A", "C_2B"], reqLevel: 5, cost: 500 },
            "C_2A": { tier: 2, name: "비숍", color: "#a04000", nextJobs: ["C_3A1"], reqLevel: 15, cost: 2000 },
            "C_2B": { tier: 2, name: "이단심문관", color: "#873600", nextJobs: ["C_3B1"], reqLevel: 15, cost: 2000 },
            "C_3A1": { tier: 3, name: "세인트", color: "#6e2c00", nextJobs: [], reqLevel: 30, cost: 10000 },
            "C_3B1": { tier: 3, name: "팔라딘", color: "#784212", nextJobs: [], reqLevel: 30, cost: 10000 },
        };

        const BASE_CLASSES = ["W_0", "A_0", "R_0", "M_0", "C_0"];
        const NAMES = ["아서", "렌", "엘리스", "바츠", "카일", "루시", "테오", "세리아", "카론", "제이드", "로웬", "미아"];

        // ⏳ 시간 관련 상태 추가 (hour)
        let guild = { day: 1, hour: 8, money: 2000, autoDispatch: false, roster: [], tavern: [], quests: [] };

        const FACILITIES = {
            drink: { name: "🍺 선술집", cost: 50, time: 5, stamRecover: 40, desc: "활력 +40" },
            sleep: { name: "🛏️ 여관 숙박", cost: 150, time: 15, stamRecover: 100, desc: "활력 100% 회복" },
            train: { name: "🎯 모의 훈련", cost: 300, time: 20, powerUp: 5, desc: "기본 전투력 영구 +5 상승" }
        };

        class Mercenary {
            constructor(id) {
                this.id = id || 'M_' + Date.now() + Math.floor(Math.random() * 10000);
                this.name = NAMES[Math.floor(Math.random() * NAMES.length)];
                this.jobId = BASE_CLASSES[Math.floor(Math.random() * BASE_CLASSES.length)];
                
                this.level = 1; this.exp = 0;
                this.basePower = 15 + Math.floor(Math.random() * 10);
                this.baseWage = 10 + Math.floor(Math.random() * 5); 
                
                this.stamina = 100; this.maxStamina = 100;
                this.status = 'idle'; 
                this.actionTimeLeft = 0; this.actionTotalTime = 0; this.currentAction = null; 
                this.hireCost = 150 + Math.floor(Math.random() * 50);
            }

            get job() { return CLASS_DB[this.jobId]; }
            get maxExp() { return this.level * 100; }
            get power() { return Math.floor(this.basePower * (1 + this.level * 0.15) * (this.job.tier + 1)); }
            get currentWage() { return Math.floor(this.baseWage * Math.pow(1.2, this.level - 1) * Math.pow(2, this.job.tier)); }

            addExp(amount) {
                this.exp += amount;
                if (this.exp >= this.maxExp) {
                    this.exp -= this.maxExp; this.level++;
                    showLog(`🎉 ${this.name} 레벨 업! (Lv.${this.level})`);
                }
            }

            promote() {
                if(this.status !== 'idle') return { success: false, msg: "대기 중일 때만 승급이 가능합니다." };
                let currentJob = this.job;
                if (currentJob.nextJobs.length === 0) return { success: false, msg: "최고 랭크입니다." };
                
                let targetJobIds = currentJob.nextJobs;
                let nextJobPreview = CLASS_DB[targetJobIds[0]];
                
                if (this.level < nextJobPreview.reqLevel) return { success: false, msg: `레벨 부족 (필요: Lv.${nextJobPreview.reqLevel})` };
                if (guild.money < nextJobPreview.cost) return { success: false, msg: `심사비 부족 (${nextJobPreview.cost}G)` };

                guild.money -= nextJobPreview.cost;
                this.jobId = targetJobIds[Math.floor(Math.random() * targetJobIds.length)];

                return { success: true, msg: `📜 ${this.name} ✨ [${this.job.name}](으)로 전직했습니다!` };
            }
        }

        class Quest {
            constructor() {
                this.id = 'Q_' + Date.now() + Math.floor(Math.random()*100);
                this.title = ["고블린 부락 토벌", "귀족 영애 호위", "도적단 추적", "저주받은 묘지 탐색", "드래곤 둥지 정찰"][Math.floor(Math.random()*5)];
                this.timeTotal = 6 + Math.floor(Math.random() * 10);
                this.timeLeft = this.timeTotal;
                
                let baseReq = 15 + (guild.day * 1.5);
                this.reqPower = Math.floor(baseReq * (0.8 + Math.random() * 0.6));
                this.reqStamina = 20 + Math.floor(Math.random() * 15); 
                
                this.reward = this.reqPower * (2 + Math.floor(Math.random() * 3));
                this.expReward = this.reqPower * 2;
                this.assignedMercId = null;
            }
        }

        function updateHeader() {
            // ⏳ 시간 UI 업데이트 (08:00 형식)
            let timeStr = `DAY ${guild.day} [ ${guild.hour.toString().padStart(2, '0')}:00 ]`;
            document.getElementById('ui-time').innerText = timeStr;
            
            // 하루 24시간 비례 바
            let timeRatio = (guild.hour / 24) * 100;
            document.getElementById('ui-time-bar').style.width = `${timeRatio}%`;

            document.getElementById('ui-money').innerText = guild.money.toLocaleString();
        }

        function renderTavern() {
            const container = document.getElementById('tavern-list');
            container.innerHTML = '';
            guild.tavern.forEach((merc, index) => {
                let div = document.createElement('div'); div.className = 'card';
                div.innerHTML = `
                    <div class="card-top">
                        <span class="merc-name">${merc.name}</span>
                        <span class="merc-class" style="background:${merc.job.color}">${merc.job.name}</span>
                    </div>
                    <div class="stat-grid">
                        <span>기본 전투력: ⚔️${merc.power}</span>
                        <span>요구 일급: 🪙${merc.currentWage}</span>
                    </div>
                    <button style="margin-top:6px;" onclick="hireMerc(${index})" ${guild.money < merc.hireCost ? 'disabled' : ''}>
                        계약서 서명 (-${merc.hireCost} G)
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function getStatusBadge(status) {
            if(status === 'idle') return `<span class="status-badge" style="background:#27ae60;">대기중</span>`;
            if(status === 'questing') return `<span class="status-badge" style="background:#d35400;">임무중</span>`;
            if(status === 'resting') return `<span class="status-badge" style="background:#2980b9;">휴식중</span>`;
            if(status === 'training') return `<span class="status-badge" style="background:#8e44ad;">훈련중</span>`;
        }

        function renderRoster() {
            const container = document.getElementById('roster-list');
            container.innerHTML = '';
            guild.roster.forEach((merc, index) => {
                let div = document.createElement('div'); div.className = 'card';
                
                let actionUI = "";
                if(merc.status === 'idle') {
                    actionUI = `
                        <div class="btn-group">
                            <button class="btn-drink" onclick="useFacility(${index}, 'drink')" title="${FACILITIES.drink.desc} (-${FACILITIES.drink.cost}G)">🍺 한잔</button>
                            <button class="btn-sleep" onclick="useFacility(${index}, 'sleep')" title="${FACILITIES.sleep.desc} (-${FACILITIES.sleep.cost}G)">🛏️ 숙박</button>
                            <button class="btn-train" onclick="useFacility(${index}, 'train')" title="${FACILITIES.train.desc} (-${FACILITIES.train.cost}G)">🎯 훈련</button>
                        </div>
                    `;
                } else if (merc.status === 'resting' || merc.status === 'training') {
                    let fac = FACILITIES[merc.currentAction];
                    actionUI = `
                        <div style="font-size:0.8rem; font-weight:bold; color:var(--text-light); text-align:center; margin-top:5px;">
                            ${fac.name} 진행 중... (⏳${merc.actionTimeLeft}시간)
                        </div>
                        <div class="progress-bg"><div class="fill-action" style="width: ${((merc.actionTotalTime - merc.actionTimeLeft)/merc.actionTotalTime)*100}%;"></div></div>
                    `;
                }

                div.innerHTML = `
                    <div class="card-top">
                        <span class="merc-name">${merc.name} <span style="font-size:0.85rem; color:var(--text-light);">Lv.${merc.level}</span></span>
                        <div style="display:flex; gap:6px; align-items:center;">
                            <span class="merc-class" style="background:${merc.job.color}">${merc.job.name}</span>
                            ${getStatusBadge(merc.status)}
                        </div>
                    </div>
                    <div class="stat-grid">
                        <span>전투력: ⚔️<span class="stat-highlight">${merc.power}</span></span>
                        <span>현재 일급: 🪙${merc.currentWage}</span>
                    </div>
                    
                    <div style="display:flex; justify-content:space-between; font-size:0.8rem; font-weight:bold; margin-top:6px;">
                        <span style="color:#1e8449;">경험치</span>
                        <span style="color:#2980b9;">활력 ⚡${merc.stamina}/${merc.maxStamina}</span>
                    </div>
                    <div style="display:flex; gap:5px;">
                        <div class="progress-bg" style="flex:1;"><div class="fill-exp" style="width: ${(merc.exp / merc.maxExp)*100}%;"></div></div>
                        <div class="progress-bg" style="flex:1;"><div class="fill-stamina" style="width: ${(merc.stamina / merc.maxStamina)*100}%;"></div></div>
                    </div>

                    ${actionUI}
                    
                    ${merc.status === 'idle' && merc.job.nextJobs.length > 0 ? `
                        <button class="action-promote" style="margin-top:8px;" onclick="promoteMerc(${index})">
                            승급 심사 (${CLASS_DB[merc.job.nextJobs[0]].cost}G)
                        </button>
                    ` : ''}
                `;
                container.appendChild(div);
            });
        }

        function renderQuests() {
            const container = document.getElementById('quest-list');
            container.innerHTML = '';
            
            let idleMercs = guild.roster.filter(m => m.status === 'idle');

            let btnAuto = document.getElementById('btn-auto-dispatch');
            if(guild.autoDispatch) {
                btnAuto.innerText = "자동 파견 켜짐";
                btnAuto.style.background = "linear-gradient(to bottom, #1e8449, #145a32)";
                btnAuto.style.boxShadow = "0 3px 0 #0e3e23";
            } else {
                btnAuto.innerText = "자동 파견 꺼짐";
                btnAuto.style.background = "linear-gradient(to bottom, #7f8c8d, #555)";
                btnAuto.style.boxShadow = "0 3px 0 #222";
            }

            guild.quests.forEach((q, index) => {
                let div = document.createElement('div'); div.className = 'card';
                
                if (q.assignedMercId) {
                    let assignedMerc = guild.roster.find(m => m.id === q.assignedMercId);
                    div.innerHTML = `
                        <div class="card-top"><span class="merc-name">${q.title}</span></div>
                        <div class="stat-grid" style="margin-top:5px;">
                            <span>파견: 🏃${assignedMerc.name}</span>
                            <span>남은 시간: ⏳${q.timeLeft}시간</span>
                        </div>
                        <div class="progress-bg"><div class="fill-action" style="width: ${((q.timeTotal - q.timeLeft)/q.timeTotal)*100}%"></div></div>
                    `;
                } else {
                    let capableMercs = idleMercs.filter(m => m.stamina >= q.reqStamina);
                    let optionsHTML = capableMercs.map(m => `<option value="${m.id}">${m.name} (전투력:${m.power} | 활력:${m.stamina})</option>`).join('');

                    div.innerHTML = `
                        <div class="card-top"><span class="merc-name">${q.title}</span></div>
                        <div class="stat-grid">
                            <span style="color:#c0392b;">권장 전투력: ⚔️${q.reqPower}</span>
                            <span>보상: 🪙<span style="color:#b8860b">${q.reward}</span></span>
                            <span style="color:#2980b9; grid-column: span 2;">소모 활력: ⚡${q.reqStamina} | 소요 시간: ⏳${q.timeTotal}시간</span>
                        </div>
                        <div style="display:flex; gap:5px; margin-top:5px;">
                            <select id="select-merc-${index}" style="flex:1;" ${guild.autoDispatch ? 'disabled' : ''}>
                                ${capableMercs.length > 0 ? optionsHTML : '<option disabled selected>파견 가능한 용병 없음</option>'}
                            </select>
                            <button class="action-dispatch" onclick="startQuest(${index})" ${(capableMercs.length === 0 || guild.autoDispatch) ? 'disabled' : ''}>
                                계약 체결
                            </button>
                        </div>
                    `;
                }
                container.appendChild(div);
            });
        }

        function showLog(msg, isFail = false) {
            const logBox = document.getElementById('log-container');
            const logText = document.getElementById('log-text');
            logText.innerHTML = msg;
            
            if(isFail) {
                logBox.style.borderColor = "var(--red-fail)"; logText.style.color = "#ffcccc";
            } else {
                logBox.style.borderColor = "var(--border-gold)"; logText.style.color = "var(--parchment)";
            }
            
            logBox.style.display = 'block';
            setTimeout(() => { logBox.style.display = 'none'; }, 3000);
        }

        function refreshTavern() { guild.tavern = [new Mercenary(), new Mercenary(), new Mercenary()]; }
        function refreshQuests() { 
            guild.quests.push(new Quest()); 
            if(guild.quests.length > 4) guild.quests.shift(); 
        }

        function hireMerc(index) {
            let merc = guild.tavern[index];
            if (guild.money >= merc.hireCost) {
                guild.money -= merc.hireCost;
                guild.roster.push(merc);
                guild.tavern.splice(index, 1);
                showLog(`🤝 [${merc.job.name}] ${merc.name} 영입 완료!`);
                updateAll();
            }
        }

        function promoteMerc(index) {
            let merc = guild.roster[index];
            let result = merc.promote();
            if (result.success) { showLog(result.msg); updateAll(); } 
            else { alert(result.msg); }
        }

        function useFacility(mercIndex, type) {
            let merc = guild.roster[mercIndex];
            let fac = FACILITIES[type];

            if(merc.status !== 'idle') return alert("대기 중인 용병만 이용할 수 있습니다.");
            if(type === 'drink' || type === 'sleep') {
                if(merc.stamina >= merc.maxStamina) return alert("이미 활력이 가득 차 있습니다.");
            }
            if(guild.money < fac.cost) return alert(`자금이 부족합니다. (${fac.cost}G 필요)`);

            guild.money -= fac.cost;
            merc.status = type === 'train' ? 'training' : 'resting';
            merc.currentAction = type;
            merc.actionTotalTime = fac.time;
            merc.actionTimeLeft = fac.time;

            updateAll();
        }

        function startQuest(qIndex) {
            if(guild.autoDispatch) return;
            let selectBox = document.getElementById(`select-merc-${qIndex}`);
            let mercId = selectBox.value;
            if(!mercId) return;

            let merc = guild.roster.find(m => m.id === mercId);
            let quest = guild.quests[qIndex];

            merc.stamina -= quest.reqStamina;
            merc.status = 'questing';
            quest.assignedMercId = mercId;
            updateAll();
        }

        function toggleAutoDispatch() { guild.autoDispatch = !guild.autoDispatch; updateAll(); }
        function updateAll() { updateHeader(); renderTavern(); renderRoster(); renderQuests(); }

        // ==========================================
        // 5. ⏳ 정교해진 시간의 흐름 (1초 = 1시간)
        // ==========================================
        setInterval(() => {
            let updated = false;

            // 1. 시계 깍깍 진행 (매초마다 1시간 흐름)
            guild.hour++;
            
            // 2. 자정 (00:00) - 일급 정산 및 날짜 변경
            if (guild.hour >= 24) {
                guild.hour = 0;
                guild.day++;
                
                let totalWage = 0;
                guild.roster.forEach(m => totalWage += m.currentWage);
                guild.money -= totalWage;
                
                showLog(`🌙 하루가 저물었습니다. 용병 일급 -${totalWage} G 일괄 지급`);
                updated = true;
            }

            // 3. 아침 (06:00) - 새로운 용병 및 퀘스트 출현
            if (guild.hour === 6) {
                refreshTavern();
                refreshQuests();
                showLog(`☀️ 아침이 밝았습니다. 주점에 새로운 소문이 돕니다.`);
                updated = true;
            }

            // 4. 시설 이용 시간 감소
            guild.roster.forEach(merc => {
                if(merc.status === 'resting' || merc.status === 'training') {
                    merc.actionTimeLeft--;
                    updated = true;
                    if(merc.actionTimeLeft <= 0) {
                        let fac = FACILITIES[merc.currentAction];
                        if(merc.currentAction === 'train') {
                            merc.basePower += fac.powerUp;
                            showLog(`🎯 ${merc.name} 훈련 완료! (전투력 영구 상승)`);
                        } else {
                            merc.stamina = Math.min(merc.maxStamina, merc.stamina + fac.stamRecover);
                        }
                        merc.status = 'idle';
                        merc.currentAction = null;
                    }
                }
            });

            // 5. 자동 파견 매칭
            if (guild.autoDispatch) {
                let availableQuests = guild.quests.filter(q => !q.assignedMercId);
                availableQuests.sort((a, b) => b.reqPower - a.reqPower);

                availableQuests.forEach(quest => {
                    let capableMercs = guild.roster.filter(m => m.status === 'idle' && m.stamina >= quest.reqStamina);
                    if(capableMercs.length > 0) {
                        capableMercs.sort((a, b) => b.power - a.power);
                        let chosenMerc = capableMercs[0];
                        
                        chosenMerc.stamina -= quest.reqStamina;
                        chosenMerc.status = 'questing';
                        quest.assignedMercId = chosenMerc.id;
                        updated = true;
                    }
                });
            }

            // 6. 퀘스트 시간 감소 및 성공/실패 판정
            guild.quests.forEach((q, idx) => {
                if (q.assignedMercId) {
                    q.timeLeft--;
                    updated = true;
                    if (q.timeLeft <= 0) {
                        let merc = guild.roster.find(m => m.id === q.assignedMercId);
                        if(merc) {
                            merc.status = 'idle';
                            let winChance = Math.floor((merc.power / q.reqPower) * 70);
                            winChance = Math.min(95, Math.max(10, winChance)); 
                            
                            if(Math.random() * 100 <= winChance) {
                                guild.money += q.reward;
                                merc.addExp(q.expReward);
                                showLog(`💰 [성공] ${merc.name} 의뢰 완수! (+${q.reward} G)`);
                            } else {
                                merc.addExp(Math.floor(q.expReward / 2));
                                showLog(`🩸 [실패] ${merc.name} 의뢰 실패... (위험에 빠져 도주함)`, true);
                            }
                        }
                        guild.quests.splice(idx, 1);
                        if (guild.quests.length < 3) refreshQuests(); // 퀘스트가 너무 없으면 하나 보충
                    }
                }
            });

            // 매초마다 화면 갱신 (시간 바 움직임 등)
            updateAll();
        }, 1000); // 현실 1초 = 게임 1시간

        // 초기화 세팅
        refreshTavern();
        for(let i=0;i<3;i++) refreshQuests();
        updateAll();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>판타지 용병 여관 타이쿤</title>
  <style>
    :root {
      --bg-dark: #1a1b26;
      --bg-panel: #24283b;
      --bg-card: #2f354a;
      --text-main: #c0caf5;
      --text-gold: #e0af68;
      --accent: #7aa2f7;
      --accent-green: #9ece6a;
      --accent-red: #f7768e;
      --border: #414868;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    #app { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; background-color: var(--bg-panel); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    
    /* Top Header */
    header { padding: 12px 16px; background: rgba(26,27,38,0.9); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .gold-box { color: var(--text-gold); font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; gap: 4px; }
    .status-box { font-size: 0.85rem; color: var(--accent); }

    /* Main View Area */
    .view-area { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }

    /* Tabs */
    nav { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg-dark); border-top: 1px solid var(--border); }
    .nav-btn { padding: 12px 0; background: none; border: none; color: var(--text-main); font-size: 0.8rem; font-weight: bold; cursor: pointer; text-align: center; }
    .nav-btn.active { color: var(--accent); border-top: 2px solid var(--accent); background: var(--bg-card); }

    /* Cards & Components */
    .card { background: var(--bg-card); border-radius: 8px; padding: 12px; border: 1px solid var(--border); }
    .card-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 8px; color: var(--accent); display: flex; justify-content: space-between; }
    .btn { background: var(--accent); color: #111; border: none; border-radius: 4px; padding: 6px 12px; font-weight: bold; cursor: pointer; }
    .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; background: #3d4663; color: #fff; }
    
    /* Lists */
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border); }
    .item-row:last-child { border-bottom: none; }
    .res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
    .res-card { background: var(--bg-dark); padding: 6px 8px; border-radius: 4px; text-align: center; font-size: 0.8rem; }
    .log-box { height: 100px; overflow-y: auto; background: var(--bg-dark); border-radius: 4px; padding: 8px; font-size: 0.75rem; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div>
        <div class="gold-box">💰 <span id="goldDisplay">1,000</span> G</div>
        <div style="font-size: 0.75rem; color: #7aa2f7;">명성도: <span id="repDisplay">10</span></div>
      </div>
      <div class="status-box">
        <span id="timeDisplay">08:00</span> (<span id="dayDisplay">1일차</span>)
      </div>
    </header>

    <div class="view-area" id="viewArea">
      </div>

    <div style="padding: 0 12px 6px;">
      <div class="log-box" id="logBox"></div>
    </div>

    <nav>
      <button class="nav-btn active" onclick="switchTab('inn')">여관 홀</button>
      <button class="nav-btn" onclick="switchTab('quest')">의뢰판</button>
      <button class="nav-btn" onclick="switchTab('forge')">대장간</button>
      <button class="nav-btn" onclick="switchTab('mercs')">용병 명단</button>
    </nav>
  </div>

  <script>
    // --- [게임 데이터 & 상태] ---
    const STATE = {
      gold: 2000,
      rep: 15,
      day: 1,
      hour: 8,
      min: 0,
      materials: { iron: 10, leather: 8, magicEssence: 2 },
      forgeStock: [],       // 진열대 완성품
      forgeOrders: [],      // 특별 납품 의뢰
      mercenaries: [
        { id: 1, name: "카일", tier: 1, job: "궁수", spec: "헌터", finalJob: null, atk: 25, gold: 300, gear: "낡은 단궁" },
        { id: 2, name: "레온", tier: 2, job: "궁수", spec: "스나이퍼", finalJob: null, atk: 55, gold: 500, gear: "강화 석궁" },
        { id: 3, name: "발렌", tier: 1, job: "전사", spec: "검사", finalJob: null, atk: 30, gold: 200, gear: "녹슨 철검" }
      ],
      quests: [],
      currentTab: 'inn'
    };

    // 전직 트리 (궁수 3차: 호크아이 반영)
    const JOB_TREE = {
      궁수: {
        스나이퍼: ["호크아이", "보우마스터"],
        레인저: ["윈드러너", "비스트로드"]
      },
      전사: {
        글래디에이터: ["워로드", "버서커"],
        나이트: ["팔라딘", "크루세이더"]
      }
    };

    // 대장간 레시피
    const RECIPES = [
      { id: 'iron_bow', name: '강철 사냥궁', job: '궁수', cost: 150, mats: { iron: 2, leather: 1 }, atk: 35, price: 400 },
      { id: 'sniper_arbalest', name: '저격수의 석궁', job: '궁수', cost: 400, mats: { iron: 4, leather: 3 }, atk: 75, price: 900 },
      { id: 'hawk_piercer', name: '호크아이 매의 활', job: '궁수', cost: 1000, mats: { iron: 6, magicEssence: 2 }, atk: 140, price: 2500 },
      { id: 'broadsword', name: '기사단 장검', job: '전사', cost: 200, mats: { iron: 3, leather: 1 }, atk: 45, price: 550 }
    ];

    // --- [로그 출력] ---
    function log(msg) {
      const box = document.getElementById('logBox');
      const div = document.createElement('div');
      div.innerText = `[${String(STATE.hour).padStart(2,'0')}:${String(STATE.min).padStart(2,'0')}] ${msg}`;
      box.prepend(div);
    }

    // --- [화면 갱신 및 탭 전환] ---
    function updateHeader() {
      document.getElementById('goldDisplay').innerText = STATE.gold.toLocaleString();
      document.getElementById('repDisplay').innerText = STATE.rep;
      document.getElementById('timeDisplay').innerText = `${String(STATE.hour).padStart(2,'0')}:${String(STATE.min).padStart(2,'0')}`;
      document.getElementById('dayDisplay').innerText = `${STATE.day}일차`;
    }

    function switchTab(tab) {
      STATE.currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach((b, i) => {
        b.classList.toggle('active', ['inn','quest','forge','mercs'][i] === tab);
      });
      render();
    }

    // --- [대장간 시스템 로직] ---
    function craftItem(recipeId) {
      const rec = RECIPES.find(r => r.id === recipeId);
      if (STATE.gold < rec.cost) return alert("골드가 부족합니다.");
      for (let m in rec.mats) {
        if ((STATE.materials[m] || 0) < rec.mats[m]) return alert("재료가 부족합니다.");
      }

      // 소모
      STATE.gold -= rec.cost;
      for (let m in rec.mats) STATE.materials[m] -= rec.mats[m];

      // 대성공 확률 계산 (15%)
      const isMasterpiece = Math.random() < 0.15;
      const finalAtk = isMasterpiece ? Math.floor(rec.atk * 1.3) : rec.atk;
      const itemName = isMasterpiece ? `[명작] ${rec.name}` : rec.name;

      STATE.forgeStock.push({
        name: itemName,
        job: rec.job,
        atk: finalAtk,
        price: isMasterpiece ? Math.floor(rec.price * 1.4) : rec.price
      });

      log(`🔨 대장간: ${itemName} 단조 완료! (공격력 +${finalAtk}) 진열대에 배치되었습니다.`);
      render();
    }

    // 특별 납품 완료
    function deliverOrder(orderIdx) {
      const order = STATE.forgeOrders[orderIdx];
      const stockIdx = STATE.forgeStock.findIndex(i => i.name.includes(order.targetItem));
      if (stockIdx === -1) return alert("진열대에 납품할 장비가 없습니다.");

      STATE.forgeStock.splice(stockIdx, 1);
      STATE.gold += order.rewardGold;
      STATE.rep += order.rewardRep;
      STATE.forgeOrders.splice(orderIdx, 1);

      log(`📦 납품 완료: ${order.title} 완료! 보상 +${order.rewardGold}G, 명성 +${order.rewardRep}`);
      render();
    }

    // 3차 전직 승급 (호크아이 분기)
    function promoteMerc(mercId, finalJobName) {
      const merc = STATE.mercenaries.find(m => m.id === mercId);
      merc.tier = 3;
      merc.finalJob = finalJobName;
      merc.atk += 60;
      log(`🌟 전직: ${merc.name}님이 3차 직업 [${finalJobName}]으로 각성했습니다!`);
      render();
    }

    // --- [뷰 렌더러] ---
    function render() {
      updateHeader();
      const area = document.getElementById('viewArea');
      area.innerHTML = '';

      if (STATE.currentTab === 'inn') {
        area.innerHTML = `
          <div class="card">
            <div class="card-title">🍻 여관 메인 홀</div>
            <p style="font-size:0.85rem; color:#888;">모험가들이 휴식을 취하고 장비를 점검하는 중입니다.</p>
          </div>
          <div class="card">
            <div class="card-title">진열 중인 대장간 장비 (${STATE.forgeStock.length}개)</div>
            ${STATE.forgeStock.length === 0 ? '<p style="font-size:0.8rem; color:#666;">진열된 장비가 없습니다. 대장간에서 제작해보세요.</p>' : 
              STATE.forgeStock.map(i => `
                <div class="item-row">
                  <div><b>${i.name}</b> <span class="badge">${i.job}</span><br><span style="font-size:0.75rem; color:#888;">공격력 +${i.atk}</span></div>
                  <div style="color:var(--text-gold); font-weight:bold;">${i.price} G</div>
                </div>
              `).join('')}
          </div>
        `;
      } else if (STATE.currentTab === 'forge') {
        area.innerHTML = `
          <div class="card">
            <div class="card-title">⛏️ 보유 재료 창고</div>
            <div class="res-grid">
              <div class="res-card">철광석: <b>${STATE.materials.iron}</b>개</div>
              <div class="res-card">질긴 가죽: <b>${STATE.materials.leather}</b>개</div>
              <div class="res-card">마력 정수: <b>${STATE.materials.magicEssence}</b>개</div>
            </div>
          </div>

          <div class="card">
            <div class="card-title">📜 특별 납품 의뢰</div>
            ${STATE.forgeOrders.length === 0 ? '<p style="font-size:0.8rem; color:#666;">현재 긴급 납품 의뢰가 없습니다.</p>' :
              STATE.forgeOrders.map((o, idx) => `
                <div class="item-row">
                  <div><b>${o.title}</b><br><small style="color:#aaa;">필요: ${o.targetItem}</small></div>
                  <button class="btn btn-sm" onclick="deliverOrder(${idx})">납품 (+${o.rewardGold}G)</button>
                </div>
              `).join('')}
          </div>

          <div class="card">
            <div class="card-title">🔨 장비 단조 (제작)</div>
            ${RECIPES.map(r => `
              <div class="item-row">
                <div>
                  <b>${r.name}</b> <span class="badge">${r.job}</span> (공격력 +${r.atk})<br>
                  <small style="color:#888;">비용: ${r.cost}G | 재료: ${Object.entries(r.mats).map(([k,v]) => `${k === 'iron' ? '철광석': k === 'leather' ? '가죽':'정수'}${v}`).join(', ')}</small>
                </div>
                <button class="btn btn-sm" onclick="craftItem('${r.id}')">제작</button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (STATE.currentTab === 'quest') {
        area.innerHTML = `
          <div class="card">
            <div class="card-title">📋 재료 수급 및 토벌 의뢰</div>
            ${STATE.quests.map((q, idx) => `
              <div class="item-row">
                <div>
                  <b>${q.title}</b> <span class="badge">${q.difficulty}</span><br>
                  <small style="color:#aaa;">보상: ${q.rewardGold}G | ${q.matReward.name} +${q.matReward.count}</small>
                </div>
                <button class="btn btn-sm" onclick="acceptQuest(${idx})">파견</button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (STATE.currentTab === 'mercs') {
        area.innerHTML = `
          <div class="card">
            <div class="card-title">🛡️ 고용된 용병단</div>
            ${STATE.mercenaries.map(m => `
              <div class="item-row" style="flex-direction:column; align-items:flex-start; gap:4px;">
                <div style="width:100%; display:flex; justify-content:space-between;">
                  <b>${m.name}</b>
                  <span class="badge">${m.tier}차: ${m.finalJob || m.spec || m.job}</span>
                </div>
                <div style="font-size:0.75rem; color:#aaa;">
                  무기: ${m.gear} | 공격력: ${m.atk} | 소지금: ${m.gold}G
                </div>
                ${m.tier === 2 && m.spec === '스나이퍼' ? `
                  <div style="margin-top:4px; display:flex; gap:6px;">
                    <button class="btn btn-sm" style="background:#9ece6a;" onclick="promoteMerc(${m.id}, '호크아이')">3차 전직: 호크아이</button>
                    <button class="btn btn-sm" onclick="promoteMerc(${m.id}, '보우마스터')">3차 전직: 보우마스터</button>
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    // --- [의뢰 처리] ---
    function acceptQuest(idx) {
      const q = STATE.quests[idx];
      STATE.gold += q.rewardGold;
      STATE.materials[q.matReward.type] += q.matReward.count;
      log(`⚔️ 의뢰 완수: '${q.title}' 보상으로 ${q.rewardGold}G와 ${q.matReward.name} ${q.matReward.count}개를 획득했습니다.`);
      STATE.quests.splice(idx, 1);
      render();
    }

    // --- [시간 흐름 & 에이전트 자율 구매 루프] ---
    function gameTick() {
      STATE.min += 10;
      if (STATE.min >= 60) {
        STATE.min = 0;
        STATE.hour++;
      }
      if (STATE.hour >= 24) {
        STATE.hour = 8;
        STATE.day++;
        log(`🌅 ${STATE.day}일차 아침이 밝았습니다.`);
      }

      // 의뢰 보충 (최대 3개)
      if (STATE.quests.length < 3 && Math.random() < 0.4) {
        const pool = [
          { title: "철광석 광산 소탕", difficulty: "쉬움", rewardGold: 100, matReward: { type: 'iron', name: '철광석', count: 3 } },
          { title: "설원 늑대 가죽 채취", difficulty: "보통", rewardGold: 200, matReward: { type: 'leather', name: '질긴 가죽', count: 2 } },
          { title: "고대 유적 골렘 핵 수거", difficulty: "어려움", rewardGold: 450, matReward: { type: 'magicEssence', name: '마력 정수', count: 1 } }
        ];
        STATE.quests.push(pool[Math.floor(Math.random() * pool.length)]);
      }

      // 특별 납품 의뢰 발생 (최대 1개 유지)
      if (STATE.forgeOrders.length === 0 && Math.random() < 0.2) {
        STATE.forgeOrders.push({
          title: "영지 수비대 무기 긴급 조달",
          targetItem: "강철 사냥궁",
          rewardGold: 700,
          rewardRep: 5
        });
        log("📢 대장간에 영지 수비대의 긴급 납품 의뢰가 접수되었습니다!");
      }

      // 용병 대장간 방문 및 자율 구매 루프
      if (STATE.forgeStock.length > 0) {
        STATE.mercenaries.forEach(m => {
          m.gold += 15; // 모험 수익 축적
          const buyableIdx = STATE.forgeStock.findIndex(item => item.job === m.job && m.gold >= item.price && item.atk > m.atk);
          if (buyableIdx !== -1) {
            const item = STATE.forgeStock.splice(buyableIdx, 1)[0];
            m.gold -= item.price;
            STATE.gold += item.price; // 대금은 길드 금고로 입금
            m.gear = item.name;
            m.atk = item.atk;
            log(`💰 판매 완료: ${m.name}님이 [${item.name}]을(를) ${item.price}G에 구매하여 착용했습니다!`);
          }
        });
      }

      render();
    }

    // 2초마다 10분 진행
    setInterval(gameTick, 2000);
    render();
  </script>
</body>
</html>

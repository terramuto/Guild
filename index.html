<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중세 용병 길드 타이쿤</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-desk: #1e110a; 
            --parchment: #fdf5e6; --parchment-dark: #e8d5b5; --ink: #2e1b0f;
            --border-gold: #c5a059; --wood-board: #3e2415;
            --red-seal: #900c3f; --green-ok: #1e8449; --blue-mana: #2980b9;
            --font-title: 'Cinzel', serif; --font-main: 'Noto Serif KR', serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #3a2214, var(--bg-desk));
            color: var(--ink); font-family: var(--font-main);
            margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        }

        header {
            background: linear-gradient(135deg, #1f1209, #3a2416); padding: 12px 40px;
            border-radius: 4px; border: 3px solid var(--border-gold);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5); color: #fff;
        }

        .guild-title { font-family: var(--font-title); font-size: 1.6rem; color: var(--border-gold); text-shadow: 2px 2px 4px #000; letter-spacing: 2px; }
        .guild-stats { display: flex; gap: 40px; align-items: center; font-family: var(--font-title); text-shadow: 1px 1px 2px #000; }
        
        .time-container { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 220px; }
        .time-text { font-size: 1.1rem; font-weight: 700; color: #fdf5e6; }
        .time-bg { width: 100%; height: 8px; background: #111; border: 1px solid var(--border-gold); border-radius: 4px; overflow: hidden; }
        .time-fill { height: 100%; background: linear-gradient(90deg, #f1c40f, #d35400, #2c3e50); width: 0%; transition: width 1s linear; }
        .money-text { font-size: 1.4rem; font-weight: 900; color: var(--border-gold); }

        /* 👁️ 시점 전환 버튼 구역 */
        .view-toggle { display: flex; gap: 10px; margin-bottom: 15px; justify-content: flex-start; }
        .view-btn { 
            background: linear-gradient(to bottom, #5c3a21, #3a1f0f); color: var(--border-gold); 
            border: 2px solid var(--border-gold); padding: 10px 20px; border-radius: 4px; 
            font-family: var(--font-title); font-weight: 900; font-size: 1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .view-btn.active { background: var(--border-gold); color: #111; box-shadow: inset 0 3px 5px rgba(0,0,0,0.5); }

        main { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; flex: 1; overflow: hidden; }

        /* ================== 좌측: 거대 양피지 (길드 명부) ================== */
        .ledger {
            background: var(--parchment); border-radius: 3px;
            box-shadow: 8px 8px 25px rgba(0,0,0,0.8), inset 0 0 60px rgba(139, 69, 19, 0.15);
            display: flex; flex-direction: column; position: relative;
        }
        .ledger-header {
            padding: 15px 30px; border-bottom: 3px double #b8860b;
            display: flex; justify-content: space-between; align-items: center;
        }
        .ledger-title { font-family: var(--font-title); font-size: 1.5rem; font-weight: 900; color: var(--ink); letter-spacing: 2px; }
        .ledger-content { padding: 15px 25px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; }

        .ledger-row { display: flex; gap: 15px; padding: 15px 0; border-bottom: 2px dotted #c5a059; align-items: center; }
        .ledger-row:last-child { border-bottom: none; }

        /* 🖼️ 픽셀 아트 초상화 */
        .portrait-box { 
            width: 70px; height: 70px; background: #a68b6c; border: 3px solid #3e2415; border-radius: 6px; 
            overflow: hidden; flex-shrink: 0; box-shadow: inset 0 0 8px rgba(0,0,0,0.5), 2px 2px 4px rgba(0,0,0,0.3);
            display: flex; justify-content: center; align-items: center;
        }
        .portrait-box img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; } 

        .info-col { flex: 1.2; display: flex; flex-direction: column; gap: 6px; }
        .merc-name { font-weight: 900; font-size: 1.2rem; color: var(--ink); }
        .merc-class { font-size: 0.75rem; padding: 3px 6px; border-radius: 3px; font-weight: bold; color: #fff; box-shadow: 1px 1px 2px rgba(0,0,0,0.5);}
        .stat-text { font-size: 0.85rem; font-weight: 700; color: #5d4037; }

        .action-col { flex: 1.8; display: flex; flex-direction: column; gap: 8px; border-left: 2px dotted #d7c9b1; padding-left: 15px; justify-content: center;}

        /* 💬 용병 생각(말풍선) UI */
        .thought-bubble {
            background: #fff; border: 2px solid #a68b6c; border-radius: 8px; padding: 6px 10px;
            font-size: 0.8rem; font-weight: 700; color: #3e2723; position: relative;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1); font-style: italic; line-height: 1.3;
        }
        .thought-bubble::before { content: ''; position: absolute; left: -8px; top: 10px; border-width: 6px 8px 6px 0; border-style: solid; border-color: transparent #a68b6c transparent transparent; }
        .thought-bubble::after { content: ''; position: absolute; left: -5px; top: 10px; border-width: 6px 8px 6px 0; border-style: solid; border-color: transparent #fff transparent transparent; }

        .bar-wrap { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: bold; }
        .progress-bg { flex: 1; background: #d7c9b1; height: 8px; border-radius: 4px; border: 1px solid #8b5a2b; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);}
        .fill-exp { background: linear-gradient(90deg, #2ecc71, #27ae60); height: 100%; width: 0%; transition: width 0.3s; }
        .fill-stamina { background: linear-gradient(90deg, #3498db, #2980b9); height: 100%; width: 0%; transition: width 0.3s; }
        .fill-action { background: linear-gradient(90deg, #e67e22, #d35400); height: 100%; width: 0%; transition: width 1s linear; }

        /* ================== 좌측: 길드 내부 시점 (돌바닥 뷰) ================== */
        #floor-container {
            position: relative; width: 100%; height: 100%;
            /* 길드 바닥 돌 타일 패턴 */
            background: linear-gradient(135deg, #4a3b32 25%, transparent 25%) -50px 0,
                        linear-gradient(225deg, #4a3b32 25%, transparent 25%) -50px 0,
                        linear-gradient(315deg, #4a3b32 25%, transparent 25%),
                        linear-gradient(45deg, #4a3b32 25%, transparent 25%);
            background-size: 100px 100px; background-color: #3e2f26;
            overflow: hidden; border-radius: 4px; box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            border: 4px solid #1a0b05;
        }

        /* 길드 시설 마커 */
        .facility-marker { position: absolute; padding: 10px 20px; border-radius: 8px; color: #fff; font-weight: 900; text-shadow: 2px 2px 0 #000; border: 2px dashed rgba(255,255,255,0.3); background: rgba(0,0,0,0.4); }
        .fac-bar { top: 5%; left: 5%; color: #f1c40f; }
        .fac-train { bottom: 5%; right: 5%; color: #e74c3c; }
        .fac-sleep { top: 5%; right: 5%; color: #3498db; }

        /* 돌아다니는 용병 스프라이트 */
        .merc-sprite {
            position: absolute; width: 50px; height: 50px;
            transform: translate(-50%, -50%);
            transition: top 2s ease-in-out, left 2s ease-in-out; /* 🚶 부드러운 걷기 애니메이션 */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none; z-index: 10;
        }
        .merc-sprite img {
            width: 50px; height: 50px; background: #a68b6c; border: 2px solid var(--border-gold);
            border-radius: 6px; box-shadow: 3px 3px 6px rgba(0,0,0,0.7); image-rendering: pixelated;
        }
        .floor-name { font-size: 0.7rem; font-weight: 900; color: #fff; padding: 2px 6px; border-radius: 4px; margin-top: -8px; z-index: 2; border: 1px solid #111; box-shadow: 1px 1px 2px rgba(0,0,0,0.5);}
        .floor-bubble {
            position: absolute; bottom: 65px; background: #fff; color: #111; font-size: 0.75rem; font-weight: 900; 
            padding: 5px 8px; border-radius: 6px; width: max-content; max-width: 150px; text-align: center; 
            border: 2px solid #8b5a2b; box-shadow: 2px 2px 4px rgba(0,0,0,0.3); z-index: 10;
        }
        .floor-bubble::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            border-width: 6px 6px 0; border-style: solid; border-color: #8b5a2b transparent transparent transparent;
        }

        /* ================== 우측: 서브 보드 ================== */
        .sidebar { display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding-right: 5px; }
        
        .board { background: var(--wood-board); border: 4px solid #2a160b; border-radius: 6px; display: flex; flex-direction: column; box-shadow: 5px 5px 15px rgba(0,0,0,0.8); }
        .board-header { background: #2a160b; color: var(--border-gold); padding: 10px; text-align: center; font-family: var(--font-title); font-weight: 900; letter-spacing: 1px; }
        .board-content { padding: 12px; display: flex; flex-direction: column; gap: 10px; max-height: 350px; overflow-y: auto; }

        .slip { background: #fdf5e6; border: 1px solid #c5a059; padding: 10px; border-radius: 2px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); position: relative; }
        .slip::before { content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; background: #c0392b; border-radius: 50%; box-shadow: 1px 1px 2px rgba(0,0,0,0.5); } 
        
        .slip-title { font-weight: 900; color: #2e1b0f; border-bottom: 1px solid #d7c9b1; padding-bottom: 4px; margin-bottom: 6px; font-size:0.9rem;}
        .slip-desc { font-size: 0.8rem; font-weight: 700; color: #5d4037; display: flex; flex-direction: column; gap: 3px;}

        button { 
            background: linear-gradient(to bottom, #5c3a21, #3a1f0f); color: #f4e8d3; border: 1px solid #1a0b05; 
            padding: 6px 12px; border-radius: 3px; font-weight: 700; cursor: pointer; transition: 0.1s; font-family: var(--font-main);
            box-shadow: 0 3px 0 #1a0b05, 0 3px 4px rgba(0,0,0,0.4); text-shadow: 1px 1px 2px #000; font-size: 0.8rem;
        }
        button:hover:not(:disabled) { background: linear-gradient(to bottom, #6e462a, #4a2e1b); transform: translateY(1px); box-shadow: 0 2px 0 #1a0b05; }
        button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 #1a0b05; }
        button:disabled { background: #c5a059; color: #fff; box-shadow: 0 2px 0 #8b5a2b; cursor: not-allowed; border-color: #8b5a2b; transform: translateY(1px); text-shadow: none;}
        
        .btn-dispatch { background: linear-gradient(to bottom, #900c3f, #581845); border-color: #2c0808; box-shadow: 0 3px 0 #2c0808; padding: 4px 8px; font-size:0.75rem;}
        select { padding: 4px; background: #fff; color: #2e1b0f; border: 1px solid #a68b6c; border-radius: 3px; font-family: inherit; font-weight: bold; outline: none; font-size: 0.75rem; flex: 1;}
        
        #log-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: linear-gradient(to bottom, rgba(46, 29, 21, 0.95), rgba(28, 16, 11, 0.95)); padding: 15px 30px; border-radius: 4px; border: 2px solid var(--border-gold); display: none; z-index: 100; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
        #log-text { color: #f4e8d3; font-weight: 700; font-size: 1.1rem; text-shadow: 1px 1px 3px #000; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.3); border-radius: 3px; }
    </style>
</head>
<body>

    <header>
        <div class="guild-title">⚔️ 픽셀 용병 길드</div>
        <div class="guild-stats">
            <div class="time-container">
                <div class="time-text" id="ui-time">DAY 1 [ 08:00 ]</div>
                <div class="time-bg"><div class="time-fill" id="ui-time-bar"></div></div>
            </div>
            <div class="money-text">길드 자금 🪙 <span id="ui-money">1,000</span> G</div>
        </div>
    </header>

    <div class="view-toggle">
        <button class="view-btn active" id="btn-view-ledger" onclick="switchView('ledger')">📝 서류 명부 보기</button>
        <button class="view-btn" id="btn-view-floor" onclick="switchView('floor')">👀 길드 내부 시점</button>
    </div>

    <main>
        <!-- 📜 뷰 1: 거대 양피지 명부 -->
        <section class="ledger" id="view-ledger">
            <div class="ledger-header">
                <div class="ledger-title">🖋️ 길드 소속 용병 관리부</div>
                <div style="font-size:0.85rem; font-weight:bold; color:#5d4037;">* 용병들은 스스로 의뢰를 판단하고 수락합니다.</div>
            </div>
            <div class="ledger-content" id="roster-list"></div>
        </section>

        <!-- 🍻 뷰 2: 길드 바닥 (애니메이션) -->
        <section id="view-floor" style="display: none;">
            <div id="floor-container">
                <div class="facility-marker fac-bar">🍺 주점 구역</div>
                <div class="facility-marker fac-sleep">🛏️ 여관 구역</div>
                <div class="facility-marker fac-train">🎯 훈련장</div>
                <!-- 용병 픽셀 아바타들이 돌아다니는 곳 -->
            </div>
        </section>

        <!-- 📌 우측: 사이드 보드 -->
        <aside class="sidebar">
            <div class="board">
                <div class="board-header">🍺 선술집 가입 지원서</div>
                <div class="board-content" id="tavern-list"></div>
            </div>
            <div class="board">
                <div class="board-header">📜 현재 접수된 의뢰</div>
                <div class="board-content" id="quest-list"></div>
            </div>
        </aside>
    </main>

    <div id="log-container"><span id="log-text"></span></div>

    <script>
        const CLASS_DB = {
            "W_0": { tier: 0, name: "초보 전사", color: "#c0392b", nextJobs: ["W_1"], reqLevel: 0, promoteCost: 0 },
            "W_1": { tier: 1, name: "검사", color: "#e74c3c", nextJobs: ["W_2A", "W_2B"], reqLevel: 5, promoteCost: 1500 },
            "W_2A": { tier: 2, name: "기사", color: "#922b21", nextJobs: ["W_3A1", "W_3A2"], reqLevel: 15, promoteCost: 8000 },
            "W_2B": { tier: 2, name: "광전사", color: "#7b241c", nextJobs: ["W_3B1", "W_3B2"], reqLevel: 15, promoteCost: 8000 },
            "W_3A1": { tier: 3, name: "성기사", color: "#f1c40f", nextJobs: [], reqLevel: 30, promoteCost: 30000 },
            "W_3A2": { tier: 3, name: "다크나이트", color: "#4a235a", nextJobs: [], reqLevel: 30, promoteCost: 30000 },
            "W_3B1": { tier: 3, name: "워로드", color: "#641e16", nextJobs: [], reqLevel: 30, promoteCost: 30000 },
            "W_3B2": { tier: 3, name: "블러드마스터", color: "#a93226", nextJobs: [], reqLevel: 30, promoteCost: 30000 },

            "A_0": { tier: 0, name: "초보 궁수", color: "#27ae60", nextJobs: ["A_1"], reqLevel: 0, promoteCost: 0 },
            "A_1": { tier: 1, name: "헌터", color: "#2ecc71", nextJobs: ["A_2A", "A_2B"], reqLevel: 5, promoteCost: 1500 },
            "A_2A": { tier: 2, name: "스나이퍼", color: "#1e8449", nextJobs: ["A_3A1"], reqLevel: 15, promoteCost: 8000 }, 
            "A_2B": { tier: 2, name: "트래퍼", color: "#145a32", nextJobs: ["A_3B1"], reqLevel: 15, promoteCost: 8000 },
            "A_3A1": { tier: 3, name: "보우마스터", color: "#117a65", nextJobs: [], reqLevel: 30, promoteCost: 30000 },
            "A_3B1": { tier: 3, name: "생존전문가", color: "#0b5345", nextJobs: [], reqLevel: 30, promoteCost: 30000 },

            "R_0": { tier: 0, name: "초보 도적", color: "#7f8c8d", nextJobs: ["R_1"], reqLevel: 0, promoteCost: 0 },
            "R_1": { tier: 1, name: "암살자", color: "#95a5a6", nextJobs: ["R_2A", "R_2B"], reqLevel: 5, promoteCost: 1500 },
            "R_2A": { tier: 2, name: "섀도우", color: "#34495e", nextJobs: ["R_3A1"], reqLevel: 15, promoteCost: 8000 },
            "R_2B": { tier: 2, name: "시프마스터", color: "#2c3e50", nextJobs: ["R_3B1"], reqLevel: 15, promoteCost: 8000 },
            "R_3A1": { tier: 3, name: "나이트로드", color: "#1a252f", nextJobs: [], reqLevel: 30, promoteCost: 30000 },
            "R_3B1": { tier: 3, name: "팬텀", color: "#5d6d7e", nextJobs: [], reqLevel: 30, promoteCost: 30000 },

            "M_0": { tier: 0, name: "초보 마법사", color: "#8e44ad", nextJobs: ["M_1"], reqLevel: 0, promoteCost: 0 },
            "M_1": { tier: 1, name: "워록", color: "#9b59b6", nextJobs: ["M_2A", "M_2B"], reqLevel: 5, promoteCost: 1500 },
            "M_2A": { tier: 2, name: "아크메이지", color: "#5b2c6f", nextJobs: ["M_3A1"], reqLevel: 15, promoteCost: 8000 },
            "M_2B": { tier: 2, name: "서머너", color: "#4a235a", nextJobs: ["M_3B1"], reqLevel: 15, promoteCost: 8000 },
            "M_3A1": { tier: 3, name: "엘리멘탈마스터", color: "#154360", nextJobs: [], reqLevel: 30, promoteCost: 30000 },
            "M_3B1": { tier: 3, name: "일루저니스트", color: "#1b4f72", nextJobs: [], reqLevel: 30, promoteCost: 30000 },

            "C_0": { tier: 0, name: "초보 성직자", color: "#e67e22", nextJobs: ["C_1"], reqLevel: 0, promoteCost: 0 },
            "C_1": { tier: 1, name: "프리스트", color: "#d35400", nextJobs: ["C_2A", "C_2B"], reqLevel: 5, promoteCost: 1500 },
            "C_2A": { tier: 2, name: "비숍", color: "#a04000", nextJobs: ["C_3A1"], reqLevel: 15, promoteCost: 8000 },
            "C_2B": { tier: 2, name: "이단심문관", color: "#873600", nextJobs: ["C_3B1"], reqLevel: 15, promoteCost: 8000 },
            "C_3A1": { tier: 3, name: "세인트", color: "#6e2c00", nextJobs: [], reqLevel: 30, promoteCost: 30000 },
            "C_3B1": { tier: 3, name: "팔라딘", color: "#784212", nextJobs: [], reqLevel: 30, promoteCost: 30000 },
        };

        const BASE_CLASSES = ["W_0", "A_0", "R_0", "M_0", "C_0"];
        const NAMES = ["아서", "렌", "엘리스", "바츠", "카일", "루시", "테오", "세리아", "카론", "제이드", "로웬", "미아"];

        let guild = { day: 1, hour: 8, money: 1000, currentView: 'ledger', roster: [], tavern: [], quests: [] };

        const FACILITIES = {
            drink: { name: "주점", cost: 50, time: 3, stamRecover: 30 },
            sleep: { name: "여관", cost: 150, time: 10, stamRecover: 100 },
            train: { name: "훈련장", cost: 400, time: 15, powerUp: 5 }
        };

        class Mercenary {
            constructor(id) {
                this.id = id || 'M_' + Date.now() + Math.floor(Math.random() * 10000);
                this.name = NAMES[Math.floor(Math.random() * NAMES.length)];
                this.jobId = BASE_CLASSES[Math.floor(Math.random() * BASE_CLASSES.length)];
                
                this.level = 1; this.exp = 0;
                this.basePower = 15 + Math.floor(Math.random() * 10);
                this.money = 100 + Math.floor(Math.random() * 50); 
                this.hireBonus = this.money; 
                
                this.stamina = 100; this.maxStamina = 100;
                this.status = 'idle'; 
                this.actionTimeLeft = 0; this.actionTotalTime = 0; this.currentAction = null; 
                this.thought = "의뢰를 찾아볼까..."; 
                
                // 🚶 이동 애니메이션을 위한 좌표
                this.tx = 30 + Math.random() * 40;
                this.ty = 30 + Math.random() * 40;
            }

            get job() { return CLASS_DB[this.jobId]; }
            get maxExp() { return this.level * 100; }
            get power() { return Math.floor(this.basePower * (1 + this.level * 0.15) * (this.job.tier + 1)); }
            get currentWage() { return Math.floor(10 * Math.pow(1.2, this.level - 1) * Math.pow(2, this.job.tier)); }
            
            // 🎨 [복구됨] 정통 레트로 픽셀 아트 API (주점 감성에 완벽 매칭)
            get portraitUrl() { 
                return `https://api.dicebear.com/9.x/pixel-art/svg?seed=${this.id}`; 
            }

            addExp(amount) {
                this.exp += amount;
                if (this.exp >= this.maxExp) {
                    this.exp -= this.maxExp; this.level++;
                    showLog(`🎉 ${this.name} 레벨 업! (Lv.${this.level})`);
                }
            }

            think() {
                if(this.status !== 'idle') return;
                
                // 위치 무작위 배회 로직
                if(Math.random() < 0.3) {
                    this.tx = 15 + Math.random() * 70; // 바닥 안에서 랜덤 배회
                    this.ty = 15 + Math.random() * 70;
                }

                if(Math.random() > 0.4) return; // 1초마다 40% 확률로 생각 행동

                if(this.job.nextJobs.length > 0) {
                    let nextJob = CLASS_DB[this.job.nextJobs[0]];
                    if(this.level >= nextJob.reqLevel && this.money >= nextJob.promoteCost) {
                        this.money -= nextJob.promoteCost; guild.money += nextJob.promoteCost; 
                        this.jobId = this.job.nextJobs[Math.floor(Math.random() * this.job.nextJobs.length)];
                        showLog(`📜 ${this.name} ✨ [${this.job.name}](으)로 전직! (수입 +${nextJob.promoteCost}G)`);
                        return;
                    }
                }

                if(this.stamina < 40) {
                    if(this.money >= FACILITIES.sleep.cost) { this.useFacility('sleep'); return; } 
                    else if (this.money >= FACILITIES.drink.cost) { this.useFacility('drink'); return; } 
                    else { this.thought = "돈이 없어 노숙해야겠군..."; return; }
                }

                if(this.stamina > 70 && this.money >= FACILITIES.train.cost + 200 && Math.random() < 0.3) { 
                    this.useFacility('train'); return; 
                }

                if(this.stamina >= 20) {
                    let available = guild.quests.filter(q => !q.assignedMercId);
                    if(available.length > 0) {
                        available.sort((a,b) => b.reward - a.reward);
                        for(let q of available) {
                            if(this.stamina >= q.reqStamina && Math.floor((this.power / q.reqPower) * 70) >= 40) {
                                this.stamina -= q.reqStamina; this.status = 'questing';
                                q.assignedMercId = this.id; this.thought = `[${q.title}] 다녀오겠습니다!`; return;
                            }
                        }
                        this.thought = "딱히 마음에 드는 의뢰가 없네.";
                    } else { this.thought = "의뢰 게시판이 텅 비었군."; }
                }
            }

            useFacility(type) {
                let fac = FACILITIES[type];
                this.money -= fac.cost; guild.money += fac.cost; 
                this.status = type === 'train' ? 'training' : 'resting';
                this.currentAction = type;
                this.actionTotalTime = fac.time; this.actionTimeLeft = fac.time;
                this.thought = `[${fac.name}] 이용 중...`;
                
                // 🏃 시설 위치로 이동
                if(type === 'drink') { this.tx = 10 + Math.random()*15; this.ty = 10 + Math.random()*15; }
                else if(type === 'sleep') { this.tx = 75 + Math.random()*15; this.ty = 10 + Math.random()*15; }
                else if(type === 'train') { this.tx = 75 + Math.random()*15; this.ty = 75 + Math.random()*15; }
            }
        }

        class Quest {
            constructor() {
                this.id = 'Q_' + Date.now() + Math.floor(Math.random()*100);
                this.title = ["고블린 토벌", "상단 호위", "도적단 추적", "묘지 탐색", "마수 정찰", "약초 채집"][Math.floor(Math.random()*6)];
                this.timeTotal = 6 + Math.floor(Math.random() * 10);
                this.timeLeft = this.timeTotal;
                let baseReq = 15 + (guild.day * 2);
                this.reqPower = Math.floor(baseReq * (0.7 + Math.random() * 0.6));
                this.reqStamina = 20 + Math.floor(Math.random() * 20); 
                this.reward = this.reqPower * (5 + Math.floor(Math.random() * 5)); 
                this.expReward = this.reqPower * 2;
                this.assignedMercId = null;
            }
        }

        // ==========================================
        // 👁️ 시점 컨트롤 함수
        // ==========================================
        function switchView(viewName) {
            guild.currentView = viewName;
            document.getElementById('view-ledger').style.display = viewName === 'ledger' ? 'flex' : 'none';
            document.getElementById('view-floor').style.display = viewName === 'floor' ? 'block' : 'none';
            
            document.getElementById('btn-view-ledger').className = viewName === 'ledger' ? 'view-btn active' : 'view-btn';
            document.getElementById('btn-view-floor').className = viewName === 'floor' ? 'view-btn active' : 'view-btn';
            
            updateAll();
        }

        function updateHeader() {
            document.getElementById('ui-time').innerText = `DAY ${guild.day} [ ${guild.hour.toString().padStart(2, '0')}:00 ]`;
            document.getElementById('ui-time-bar').style.width = `${(guild.hour / 24) * 100}%`;
            document.getElementById('ui-money').innerText = guild.money.toLocaleString();
        }

        function renderLedger() {
            const container = document.getElementById('roster-list');
            container.innerHTML = '';
            let availableQuests = guild.quests.filter(q => !q.assignedMercId);

            guild.roster.forEach((merc) => {
                let div = document.createElement('div'); div.className = 'ledger-row';
                
                let infoHTML = `
                    <div class="portrait-box"><img src="${merc.portraitUrl}"></div>
                    <div class="info-col">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span class="merc-name">${merc.name}</span>
                            <span class="merc-class" style="background:${merc.job.color}">${merc.job.name}</span>
                            <span style="font-size:0.85rem; font-weight:900; color:#8c7355;">Lv.${merc.level}</span>
                        </div>
                        <div style="display:flex; gap:12px;">
                            <span class="stat-text">⚔️ ${merc.power}</span>
                            <span class="stat-text" style="color:#1e8449;">개인 소지금: 🪙${merc.money.toLocaleString()}G</span>
                        </div>
                        <div class="bar-wrap">
                            <span style="color:#2980b9;">활력</span>
                            <div class="progress-bg"><div class="fill-stamina" style="width: ${(merc.stamina / merc.maxStamina)*100}%;"></div></div>
                            <span style="width:40px; text-align:right;">${merc.stamina}/${merc.maxStamina}</span>
                        </div>
                    </div>
                `;

                let actionHTML = `<div class="action-col">`;
                actionHTML += `<div class="thought-bubble">💬 "${merc.thought}"</div>`;

                if(merc.status === 'idle') {
                    let questOptions = availableQuests.map(q => `<option value="${q.id}">[${q.reqPower}⚔️] ${q.title}</option>`).join('');
                    actionHTML += `
                        <div style="display:flex; gap:5px; margin-top:8px;">
                            <select id="select-quest-${merc.id}">
                                ${availableQuests.length > 0 ? questOptions : '<option disabled selected>의뢰 없음</option>'}
                            </select>
                            <button class="btn-dispatch" onclick="suggestQuest('${merc.id}')" ${availableQuests.length === 0 ? 'disabled' : ''}>제안하기</button>
                        </div>
                    `;
                } else if (merc.status === 'questing') {
                    let q = guild.quests.find(q => q.assignedMercId === merc.id);
                    actionHTML += `
                        <div class="progress-bg" style="height:12px; margin-top:10px;"><div class="fill-action" style="width: ${((q.timeTotal - q.timeLeft)/q.timeTotal)*100}%;"></div></div>
                        <div style="text-align:right; font-size:0.8rem; font-weight:bold; margin-top:2px;">남은 시간: ⏳${q.timeLeft}h</div>
                    `;
                } else {
                    actionHTML += `
                        <div class="progress-bg" style="height:12px; margin-top:10px;"><div class="fill-action" style="width: ${((merc.actionTotalTime - merc.actionTimeLeft)/merc.actionTotalTime)*100}%;"></div></div>
                        <div style="text-align:right; font-size:0.8rem; font-weight:bold; margin-top:2px;">남은 시간: ⏳${merc.actionTimeLeft}h</div>
                    `;
                }

                actionHTML += `</div>`;
                div.innerHTML = infoHTML + actionHTML;
                container.appendChild(div);
            });
        }

        // 👁️ [신규] 길드 바닥 애니메이션 렌더링
        function renderFloor() {
            const container = document.getElementById('floor-container');
            
            guild.roster.forEach(merc => {
                let el = document.getElementById('sprite-' + merc.id);
                
                if(merc.status === 'questing') {
                    if(el) el.remove(); // 파견 나갔으므로 화면에서 숨김
                    return;
                }
                
                if(!el) {
                    el = document.createElement('div');
                    el.id = 'sprite-' + merc.id;
                    el.className = 'merc-sprite';
                    el.innerHTML = `
                        <div class="floor-bubble" id="bubble-${merc.id}"></div>
                        <img src="${merc.portraitUrl}" alt="portrait">
                        <div class="floor-name" style="background:${merc.job.color}">${merc.name}</div>
                    `;
                    container.appendChild(el);
                }
                
                // CSS 트랜지션을 이용해 자연스럽게 좌표로 이동
                el.style.left = merc.tx + '%';
                el.style.top = merc.ty + '%';
                
                document.getElementById('bubble-' + merc.id).innerText = merc.thought;
            });
        }

        function renderSidebar() {
            const tavernCont = document.getElementById('tavern-list');
            tavernCont.innerHTML = '';
            guild.tavern.forEach((merc, index) => {
                tavernCont.innerHTML += `
                    <div class="slip">
                        <div class="slip-title">지원자: ${merc.name} <span class="merc-class" style="background:${merc.job.color}; font-size:0.6rem;">${merc.job.name}</span></div>
                        <div class="slip-desc">
                            <span>전투력: ⚔️${merc.power} | 희망 계약금: 🪙${merc.hireBonus}G</span>
                            <button onclick="hireMerc(${index})" style="margin-top:4px;" ${guild.money < merc.hireBonus ? 'disabled' : ''}>지원금 지불 및 고용</button>
                        </div>
                    </div>
                `;
            });

            const questCont = document.getElementById('quest-list');
            questCont.innerHTML = '';
            guild.quests.forEach((q) => {
                let statusText = q.assignedMercId ? `<span style="color:#c0392b;">[진행 중]</span>` : `<span style="color:#1e8449;">[모집 중]</span>`;
                questCont.innerHTML += `
                    <div class="slip">
                        <div class="slip-title">${statusText} ${q.title}</div>
                        <div class="slip-desc">
                            <span>권장 전투력: ⚔️${q.reqPower} | 필요 활력: ⚡${q.reqStamina}</span>
                            <span>총 보상금: 🪙${q.reward}G</span>
                        </div>
                    </div>
                `;
            });
        }

        function showLog(msg, isFail = false) {
            const logBox = document.getElementById('log-container');
            const logText = document.getElementById('log-text');
            logText.innerHTML = msg;
            if(isFail) { logBox.style.borderColor = "var(--red-fail)"; logText.style.color = "#ffcccc"; } 
            else { logBox.style.borderColor = "var(--border-gold)"; logText.style.color = "var(--parchment)"; }
            logBox.style.display = 'block';
            setTimeout(() => { logBox.style.display = 'none'; }, 3000);
        }

        function hireMerc(index) {
            let merc = guild.tavern[index];
            if (guild.money >= merc.hireBonus) {
                guild.money -= merc.hireBonus;
                guild.roster.push(merc);
                guild.tavern.splice(index, 1);
                showLog(`🤝 ${merc.name} 합류! (지원금 지급 완료)`);
                updateAll();
            }
        }

        function suggestQuest(mercId) {
            let selectBox = document.getElementById(`select-quest-${mercId}`);
            if(!selectBox || !selectBox.value) return;
            let questId = selectBox.value;
            let merc = guild.roster.find(m => m.id === mercId);
            let quest = guild.quests.find(q => q.id === questId);

            if(merc.stamina < quest.reqStamina) { merc.thought = "피곤해서 못 갑니다."; updateAll(); return; }
            if(Math.floor((merc.power / quest.reqPower) * 70) < 25) { merc.thought = "죽으라는 겁니까? 거절합니다."; updateAll(); return; }

            merc.stamina -= quest.reqStamina; merc.status = 'questing';
            quest.assignedMercId = mercId; merc.thought = `길드장님의 추천으로 출발!`;
            updateAll();
        }

        function updateAll() { 
            updateHeader(); 
            if(guild.currentView === 'ledger') renderLedger(); 
            if(guild.currentView === 'floor') renderFloor();
            renderSidebar(); 
        }

        // ==========================================
        // ⏳ 시간 흐름 및 AI 루프
        // ==========================================
        setInterval(() => {
            let updated = false;

            guild.hour++;
            guild.roster.forEach(m => { if(m.status === 'idle') m.stamina = Math.min(m.maxStamina, m.stamina + 2); });

            if (guild.hour >= 24) {
                guild.hour = 0; guild.day++;
                let maintenance = guild.roster.length * 30; guild.money -= maintenance;
                showLog(`🌙 자정입니다. 길드 시설 유지비 -${maintenance} G 납부됨`);
                updated = true;
            }
            if (guild.hour === 6) {
                guild.tavern = [new Mercenary(), new Mercenary(), new Mercenary()];
                guild.quests.push(new Quest()); if(guild.quests.length > 5) guild.quests.shift();
                updated = true;
            }

            // 🧠 용병 행동 AI 및 위치 갱신
            guild.roster.forEach(merc => merc.think());

            guild.roster.forEach(merc => {
                if(merc.status === 'resting' || merc.status === 'training') {
                    merc.actionTimeLeft--; updated = true;
                    if(merc.actionTimeLeft <= 0) {
                        let fac = FACILITIES[merc.currentAction];
                        if(merc.currentAction === 'train') { merc.basePower += fac.powerUp; merc.thought = "훈련 완료! 강해졌다!"; } 
                        else { merc.stamina = Math.min(merc.maxStamina, merc.stamina + fac.stamRecover); merc.thought = "푹 쉬었군."; }
                        merc.status = 'idle'; merc.currentAction = null;
                    }
                }
            });

            guild.quests.forEach((q, idx) => {
                if (q.assignedMercId) {
                    q.timeLeft--; updated = true;
                    if (q.timeLeft <= 0) {
                        let merc = guild.roster.find(m => m.id === q.assignedMercId);
                        if(merc) {
                            merc.status = 'idle';
                            merc.tx = 50; merc.ty = 80; // 퀘스트 복귀 시 입구(아래쪽)로 등장
                            
                            let winChance = Math.min(95, Math.max(10, Math.floor((merc.power / q.reqPower) * 70))); 
                            if(Math.random() * 100 <= winChance) {
                                let guildCut = Math.floor(q.reward * 0.2); let mercCut = q.reward - guildCut;
                                guild.money += guildCut; merc.money += mercCut; merc.addExp(q.expReward);
                                merc.thought = "의뢰 성공! 돈 벌었다!";
                                showLog(`💰 ${merc.name} 의뢰 성공! (수수료 수입: +${guildCut} G)`);
                            } else {
                                merc.addExp(Math.floor(q.expReward / 2)); merc.thought = "너무 아팠다... 실패함.";
                                showLog(`🩸 [실패] ${merc.name} 의뢰 실패...`, true);
                            }
                        }
                        guild.quests.splice(idx, 1);
                        if(guild.quests.length < 3) guild.quests.push(new Quest());
                    }
                }
            });

            updateAll();
        }, 1000);

        guild.tavern = [new Mercenary(), new Mercenary(), new Mercenary()];
        for(let i=0;i<4;i++) guild.quests.push(new Quest());
        updateAll();

    </script>
</body>
</html>

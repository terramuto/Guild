<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판타지 용병 길드 (1인칭 시점)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0604;
            --wall-color: #1a0f0a; 
            --floor-color: #2c1a11;
            --gold: #f1c40f; --text-light: #fdf5e6;
            --font-main: 'Noto Sans KR', sans-serif;
            --ui-bg: rgba(15, 10, 5, 0.95); --ui-border: #8b5a2b;
        }

        body {
            background-color: var(--bg-dark); color: var(--text-light); font-family: var(--font-main);
            margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none;
        }

        /* 📖 직업 도감 모달 */
        #dict-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 900;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center;
        }
        .dict-box {
            background: var(--ui-bg); padding: 25px; border-radius: 8px; border: 2px solid #3498db;
            width: 80%; max-width: 800px; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .dict-title { color: #3498db; font-size: 1.5rem; font-weight: 900; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #3498db; padding-bottom: 10px;}
        .dict-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .dict-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; border-left: 4px solid; }

        /* 🏰 상단 길드 정보창 & 네비게이션 탭 */
        header {
            position: relative; z-index: 100;
            background: var(--ui-bg); padding: 15px 30px; border-bottom: 3px solid var(--ui-border);
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .guild-title { font-size: 1.5rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        .guild-stats { display: flex; gap: 25px; align-items: center; font-weight: 700; font-size: 1rem;}
        
        .time-wrapper { display: flex; flex-direction: column; gap: 4px; align-items: center;}
        .time-header { display: flex; gap: 10px; align-items: center;}
        .time-text { font-weight: 900; font-family: monospace; font-size: 1.2rem; }
        .time-bg { width: 220px; height: 6px; background: #000; border-radius: 3px; border: 1px solid #555;}
        .time-fill { height: 100%; background: linear-gradient(90deg, #f1c40f, #e67e22, #3498db); width: 0%; transition: width 0.1s linear;}
        
        .money-text { color: var(--gold); font-size: 1.3rem; }
        .capacity-text { color: #2ecc71; }

        /* 네비게이션 탭 버튼 */
        .nav-tabs { display: flex; gap: 10px; }
        .btn-tab { background: #34495e; color: #fff; border: 2px solid #111; padding: 8px 15px; border-radius: 4px; font-weight: 900; cursor: pointer; font-size: 1rem; transition: 0.2s;}
        .btn-tab.active { background: #e67e22; border-color: #d35400; box-shadow: 0 0 10px rgba(230, 126, 34, 0.5); }
        .btn-speed { background: #555; color: #fff; border: 1px solid #111; padding: 4px 10px; border-radius: 4px; font-weight: 900; cursor: pointer; font-size: 0.9rem;}
        .btn-dict { background: #27ae60; color: #fff; border: 1px solid #111; padding: 4px 10px; border-radius: 4px; font-weight: 900; cursor: pointer; font-size: 0.9rem;}

        main { position: relative; width: 100%; flex: 1; display: flex; overflow: hidden;}

        /* ================== 👁️ 뷰 1: 1인칭 길드장 시점 (Hall) ================== */
        #view-hall {
            width: 100%; height: 100%; position: relative; display: block;
            background: linear-gradient(to bottom, var(--bg-dark) 0%, var(--wall-color) 35%, var(--floor-color) 35%, #1a0f0a 100%);
            box-shadow: inset 0 0 200px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* 길드 바닥 원근감 선 (디테일) */
        .hall-perspective {
            position: absolute; top: 35%; left: 0; width: 100%; height: 65%;
            background-image: 
                linear-gradient(to right, transparent 49.8%, rgba(0,0,0,0.5) 49.8%, rgba(0,0,0,0.5) 50.2%, transparent 50.2%),
                linear-gradient(25deg, transparent 49.8%, rgba(0,0,0,0.3) 49.8%, rgba(0,0,0,0.3) 50.2%, transparent 50.2%),
                linear-gradient(-25deg, transparent 49.8%, rgba(0,0,0,0.3) 49.8%, rgba(0,0,0,0.3) 50.2%, transparent 50.2%);
            pointer-events: none; z-index: 1;
        }

        /* 🪑 길드장 책상 (1인칭 전경) */
        .gm-desk {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 80px;
            background: linear-gradient(to bottom, #4a2e15, #110803);
            border-top: 4px solid #000; box-shadow: 0 -15px 30px rgba(0,0,0,0.9);
            z-index: 50; display: flex; justify-content: center; align-items: flex-start;
        }
        .desk-props {
            font-size: 2.5rem; margin-top: -15px; text-shadow: 2px 5px 5px rgba(0,0,0,0.8);
            display: flex; gap: 400px; opacity: 0.8;
        }

        /* 시설 스탠드 (배경) */
        .facility-stand {
            position: absolute; transform: translate(-50%, -100%);
            display: flex; flex-direction: column; align-items: center; z-index: 2;
        }
        .fac-sign {
            background: rgba(0,0,0,0.8); color: #fff; padding: 5px 15px; border-radius: 4px;
            border: 2px solid; font-weight: 900; text-shadow: 1px 1px 2px #000; margin-bottom: 5px; box-shadow: 0 5px 10px rgba(0,0,0,0.8);
        }

        /* 🚶 용병 아바타 (원근감 적용) */
        .merc-sprite {
            position: absolute; 
            /* 바닥 기준점(발)을 (x, y)에 맞추기 위해 translate(-50%, -100%) 사용 */
            transform: translate(-50%, -100%); 
            transition: top 0.3s linear, left 0.3s linear, transform 0.3s linear;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end; 
        }
        
        .floor-bubble {
            position: absolute; bottom: 75px; background: #fff; color: #111; font-size: 0.85rem; font-weight: 900; 
            padding: 8px 14px; border-radius: 8px; width: max-content; max-width: 180px; text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .floor-bubble.show { opacity: 1; }

        .merc-emblem {
            width: 60px; height: 60px; border-radius: 50%; border: 3px solid; 
            overflow: hidden; background: #fff; 
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 15px rgba(0,0,0,0.8), inset 0 0 5px rgba(0,0,0,0.3);
        }
        .merc-emblem img { width: 100%; height: 100%; object-fit: cover; }

        .nameplate {
            background: rgba(0,0,0,0.9); padding: 3px 8px; border-radius: 4px; border: 1px solid #555;
            display: flex; flex-direction: column; align-items: center; gap: 3px; margin-top: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6);
        }
        .name-text { font-size: 0.75rem; font-weight: 900; }
        .hp-bar-bg { width: 40px; height: 5px; background: #222; border-radius: 2px; overflow: hidden; }
        .hp-bar-fill { height: 100%; background: #3498db; width: 100%; }

        /* 🧙 NPC (스태프) 스프라이트 */
        .npc-emblem {
            width: 55px; height: 55px; border-radius: 8px; border: 2px solid #bdc3c7; 
            overflow: hidden; background: #2c3e50; box-shadow: 0 5px 10px rgba(0,0,0,0.8);
        }
        .npc-emblem img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8);}
        .npc-nameplate {
            background: #2c3e50; color: #ecf0f1; padding: 2px 6px; border-radius: 4px; border: 1px solid #7f8c8d;
            font-size: 0.7rem; font-weight: 900; margin-top: 5px; text-shadow: 1px 1px 1px #000;
        }

        /* ================== 📝 뷰 2: 길드 관리 (대시보드) ================== */
        #view-manage {
            width: 100%; height: 100%; background: var(--bg-dark); display: none; padding: 20px; box-sizing: border-box;
            grid-template-columns: 1fr 1fr; gap: 20px; overflow-y: auto;
        }
        .panel { background: var(--ui-bg); border: 2px solid var(--ui-border); border-radius: 8px; display: flex; flex-direction: column; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .panel-header { background: rgba(0,0,0,0.6); padding: 15px; font-weight: 900; font-size: 1.1rem; color: var(--gold); border-bottom: 2px solid var(--ui-border); text-align: center;}
        .panel-content { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }

        .list-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 6px; border: 1px solid #444; display: flex; flex-direction: column; gap: 6px; }
        .side-merc-info { display: flex; gap: 12px; align-items: center; }
        .mini-portrait { width: 45px; height: 45px; border-radius: 50%; border: 2px solid; object-fit: cover; background: #fff;}
        .list-title { display: flex; justify-content: space-between; font-weight: 900; font-size: 0.95rem; color: #fff;}
        .list-desc { font-size: 0.8rem; color: #ccc; display: flex; justify-content: space-between;}
        .prog-bg-side { width: 100%; height: 8px; background: #111; border-radius: 4px; overflow: hidden; margin-top: 4px;}
        .prog-fill-side { height: 100%; background: #e67e22; width: 0%; }

        button.upgrade-btn {
            background: linear-gradient(to bottom, #8e44ad, #5b2c6f); border: 2px solid #111; color: #fff;
            padding: 15px; border-radius: 6px; font-weight: 900; cursor: pointer; transition: 0.2s; margin: 15px; font-size: 1.1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        button.upgrade-btn:hover:not(:disabled) { background: linear-gradient(to bottom, #9b59b6, #732d91); transform: translateY(-2px);}
        button.upgrade-btn:disabled { background: #333; color: #777; cursor: not-allowed; transform: none; box-shadow: none;}

        #log-container { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(20, 10, 5, 0.95); padding: 12px 25px; border-radius: 8px; border: 2px solid #f1c40f; display: none; z-index: 200; box-shadow: 0 5px 15px rgba(0,0,0,0.8); pointer-events: none;}
        #log-text { color: #fff; font-weight: 900; font-size: 1rem; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: var(--ui-border); border-radius: 3px; }
    </style>
</head>
<body>

    <!-- 📖 직업 도감 화면 -->
    <div id="dict-screen">
        <div class="dict-box">
            <div class="dict-title">📖 길드 직업 트리 (총 35종)</div>
            <div class="dict-grid" id="dict-grid"></div>
            <button class="upgrade-btn" style="width:100%; margin: 20px 0 0 0;" onclick="document.getElementById('dict-screen').style.display='none'">닫기</button>
        </div>
    </div>

    <!-- 🏰 헤더 및 네비게이션 -->
    <header>
        <div style="display: flex; align-items: center; gap: 30px;">
            <div class="guild-title">길드 : 칠흑의 까마귀</div>
            <div class="nav-tabs">
                <button class="btn-tab active" id="tab-floor" onclick="switchTab('floor')">👀 길드 관찰</button>
                <button class="btn-tab" id="tab-manage" onclick="switchTab('manage')">📝 길드 관리</button>
            </div>
        </div>
        
        <div class="guild-stats">
            <div class="time-wrapper">
                <div class="time-header">
                    <div class="time-text" id="ui-time">DAY 1 [ 08:00 ]</div>
                    <button class="btn-speed" id="btn-speed" onclick="toggleSpeed()">▶ 1x</button>
                    <button class="btn-dict" onclick="openDict()">📖 도감</button>
                </div>
                <div class="time-bg"><div class="time-fill" id="ui-time-bar"></div></div>
            </div>
            <div class="capacity-text">👥 인원: <span id="ui-cap">0 / 5</span></div>
            <div class="money-text">자금 🪙 <span id="ui-money">500</span> G</div>
        </div>
    </header>

    <main>
        <!-- 👀 뷰 1: 1인칭 길드 관찰 화면 -->
        <div id="view-hall">
            <div class="hall-perspective"></div>
            
            <!-- 🪑 길드장 책상 (전경) -->
            <div class="gm-desk">
                <div class="desk-props">📜 🕯️ ☕</div>
            </div>

            <!-- 📍 1인칭용 시설 배경 (직원 NPC) -->
            <!-- 중앙: 게시판 -->
            <div class="facility-stand" id="fac-board">
                <div class="fac-sign" style="border-color:#f1c40f;">📜 의뢰 게시판</div>
                <div class="npc-emblem"><img src="https://api.dicebear.com/9.x/lorelei/svg?seed=Receptionist"></div>
                <div class="npc-nameplate">[접수원] 에일린</div>
            </div>
            
            <!-- 좌측: 여관 (뒤쪽) & 주점 (앞쪽) -->
            <div class="facility-stand" id="fac-inn">
                <div class="fac-sign" style="border-color:#3498db;">🛏️ 길드 여관</div>
                <div class="npc-emblem"><img src="https://api.dicebear.com/9.x/lorelei/svg?seed=Innkeeper"></div>
                <div class="npc-nameplate">[여관주인] 마사</div>
            </div>
            <div class="facility-stand" id="fac-tavern">
                <div class="fac-sign" style="border-color:#e67e22;">🍺 길드 주점</div>
                <div class="npc-emblem"><img src="https://api.dicebear.com/9.x/lorelei/svg?seed=Chef"></div>
                <div class="npc-nameplate">[주방장] 고든</div>
            </div>

            <!-- 우측: 훈련장 (뒤쪽) & 상점 (앞쪽) -->
            <div class="facility-stand" id="fac-train">
                <div class="fac-sign" style="border-color:#e74c3c;">🎯 훈련장</div>
                <div class="npc-emblem"><img src="https://api.dicebear.com/9.x/lorelei/svg?seed=Trainer"></div>
                <div class="npc-nameplate">[교관] 바론</div>
            </div>
            <div class="facility-stand" id="fac-shop">
                <div class="fac-sign" style="border-color:#9b59b6;">🛒 대장간 상점</div>
                <div class="npc-emblem"><img src="https://api.dicebear.com/9.x/lorelei/svg?seed=Blacksmith"></div>
                <div class="npc-nameplate">[대장장이] 브록</div>
            </div>
        </div>

        <!-- 📝 뷰 2: 길드 관리 화면 -->
        <div id="view-manage">
            <div class="panel" style="flex: 1;">
                <div class="panel-header">🛡️ 머무는 용병 명부</div>
                <div class="panel-content" id="roster-list"></div>
                <button class="upgrade-btn" id="btn-upgrade" onclick="upgradeGuild()">길드 증축 (최대 수용 인원 +2) : 1000G</button>
            </div>
            <div class="panel" style="flex: 1;">
                <div class="panel-header">📜 진행 및 대기 의뢰 (수수료 20%)</div>
                <div class="panel-content" id="quest-list"></div>
            </div>
        </div>
    </main>

    <div id="log-container"><span id="log-text"></span></div>

    <script>
        // ==========================================
        // 🌟 1. 데이터 베이스
        // ==========================================
        const NAMES = [
            "아서", "렌", "엘리스", "바츠", "카일", "루시", "테오", "세리아", "카론", "제이드", 
            "로웬", "미아", "에반", "루나", "시온", "프레이", "레온", "클레어", "디안", "노아"
        ];

        const IMAGE_DB = {
            "W_0": ["W1", "W2", "W3", "W4", "W5"], "A_0": ["A1", "A2", "A3", "A4", "A5"],
            "R_0": ["R1", "R2", "R3", "R4", "R5"], "M_0": ["M1", "M2", "M3", "M4", "M5"],
            "C_0": ["C1", "C2", "C3", "C4", "C5"]
        };

        const CLASS_DB = {

            "A_0": { tier: 0, name: "초보 궁수", color: "#2ecc71", nextJobs: ["A_1"], req: 0, cost: 0 },

            "A_3A1": { tier: 3, name: "보우마스터", color: "#117a65", nextJobs: [], req: 30, cost: 8000 },

            "R_0": { tier: 0, name: "초보 도적", color: "#95a5a6", nextJobs: ["R_1"], req: 0, cost: 0 },
            "R_1": { tier: 1, name: "암살자", color: "#7f8c8d", nextJobs: ["R_2A", "R_2B"], req: 5, cost: 500 },
            "R_2A": { tier: 2, name: "섀도우", color: "#34495e", nextJobs: ["R_3A1"], req: 15, cost: 2000 },
            "R_2B": { tier: 2, name: "시프마스터", color: "#2c3e50", nextJobs: ["R_3B1"], req: 15, cost: 2000 },
            "R_3A1": { tier: 3, name: "나이트로드", color: "#1a252f", nextJobs: [], req: 30, cost: 8000 },
            "R_3B1": { tier: 3, name: "팬텀", color: "#5d6d7e", nextJobs: [], req: 30, cost: 8000 },

            "M_2A": { tier: 2, name: "아크메이지", color: "#5b2c6f", nextJobs: ["M_3A1"], req: 15, cost: 2000 },

            "M_3B1": { tier: 3, name: "일루저니스트", color: "#1b4f72", nextJobs: [], req: 30, cost: 8000 },

            "C_0": { tier: 0, name: "초보 성직자", color: "#f1c40f", nextJobs: ["C_1"], req: 0, cost: 0 },
            "C_1": { tier: 1, name: "프리스트", color: "#f39c12", nextJobs: ["C_2A", "C_2B"], req: 5, cost: 500 },
            "C_2A": { tier: 2, name: "비숍", color: "#d35400", nextJobs: ["C_3A1"], req: 15, cost: 2000 },
            "C_2B": { tier: 2, name: "이단심문관", color: "#ba4a00", nextJobs: ["C_3B1"], req: 15, cost: 2000 },
            "C_3A1": { tier: 3, name: "세인트", color: "#e67e22", nextJobs: [], req: 30, cost: 8000 },
            "C_3B1": { tier: 3, name: "팔라딘", color: "#873600", nextJobs: [], req: 30, cost: 8000 }
        };
        const BASE_CLASSES = ["W_0", "A_0", "R_0", "M_0", "C_0"];
        const EQUIP_SHOP = [{ name: "강철 장비", cost: 300, powerUp: 20 }, { name: "미스릴 무기", cost: 1000, powerUp: 50 }, { name: "전설 무구", cost: 4000, powerUp: 150 }];

        // 🌟 1인칭 심도(Depth) 좌표계: Y값이 작을수록 멀고(작음), Y값이 클수록 가깝다(큼)
        // X: 좌우 (0~100), Y: 심도 (0~100)
        const FACILITIES = {
            board: { name: "게시판", x: 50, y: 10 },
            inn:   { name: "여관", cost: 100, duration: 480, stam: 100, x: 15, y: 25 },
            train: { name: "훈련", cost: 250, duration: 300, pwr: 5, x: 85, y: 25 },
            tavern:{ name: "주점", cost: 30, duration: 60, stam: 40, x: 25, y: 60 },
            shop:  { name: "상점", x: 75, y: 60 }
        };

        let guild = { timeMin: 480, money: 500, capacity: 5, upgradeCost: 1000, roster: [], quests: [] };
        let gameSpeed = 1; 

        function getDay() { return Math.floor(guild.timeMin / 1440) + 1; }
        function getHour() { return Math.floor(guild.timeMin / 60) % 24; }
        function getMin() { return Math.floor(guild.timeMin % 60); }
        function isGuildOpen() { let h = getHour(); return h >= 7 && h < 18; }

        // ==========================================
        // 2. 용병 & 파티 의뢰 객체
        // ==========================================
        class Mercenary {
            constructor() {
                this.id = 'M_' + Date.now() + Math.floor(Math.random() * 10000);
                this.name = NAMES[Math.floor(Math.random() * NAMES.length)];
                this.baseJobId = BASE_CLASSES[Math.floor(Math.random() * BASE_CLASSES.length)];
                this.jobId = this.baseJobId; 
                let seed = IMAGE_DB[this.baseJobId][Math.floor(Math.random() * 5)];
                this.portraitUrl = `https://api.dicebear.com/9.x/lorelei/svg?seed=${seed}&backgroundColor=transparent`;
                
                this.level = 1; this.exp = 0; this.equipTier = 0;
                this.basePower = 15 + Math.floor(Math.random() * 10);
                this.money = 150 + Math.floor(Math.random() * 50); 
                
                this.stamina = 100; this.status = 'idle'; 
                this.targetMin = 0; this.currentAction = null; 
                this.thought = "대기 중..."; this.showBubble = false; this.bubbleEnd = 0;
                
                // 생성 시 앞쪽(가까운 곳)에서 시작
                this.tx = 50; this.ty = 90; this.targetX = 50; this.targetY = 50;
            }

            get job() { return CLASS_DB[this.jobId]; }
            get power() { return Math.floor(this.basePower * (1 + this.level * 0.15) * (this.job.tier + 1)); }

            setThought(text, durationGameMins = 30) {
                this.thought = text; this.showBubble = true;
                this.bubbleEnd = guild.timeMin + durationGameMins;
            }

            think() {
                if(this.status !== 'idle') {
                    if(this.status === 'gathering' && Math.random()<0.2) this.setThought("파티원 기다리는 중...", 30);
                    return;
                }
                
                // 가끔 배회 (중앙 홀 30~80 심도)
                if(Math.random() < 0.1) { this.targetX = 30 + Math.random()*40; this.targetY = 30 + Math.random()*50; }
                if(Math.random() > 0.3) return;

                if(this.job.nextJobs && this.job.nextJobs.length > 0) {
                    let nextJobId = this.job.nextJobs[Math.floor(Math.random() * this.job.nextJobs.length)];
                    let nextJob = CLASS_DB[nextJobId];
                    if(this.level >= nextJob.req && this.money >= nextJob.cost) {
                        this.money -= nextJob.cost; guild.money += nextJob.cost; 
                        this.jobId = nextJobId;
                        this.setThought(`✨ [${nextJob.name}] 전직!`, 60); showLog(`📜 ${this.name} 전직 완료!`); return;
                    }
                }

                if(this.equipTier < EQUIP_SHOP.length) {
                    let eq = EQUIP_SHOP[this.equipTier];
                    if(this.money >= eq.cost + 50) { 
                        this.money -= eq.cost; guild.money += eq.cost;
                        this.equipTier++; this.basePower += eq.powerUp;
                        this.targetX = FACILITIES.shop.x; this.targetY = FACILITIES.shop.y;
                        this.setThought(`🛒 ${eq.name} 구매!`, 60); return;
                    }
                }

                let isNight = !isGuildOpen();

                if(this.stamina < 30 || (isNight && this.stamina < 90)) {
                    if(this.money >= FACILITIES.sleep.cost && this.stamina < 60) return this.useFacility('sleep');
                    if(this.money >= FACILITIES.drink.cost) return this.useFacility('drink');
                    if(isNight) return this.setThought("돈이 없어 강제 밤샘이네...", 40);
                    else return this.setThought("피곤한데 돈이 없군...", 40);
                }

                let trainChance = isNight ? 0.6 : 0.2;
                if(this.stamina > 50 && this.money >= FACILITIES.train.cost + 50 && Math.random() < trainChance) {
                    return this.useFacility('train');
                }

                if(!isNight && this.stamina >= 20) {
                    let avail = guild.quests.filter(q => !q.departed && (!q.isParty ? !q.assignedMercId : q.partyIds.length < q.maxParty)).sort((a,b) => b.reward - a.reward);
                    if(avail.length > 0) {
                        for(let q of avail) {
                            if(this.stamina >= q.reqStamina) {
                                if(!q.isParty) { 
                                    if(Math.floor((this.power / q.reqPower) * 70) >= 30) { 
                                        this.stamina -= q.reqStamina; this.status = 'questing';
                                        q.assignedMercId = this.id; q.departed = true;
                                        q.targetMin = guild.timeMin + q.durationMin; this.targetMin = q.targetMin;
                                        return this.setThought(`[${q.title}] 출격!`, 60);
                                    }
                                } else { 
                                    this.stamina -= q.reqStamina; this.status = 'gathering';
                                    q.partyIds.push(this.id);
                                    if(q.partyIds.length === 1) q.gatherStartMin = guild.timeMin;
                                    // 게시판 앞으로 이동
                                    this.targetX = FACILITIES.board.x + (Math.random()*20 - 10);
                                    this.targetY = FACILITIES.board.y + (Math.random()*10);
                                    return this.setThought(`[파티 합류] 대기중`, 60);
                                }
                            }
                        }
                    } else if(Math.random() < 0.1) this.setThought("의뢰가 없군...", 30);
                } else if(isNight && Math.random() < 0.1) {
                    this.setThought("게시판 마감이네.", 40);
                }
            }

            useFacility(type) {
                let fac = FACILITIES[type];
                this.money -= fac.cost; guild.money += fac.cost; 
                this.status = type === 'train' ? 'training' : 'resting';
                this.currentAction = type; this.targetMin = guild.timeMin + fac.duration;
                this.setThought(`[${fac.name}] 간다`, fac.duration);
                // 해당 시설 근처로 위치 지정
                this.targetX = fac.x + (Math.random()*10 - 5); this.targetY = fac.y + (Math.random()*10 - 5);
            }
        }

        class Quest {
            constructor() {
                this.id = 'Q_' + Date.now() + Math.floor(Math.random()*100);
                this.isParty = Math.random() < 0.35; 
                if(this.isParty) {
                    this.title = ["드래곤 수색(파티)", "산적단 소탕(파티)", "오크 군락(파티)", "지하 던전(파티)"][Math.floor(Math.random()*4)];
                    this.maxParty = 2 + Math.floor(Math.random() * 2); 
                    this.partyIds = []; this.gatherStartMin = null;
                } else {
                    this.title = ["고블린 토벌", "마차 호위", "도적단 추적", "묘지 정화", "약초 채집"][Math.floor(Math.random()*5)];
                    this.assignedMercId = null;
                }
                this.departed = false;
                this.durationMin = (2 + Math.floor(Math.random() * 6)) * 60; 
                let baseReq = 15 + (getDay() * 3);
                if(this.isParty) baseReq *= 2.5; 
                this.reqPower = Math.floor(baseReq * (0.6 + Math.random() * 0.8));
                this.reqStamina = 20 + Math.floor(Math.random() * 20); 
                this.reward = this.reqPower * (4 + Math.floor(Math.random() * 4)); 
                this.targetMin = 0;
            }
        }

        // ==========================================
        // 3. UI 조작 및 1인칭 렌더링
        // ==========================================
        function switchTab(tabId) {
            document.getElementById('view-hall').style.display = tabId === 'floor' ? 'block' : 'none';
            document.getElementById('view-manage').style.display = tabId === 'manage' ? 'grid' : 'none';
            document.getElementById('tab-floor').className = tabId === 'floor' ? 'btn-tab active' : 'btn-tab';
            document.getElementById('tab-manage').className = tabId === 'manage' ? 'btn-tab active' : 'btn-tab';
        }

        function toggleSpeed() {
            if(gameSpeed === 1) gameSpeed = 2; else if(gameSpeed === 2) gameSpeed = 5;
            else if(gameSpeed === 5) gameSpeed = 10; else gameSpeed = 1;
            document.getElementById('btn-speed').innerText = `▶ ${gameSpeed}x`;
        }

        function openDict() {
            let grid = document.getElementById('dict-grid'); grid.innerHTML = '';
            for(let key in CLASS_DB) {
                let c = CLASS_DB[key];
                let nextStr = c.nextJobs && c.nextJobs.length > 0 ? c.nextJobs.map(k=>CLASS_DB[k].name).join(', ') : '최고 랭크';
                grid.innerHTML += `
                    <div class="dict-item" style="border-color:${c.color}">
                        <div style="font-weight:900; color:${c.color}">${c.tier}차: ${c.name}</div>
                        <div style="font-size:0.8rem; color:#aaa; margin-top:4px;">다음: ${nextStr}</div>
                    </div>`;
            }
            document.getElementById('dict-screen').style.display = 'flex';
        }

        function updateUI() {
            let h = getHour().toString().padStart(2, '0'), m = getMin().toString().padStart(2, '0');
            let statusBadge = isGuildOpen() ? '<span style="color:#2ecc71; font-size:0.9rem;">[영업중]</span>' : '<span style="color:#e74c3c; font-size:0.9rem;">[마감됨]</span>';
            document.getElementById('ui-time').innerHTML = `DAY ${getDay()} [ ${h}:${m} ] ${statusBadge}`;
            document.getElementById('ui-time-bar').style.width = `${((getHour() + getMin() / 60) / 24) * 100}%`;
            document.getElementById('ui-money').innerText = Math.floor(guild.money).toLocaleString();
            document.getElementById('ui-cap').innerText = `${guild.roster.length} / ${guild.capacity}`;
            
            let btn = document.getElementById('btn-upgrade');
            btn.innerText = `길드 증축 (인원 +2) : ${guild.upgradeCost}G`; btn.disabled = guild.money < guild.upgradeCost;

            if(document.getElementById('view-manage').style.display !== 'none') {
                document.getElementById('quest-list').innerHTML = guild.quests.map(q => {
                    let status = "", ratio = 0;
                    let typeStr = q.isParty ? `<span style="color:#9b59b6;">[파티]</span>` : `<span style="color:#3498db;">[솔로]</span>`;
                    if(q.departed) {
                        let names = q.isParty ? q.partyIds.map(id => guild.roster.find(m=>m.id===id)?.name).join(', ') : (guild.roster.find(m=>m.id===q.assignedMercId)?.name || '?');
                        ratio = Math.max(0, (q.targetMin - guild.timeMin) / q.durationMin);
                        status = `<div style="font-size:0.8rem; color:#e74c3c; margin-top:5px;">[진행 중] ${names}</div><div class="prog-bg-side"><div class="prog-fill-side" style="width:${(1 - ratio)*100}%"></div></div>`;
                    } else {
                        if(q.isParty && q.partyIds.length > 0) {
                            let names = q.partyIds.map(id => guild.roster.find(m=>m.id===id)?.name).join(', ');
                            status = `<div style="font-size:0.8rem; color:#f1c40f; margin-top:5px;">[모집 중] ${names} (${q.partyIds.length}/${q.maxParty})</div>`;
                        } else {
                            status = `<div style="font-size:0.8rem; color:#2ecc71; margin-top:5px;">[대기 중] ${Math.floor(q.durationMin/60)}시간 소요</div>`;
                        }
                    }
                    return `<div class="list-item"><div class="list-title"><span>${typeStr} ${q.title}</span><span style="color:var(--gold)">🪙${q.reward}G</span></div><div class="list-desc"><span>권장전투력: ⚔️${q.reqPower} | 필요활력: ⚡${q.reqStamina}</span></div>${status}</div>`;
                }).join('');

                document.getElementById('roster-list').innerHTML = guild.roster.map(merc => {
                    let statusStr = merc.status === 'idle' ? '대기중' : (merc.status === 'gathering' ? '파티대기' : (merc.status === 'questing' ? '임무중' : '시설이용'));
                    let ext = "";
                    if(merc.status === 'resting' || merc.status === 'training') {
                        let fac = FACILITIES[merc.currentAction];
                        let ratio = Math.max(0, (merc.targetMin - guild.timeMin) / fac.duration);
                        ext = `<div class="prog-bg-side"><div class="prog-fill-side" style="background:#3498db; width:${(1 - ratio)*100}%"></div></div>`;
                    }
                    let emblem = `<div class="merc-emblem" style="width: 50px; height: 50px; border-width: 2px; border-color:${merc.job.color}; flex-shrink:0;"><img src="${merc.portraitUrl}" alt="img"></div>`;
                    return `<div class="list-item" style="border-left: 4px solid ${merc.job.color}">
                        <div class="side-merc-info">${emblem}<div style="flex:1;">
                        <div class="list-title"><span>${merc.name} <span style="font-size:0.75rem; color:#888;">Lv.${merc.level}</span></span><span style="font-size:0.85rem; color:#ccc;">${statusStr}</span></div>
                        <div class="list-desc" style="margin-top:2px;"><span>⚔️${merc.power} | ⚡${merc.stamina}</span><span style="color:var(--gold)">🪙${merc.money}G</span></div>
                        </div></div>${ext}</div>`;
                }).join('');
            }
        }

        // 🌟 1인칭 원근감(Scale & Z-index) 렌더링
        function renderFloor() {
            if(document.getElementById('view-hall').style.display === 'none') return;

            // 시설 배경(스탠드) 원근감 세팅 (최초 1회 배치)
            for(let key in FACILITIES) {
                let f = FACILITIES[key];
                let el = document.getElementById('fac-' + key);
                if(el) {
                    let yDepth = f.y; // 0:벽끝 ~ 100:내앞
                    let renderTop = 35 + (yDepth * 0.65); // 35% ~ 100% 화면 높이로 매핑
                    let scale = 0.5 + (yDepth * 0.006); // 멀면 작게, 가까우면 크게
                    
                    el.style.left = f.x + '%';
                    el.style.top = renderTop + '%';
                    el.style.transform = `translate(-50%, -100%) scale(${scale})`;
                    el.style.zIndex = Math.floor(yDepth);
                }
            }

            // 용병 아바타 렌더링
            const container = document.getElementById('view-hall');
            guild.roster.forEach(merc => {
                if(merc.showBubble && guild.timeMin >= merc.bubbleEnd) merc.showBubble = false;
                let el = document.getElementById('sprite-' + merc.id);
                
                if(merc.status === 'questing') { if(el) el.style.opacity = '0'; return; }
                
                if(!el) {
                    el = document.createElement('div'); el.id = 'sprite-' + merc.id; el.className = 'merc-sprite';
                    el.innerHTML = `
                        <div class="floor-bubble" id="bubble-${merc.id}"></div>
                        <div class="merc-emblem" style="border-color: ${merc.job.color}"><img src="${merc.portraitUrl}" alt="img"></div>
                        <div class="nameplate"><span class="name-text" style="color:${merc.job.color}">${merc.name}</span>
                        <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-${merc.id}"></div></div></div>`;
                    container.appendChild(el);
                } else el.style.opacity = '1';
                
                let spd = 0.1 * gameSpeed; 
                merc.tx += (merc.targetX - merc.tx) * Math.min(1, spd); 
                merc.ty += (merc.targetY - merc.ty) * Math.min(1, spd);
                
                // 🌟 원근감 (Perspective) 핵심 계산 🌟
                let yDepth = Math.max(0, Math.min(100, merc.ty)); // 0(멀다) ~ 100(가깝다)
                let renderTop = 35 + (yDepth * 0.65); // 바닥 시작점(35%)에서 화면 맨 아래(100%)로 매핑
                let scale = 0.5 + (yDepth * 0.007); // 0.5배율에서 최대 1.2배율까지 커짐

                el.style.left = merc.tx + '%'; 
                el.style.top = renderTop + '%';
                el.style.transform = `translate(-50%, -100%) scale(${scale})`;
                el.style.zIndex = Math.floor(yDepth) + 1; // Y값이 클수록(가까울수록) 화면 앞쪽에 렌더링
                
                document.getElementById('hp-' + merc.id).style.width = `${(merc.stamina / 100)*100}%`;
                let bubble = document.getElementById('bubble-' + merc.id);
                if(merc.showBubble) { bubble.innerText = merc.thought; bubble.classList.add('show'); } 
                else bubble.classList.remove('show');
            });
        }

        function showLog(msg) {
            const logBox = document.getElementById('log-container');
            document.getElementById('log-text').innerHTML = msg;
            logBox.style.display = 'block'; setTimeout(() => logBox.style.display = 'none', 3000);
        }

        function upgradeGuild() {
            if(guild.money >= guild.upgradeCost) {
                guild.money -= guild.upgradeCost; guild.capacity += 2; guild.upgradeCost = Math.floor(guild.upgradeCost * 1.5);
                showLog(`🏰 길드 증축! 최대 인원이 ${guild.capacity}명으로 증가.`); updateUI();
            }
        }

        // ==========================================
        // 4. 메인 루프 실행 (휘발성)
        // ==========================================
        window.onload = () => {
            guild = { timeMin: 480, money: 500, capacity: 5, upgradeCost: 1000, roster: [], quests: [] };
            for(let i=0;i<3;i++) { guild.roster.push(new Mercenary()); guild.quests.push(new Quest()); }
            
            updateUI(); 
            let frame = 0;

            setInterval(() => {
                frame++; renderFloor();
                let prevHour = getHour();
                guild.timeMin += (0.24 * gameSpeed); 
                let currHour = getHour();

                if(currHour !== prevHour) {
                    if (currHour === 0) {
                        let cost = guild.roster.length * 50; guild.money -= cost;
                        showLog(`🌙 자정 일일 유지비 -${cost}G 납부`);
                    }
                    if (currHour === 8 && guild.roster.length < guild.capacity && Math.random() < 0.8) {
                        guild.roster.push(new Mercenary()); showLog(`🚪 새로운 용병이 합류했습니다.`);
                    }
                    if (currHour === 18) showLog(`🔒 게시판 마감. 의뢰 수주가 중단됩니다.`); 
                    if (currHour === 7) showLog(`🔓 게시판이 오픈되었습니다.`); 

                    guild.roster.forEach(m => { if(m.status === 'idle') m.stamina = Math.min(100, m.stamina + 5); });
                }

                if(frame % Math.max(2, Math.floor(20 / gameSpeed)) === 0) {
                    guild.roster.forEach(m => m.think());
                }

                if(isGuildOpen() && Math.random() < (0.005 * gameSpeed) && guild.quests.length < 5) {
                    guild.quests.push(new Quest());
                }

                guild.roster.forEach(merc => {
                    if(merc.status === 'resting' || merc.status === 'training') {
                        if(guild.timeMin >= merc.targetMin) {
                            if(merc.currentAction === 'train') { merc.basePower += FACILITIES.train.pwr; merc.setThought("수련 완료!", 60); } 
                            else { merc.stamina = Math.min(100, merc.stamina + FACILITIES[merc.currentAction].stam); merc.setThought("몸이 가볍군.", 60); }
                            merc.status = 'idle'; merc.currentAction = null;
                        }
                    }
                });

                guild.quests.forEach((q, idx) => {
                    if(q.isParty && !q.departed && q.partyIds.length > 0) {
                        let pPower = q.partyIds.reduce((sum, id) => { let m=guild.roster.find(x=>x.id===id); return sum+(m?m.power:0); }, 0);
                        let wChance = (pPower / q.reqPower) * 70;
                        if(wChance >= 40 || q.partyIds.length >= q.maxParty || (guild.timeMin - q.gatherStartMin) > 120) {
                            q.departed = true; q.targetMin = guild.timeMin + q.durationMin;
                            q.partyIds.forEach(id => { let m = guild.roster.find(x=>x.id===id); if(m) { m.status = 'questing'; m.targetMin = q.targetMin; } });
                        }
                    }

                    if (q.departed && guild.timeMin >= q.targetMin) {
                        let involveMercs = [];
                        if(!q.isParty && q.assignedMercId) {
                            let m = guild.roster.find(x=>x.id===q.assignedMercId); if(m) involveMercs.push(m);
                        } else if(q.isParty) {
                            q.partyIds.forEach(id => { let m = guild.roster.find(x=>x.id===id); if(m) involveMercs.push(m); });
                        }

                        if(involveMercs.length > 0) {
                            let totalPwr = involveMercs.reduce((s,m) => s+m.power, 0);
                            let win = Math.min(95, Math.max(10, Math.floor((totalPwr / q.reqPower) * 70))); 
                            let isWin = (Math.random() * 100 <= win);
                            let gCut = Math.floor(q.reward * 0.2); 
                            let pReward = Math.floor((q.reward - gCut) / involveMercs.length);

                            if(isWin) guild.money += gCut;

                            involveMercs.forEach(merc => {
                                merc.status = 'idle'; merc.targetX = 50; merc.targetY = 90; 
                                if(isWin) {
                                    merc.money += pReward; merc.exp += (q.reqPower * 2);
                                    merc.setThought(`성공! 돈 벌었다.`, 120);
                                    if(merc.exp >= merc.level * 100) { merc.exp -= merc.level*100; merc.level++; }
                                } else {
                                    merc.exp += q.reqPower; merc.setThought("실패다... 아파...", 120);
                                }
                            });

                            let nStr = involveMercs.map(x=>x.name).join(', ');
                            if(isWin) showLog(`📜 [${nStr}] 의뢰 성공! (수수료: +${gCut} G)`);
                            else showLog(`🩸 [${nStr}] 의뢰 실패...`);
                        }
                        q.deleteMe = true;
                    }
                });
                
                guild.quests = guild.quests.filter(q => !q.deleteMe);
                if(frame % 10 === 0) updateUI();
            }, 100); 
        };
    </script>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>픽셀 용병 길드 타이쿤</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-dark: #121212; --panel-bg: #222222; --border-color: #555555;
            --text-main: #e0e0e0; --gold: #f1c40f; --exp: #2ecc71;
            --btn-blue: #2980b9; --btn-hover: #3498db;
        }

        body {
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        }

        header {
            background: linear-gradient(to right, #2c3e50, #1a252f); padding: 15px 30px;
            border-radius: 8px; border: 2px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }

        .guild-title { font-family: 'Press Start 2P', monospace; font-size: 1.2rem; color: var(--gold); }
        .guild-stats { display: flex; gap: 30px; font-size: 1.2rem; font-weight: bold; }
        
        main { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 20px; flex: 1; overflow: hidden; }

        .panel { background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; }
        .panel-header { background: #111; padding: 12px; font-weight: bold; font-size: 1.1rem; border-bottom: 2px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .panel-content { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px; }

        .card { background: #2a2a35; border: 1px solid #444; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        
        /* 🖼️ 초상화 및 정보 영역 레이아웃 */
        .card-info-wrapper { display: flex; gap: 12px; align-items: center; }
        .portrait-box { 
            width: 56px; height: 56px; background: #1a1a24; 
            border: 2px solid; border-radius: 6px; 
            overflow: hidden; flex-shrink: 0;
            box-shadow: 0 0 8px rgba(0,0,0,0.5) inset;
        }
        .portrait-box img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: cover; }
        
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;}
        .merc-name { font-weight: bold; font-size: 1.1rem; color: #fff; }
        .merc-class { font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; font-size: 0.85rem; color: #bbb; row-gap: 6px; }
        
        button { background: var(--btn-blue); color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover:not(:disabled) { background: var(--btn-hover); }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        
        button.action-promote { background: #8e44ad; }
        button.action-promote:hover:not(:disabled) { background: #9b59b6; }
        button.action-dispatch { background: #d35400; }
        
        .progress-bg { background: #000; height: 12px; border-radius: 6px; border: 1px solid #555; overflow: hidden; margin-top: 5px;}
        .progress-fill { background: var(--exp); height: 100%; width: 0%; transition: width 0.3s; }

        #log-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 15px 25px; border-radius: 30px; border: 2px solid var(--gold); display: none; z-index: 100; text-align: center; }
        #log-text { color: #fff; font-weight: bold; }

        select { padding: 5px; background: #111; color: #fff; border: 1px solid #555; border-radius: 4px; font-family: inherit; }
        
        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="guild-title">⚔️ 픽셀 용병 길드</div>
        <div class="guild-stats">
            <div>📅 Day <span id="ui-day">1</span></div>
            <div style="color:var(--gold);">💰 <span id="ui-money">2,000</span> G</div>
        </div>
    </header>

    <main>
        <!-- 1. 용병 주점 -->
        <section class="panel">
            <div class="panel-header" style="justify-content: center;">🍺 용병 주점 (고용)</div>
            <div class="panel-content" id="tavern-list"></div>
        </section>

        <!-- 2. 내 길드 로스터 -->
        <section class="panel" style="border-color: #3498db;">
            <div class="panel-header" style="background: #152b3c; justify-content: center;">🛡️ 소속 용병 관리</div>
            <div class="panel-content" id="roster-list"></div>
        </section>

        <!-- 3. 의뢰 게시판 -->
        <section class="panel" style="border-color: #e67e22;">
            <div class="panel-header" style="background: #3c2415;">
                <span>📜 의뢰 게시판</span>
                <!-- 🚀 자동 파견 토글 버튼 -->
                <button id="btn-auto-dispatch" onclick="toggleAutoDispatch()" style="font-size:0.75rem; padding:6px 10px; background:#7f8c8d;">자동 파견 OFF</button>
            </div>
            <div class="panel-content" id="quest-list"></div>
        </section>
    </main>

    <!-- 알림 로그창 -->
    <div id="log-container"><span id="log-text"></span></div>

    <script>
        // ==========================================
        // 1. 방대한 전직 트리 데이터 (ID 기반)
        // ==========================================
        const CLASS_DB = {
            "W_0": { tier: 0, name: "초보 전사", color: "#c0392b", nextJobs: ["W_1"], reqLevel: 0, cost: 0 },
            "W_1": { tier: 1, name: "검사", color: "#e74c3c", nextJobs: ["W_2A", "W_2B"], reqLevel: 5, cost: 500 },
            "W_2A": { tier: 2, name: "기사", color: "#922b21", nextJobs: ["W_3A1", "W_3A2"], reqLevel: 15, cost: 2000 },
            "W_2B": { tier: 2, name: "광전사", color: "#7b241c", nextJobs: ["W_3B1", "W_3B2"], reqLevel: 15, cost: 2000 },
            "W_3A1": { tier: 3, name: "성기사", color: "#f1c40f", nextJobs: [], reqLevel: 30, cost: 10000 },
            "W_3A2": { tier: 3, name: "다크나이트", color: "#4a235a", nextJobs: [], reqLevel: 30, cost: 10000 },
            "W_3B1": { tier: 3, name: "워로드", color: "#641e16", nextJobs: [], reqLevel: 30, cost: 10000 },
            "W_3B2": { tier: 3, name: "블러드마스터", color: "#a93226", nextJobs: [], reqLevel: 30, cost: 10000 },

            "A_0": { tier: 0, name: "초보 궁수", color: "#27ae60", nextJobs: ["A_1"], reqLevel: 0, cost: 0 },
            "A_1": { tier: 1, name: "헌터", color: "#2ecc71", nextJobs: ["A_2A", "A_2B"], reqLevel: 5, cost: 500 },
            "A_2A": { tier: 2, name: "스나이퍼", color: "#1e8449", nextJobs: ["A_3A1"], reqLevel: 15, cost: 2000 }, 
            "A_2B": { tier: 2, name: "트래퍼", color: "#145a32", nextJobs: ["A_3B1"], reqLevel: 15, cost: 2000 },
            "A_3A1": { tier: 3, name: "보우마스터", color: "#117a65", nextJobs: [], reqLevel: 30, cost: 10000 },
            "A_3B1": { tier: 3, name: "서바이벌리스트", color: "#0b5345", nextJobs: [], reqLevel: 30, cost: 10000 },

            "R_0": { tier: 0, name: "초보 도적", color: "#7f8c8d", nextJobs: ["R_1"], reqLevel: 0, cost: 0 },
            "R_1": { tier: 1, name: "암살자", color: "#95a5a6", nextJobs: ["R_2A", "R_2B"], reqLevel: 5, cost: 500 },
            "R_2A": { tier: 2, name: "섀도우", color: "#34495e", nextJobs: ["R_3A1"], reqLevel: 15, cost: 2000 },
            "R_2B": { tier: 2, name: "시프마스터", color: "#2c3e50", nextJobs: ["R_3B1"], reqLevel: 15, cost: 2000 },
            "R_3A1": { tier: 3, name: "나이트로드", color: "#1a252f", nextJobs: [], reqLevel: 30, cost: 10000 },
            "R_3B1": { tier: 3, name: "팬텀", color: "#5d6d7e", nextJobs: [], reqLevel: 30, cost: 10000 },

            "M_0": { tier: 0, name: "초보 마법사", color: "#8e44ad", nextJobs: ["M_1"], reqLevel: 0, cost: 0 },
            "M_1": { tier: 1, name: "워록", color: "#9b59b6", nextJobs: ["M_2A", "M_2B"], reqLevel: 5, cost: 500 },
            "M_2A": { tier: 2, name: "아크메이지", color: "#5b2c6f", nextJobs: ["M_3A1"], reqLevel: 15, cost: 2000 },
            "M_2B": { tier: 2, name: "서머너", color: "#4a235a", nextJobs: ["M_3B1"], reqLevel: 15, cost: 2000 },
            "M_3A1": { tier: 3, name: "엘리멘탈마스터", color: "#154360", nextJobs: [], reqLevel: 30, cost: 10000 },
            "M_3B1": { tier: 3, name: "일루저니스트", color: "#1b4f72", nextJobs: [], reqLevel: 30, cost: 10000 },

            "C_0": { tier: 0, name: "초보 성직자", color: "#f39c12", nextJobs: ["C_1"], reqLevel: 0, cost: 0 },
            "C_1": { tier: 1, name: "프리스트", color: "#f1c40f", nextJobs: ["C_2A", "C_2B"], reqLevel: 5, cost: 500 },
            "C_2A": { tier: 2, name: "비숍", color: "#d35400", nextJobs: ["C_3A1"], reqLevel: 15, cost: 2000 },
            "C_2B": { tier: 2, name: "이단심문관", color: "#ba4a00", nextJobs: ["C_3B1"], reqLevel: 15, cost: 2000 },
            "C_3A1": { tier: 3, name: "세인트", color: "#fdf2e9", nextJobs: [], reqLevel: 30, cost: 10000 },
            "C_3B1": { tier: 3, name: "팔라딘", color: "#e59866", nextJobs: [], reqLevel: 30, cost: 10000 },
        };

        const BASE_CLASSES = ["W_0", "A_0", "R_0", "M_0", "C_0"];
        const NAMES = ["아서", "렌", "엘리스", "바츠", "카일", "루시", "테오", "세리아", "카론", "제이드", "로웬", "미아"];

        // ==========================================
        // 2. 게임 상태 및 클래스 정의
        // ==========================================
        let guild = {
            day: 1,
            money: 2000,
            autoDispatch: false, // 🚀 자동 파견 상태 추가
            roster: [],
            tavern: [],
            quests: []
        };

        class Mercenary {
            constructor(id) {
                this.id = id || 'M_' + Date.now() + Math.floor(Math.random() * 10000);
                this.name = NAMES[Math.floor(Math.random() * NAMES.length)];
                this.jobId = BASE_CLASSES[Math.floor(Math.random() * BASE_CLASSES.length)];
                
                this.level = 1;
                this.exp = 0;
                this.basePower = 10 + Math.floor(Math.random() * 10);
                this.baseWage = 10 + Math.floor(Math.random() * 5); 
                
                this.status = 'idle'; 
                this.hireCost = 100 + Math.floor(Math.random() * 50);
            }

            get job() { return CLASS_DB[this.jobId]; }
            get maxExp() { return this.level * 100; }
            get power() { return Math.floor(this.basePower * (1 + this.level * 0.1) * (this.job.tier + 1)); }
            get currentWage() { return Math.floor(this.baseWage * Math.pow(1.2, this.level - 1) * Math.pow(2, this.job.tier)); }
            
            // 🖼️ 고유 픽셀 아트 초상화 (DiceBear API)
            get portraitUrl() {
                return `https://api.dicebear.com/9.x/pixel-art/svg?seed=${this.id}`;
            }

            addExp(amount) {
                this.exp += amount;
                if (this.exp >= this.maxExp) {
                    this.exp -= this.maxExp;
                    this.level++;
                    showLog(`🎉 ${this.name} 레벨 업! (Lv.${this.level})`);
                }
            }

            promote() {
                let currentJob = this.job;
                if (currentJob.nextJobs.length === 0) return { success: false, msg: "최고 랭크입니다." };
                
                let targetJobIds = currentJob.nextJobs;
                let nextJobPreview = CLASS_DB[targetJobIds[0]];
                
                if (this.level < nextJobPreview.reqLevel) return { success: false, msg: `레벨 부족 (필요: Lv.${nextJobPreview.reqLevel})` };
                if (guild.money < nextJobPreview.cost) return { success: false, msg: `심사비 부족 (${nextJobPreview.cost}G)` };

                guild.money -= nextJobPreview.cost;
                let chosenJobId = targetJobIds[Math.floor(Math.random() * targetJobIds.length)];
                this.jobId = chosenJobId;

                return { 
                    success: true, 
                    msg: `🤔 ${this.name}(은)는 길드장의 권유를 깊이 고민하더니...<br>✨ [${this.job.name}](으)로 전직하기로 결심했습니다!` 
                };
            }
        }

        class Quest {
            constructor() {
                this.id = 'Q_' + Date.now() + Math.floor(Math.random()*100);
                this.title = ["고블린 퇴치", "약초 채집", "상단 호위", "도적단 토벌", "잃어버린 유물 찾기"][Math.floor(Math.random()*5)];
                this.timeTotal = 5 + Math.floor(Math.random() * 10);
                this.timeLeft = this.timeTotal;
                this.reward = 100 + Math.floor(Math.random() * 200);
                this.expReward = 50 + Math.floor(Math.random() * 50);
                this.assignedMercId = null;
            }
        }

        // ==========================================
        // 3. UI 렌더링 함수
        // ==========================================
        function updateHeader() {
            document.getElementById('ui-day').innerText = guild.day;
            document.getElementById('ui-money').innerText = guild.money.toLocaleString();
        }

        function renderTavern() {
            const container = document.getElementById('tavern-list');
            container.innerHTML = '';
            guild.tavern.forEach((merc, index) => {
                let div = document.createElement('div'); div.className = 'card';
                div.innerHTML = `
                    <div class="card-info-wrapper">
                        <div class="portrait-box" style="border-color: ${merc.job.color};"><img src="${merc.portraitUrl}"></div>
                        <div style="flex:1;">
                            <div class="card-top">
                                <span class="merc-name">${merc.name}</span>
                                <span class="merc-class" style="background:${merc.job.color}">${merc.job.name}</span>
                            </div>
                            <div class="stat-grid">
                                <span>초기 전투력: ${merc.power}</span>
                                <span>요구 주급: <span style="color:var(--gold)">${merc.currentWage} G</span></span>
                            </div>
                        </div>
                    </div>
                    <button onclick="hireMerc(${index})" ${guild.money < merc.hireCost ? 'disabled' : ''}>
                        고용하기 (-${merc.hireCost} G)
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function renderRoster() {
            const container = document.getElementById('roster-list');
            container.innerHTML = '';
            guild.roster.forEach((merc, index) => {
                let nextJobsStr = merc.job.nextJobs.length > 0 ? `(Lv.${CLASS_DB[merc.job.nextJobs[0]].reqLevel} 전직가능)` : "(MAX)";
                
                let div = document.createElement('div'); div.className = 'card'; div.style.borderColor = "#3498db";
                div.innerHTML = `
                    <div class="card-info-wrapper">
                        <div class="portrait-box" style="border-color: ${merc.job.color};"><img src="${merc.portraitUrl}"></div>
                        <div style="flex:1;">
                            <div class="card-top">
                                <span class="merc-name">${merc.name} <span style="font-size:0.8rem; color:#aaa;">Lv.${merc.level}</span></span>
                                <span class="merc-class" style="background:${merc.job.color}">${merc.job.name}</span>
                            </div>
                            <div class="stat-grid">
                                <span>전투력: ${merc.power}</span>
                                <span>현재 주급: <span style="color:var(--gold)">${merc.currentWage} G</span></span>
                                <span>상태: ${merc.status === 'idle' ? '대기중' : '<span style="color:#e67e22">임무중</span>'}</span>
                                <span style="font-size:0.7rem; color:#888;">${nextJobsStr}</span>
                            </div>
                        </div>
                    </div>
                    <div class="progress-bg"><div class="progress-fill" style="width: ${(merc.exp / merc.maxExp)*100}%"></div></div>
                    <div style="display:flex; gap:5px;">
                        <button class="action-promote" style="flex:1;" onclick="promoteMerc(${index})" ${merc.status !== 'idle' ? 'disabled' : ''}>
                            승급 심사 (${merc.job.nextJobs.length > 0 ? CLASS_DB[merc.job.nextJobs[0]].cost + 'G' : '-'})
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderQuests() {
            const container = document.getElementById('quest-list');
            container.innerHTML = '';
            
            let idleMercs = guild.roster.filter(m => m.status === 'idle');
            let optionsHTML = idleMercs.map(m => `<option value="${m.id}">${m.name} (Lv.${m.level})</option>`).join('');

            // 자동 파견 버튼 UI 갱신
            let btnAuto = document.getElementById('btn-auto-dispatch');
            if(guild.autoDispatch) {
                btnAuto.innerText = "자동 파견 ON";
                btnAuto.style.background = "#27ae60";
            } else {
                btnAuto.innerText = "자동 파견 OFF";
                btnAuto.style.background = "#7f8c8d";
            }

            guild.quests.forEach((q, index) => {
                let div = document.createElement('div'); div.className = 'card'; div.style.borderColor = "#e67e22";
                
                if (q.assignedMercId) {
                    let assignedMerc = guild.roster.find(m => m.id === q.assignedMercId);
                    div.innerHTML = `
                        <div class="card-top"><span class="merc-name">${q.title}</span></div>
                        <div class="card-info-wrapper" style="margin-top:5px;">
                            <div class="portrait-box" style="width:40px; height:40px; border-color:${assignedMerc.job.color};"><img src="${assignedMerc.portraitUrl}"></div>
                            <div class="stat-grid" style="flex:1;">
                                <span>파견: ${assignedMerc.name}</span>
                                <span>남은 시간: ${q.timeLeft}초</span>
                            </div>
                        </div>
                        <div class="progress-bg"><div class="progress-fill" style="width: ${((q.timeTotal - q.timeLeft)/q.timeTotal)*100}%"></div></div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="card-top"><span class="merc-name">${q.title}</span></div>
                        <div class="stat-grid">
                            <span>소요 시간: ${q.timeTotal}초</span>
                            <span>보상: <span style="color:var(--gold)">${q.reward} G</span></span>
                        </div>
                        <div style="display:flex; gap:5px; margin-top:5px;">
                            <select id="select-merc-${index}" style="flex:1;" ${guild.autoDispatch ? 'disabled' : ''}>
                                ${idleMercs.length > 0 ? optionsHTML : '<option disabled selected>대기중인 용병 없음</option>'}
                            </select>
                            <button class="action-dispatch" onclick="startQuest(${index})" ${(idleMercs.length === 0 || guild.autoDispatch) ? 'disabled' : ''}>
                                파견
                            </button>
                        </div>
                    `;
                }
                container.appendChild(div);
            });
        }

        // ==========================================
        // 4. 게임 액션 로직
        // ==========================================
        function showLog(msg) {
            const logBox = document.getElementById('log-container');
            document.getElementById('log-text').innerHTML = msg;
            logBox.style.display = 'block';
            setTimeout(() => { logBox.style.display = 'none'; }, 3000);
        }

        function refreshTavern() {
            guild.tavern = [new Mercenary(), new Mercenary(), new Mercenary()];
        }

        function refreshQuests() {
            guild.quests.push(new Quest());
            if(guild.quests.length > 4) guild.quests.shift();
        }

        function hireMerc(index) {
            let merc = guild.tavern[index];
            if (guild.money >= merc.hireCost) {
                guild.money -= merc.hireCost;
                guild.roster.push(merc);
                guild.tavern.splice(index, 1);
                showLog(`🤝 [${merc.job.name}] ${merc.name} 영입 완료!`);
                updateAll();
            }
        }

        function promoteMerc(index) {
            let merc = guild.roster[index];
            let result = merc.promote();
            if (result.success) {
                showLog(result.msg);
                updateAll();
            } else {
                alert(result.msg);
            }
        }

        function startQuest(qIndex) {
            if(guild.autoDispatch) return; // 자동모드일땐 수동 클릭 방지
            let selectBox = document.getElementById(`select-merc-${qIndex}`);
            let mercId = selectBox.value;
            if(!mercId) return;

            let merc = guild.roster.find(m => m.id === mercId);
            let quest = guild.quests[qIndex];

            merc.status = 'questing';
            quest.assignedMercId = mercId;
            updateAll();
        }

        // 🚀 자동 파견 토글 함수
        function toggleAutoDispatch() {
            guild.autoDispatch = !guild.autoDispatch;
            updateAll();
        }

        function updateAll() {
            updateHeader();
            renderTavern();
            renderRoster();
            renderQuests();
        }

        // ==========================================
        // 5. 게임 루프 (타이머)
        // ==========================================
        setInterval(() => {
            let updated = false;

            // 🚀 [추가] 자동 파견 로직 (Auto Dispatch)
            if (guild.autoDispatch) {
                let idleMercs = guild.roster.filter(m => m.status === 'idle');
                let availableQuests = guild.quests.filter(q => !q.assignedMercId);
                
                // 대기중인 용병과 비어있는 퀘스트가 둘 다 있다면 짝지어 파견
                while(idleMercs.length > 0 && availableQuests.length > 0) {
                    let merc = idleMercs.shift(); // 첫 번째 대기 용병
                    let quest = availableQuests.shift(); // 첫 번째 빈 퀘스트
                    merc.status = 'questing';
                    quest.assignedMercId = merc.id;
                    updated = true;
                }
            }

            // 1. 퀘스트 진행
            guild.quests.forEach((q, idx) => {
                if (q.assignedMercId) {
                    q.timeLeft--;
                    updated = true;
                    if (q.timeLeft <= 0) {
                        guild.money += q.reward;
                        let merc = guild.roster.find(m => m.id === q.assignedMercId);
                        if(merc) {
                            merc.status = 'idle';
                            merc.addExp(q.expReward);
                        }
                        showLog(`💰 의뢰 완료! (+${q.reward} G)`);
                        guild.quests.splice(idx, 1);
                        refreshQuests();
                    }
                }
            });

            // 2. 날짜 변경 및 주급 정산
            if(Math.random() < 0.1) {
                guild.day++;
                let totalWage = 0;
                guild.roster.forEach(m => totalWage += m.currentWage);
                guild.money -= totalWage;
                
                if (guild.day % 3 === 0) refreshTavern(); 
                updated = true;
            }

            if (updated) updateAll();
        }, 1000);

        refreshTavern();
        refreshQuests();
        refreshQuests();
        updateAll();

    </script>
</body>
</html>

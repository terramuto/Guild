<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#120703">
    <title>판타지 용병 여관 (마스터 클린 에디션)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&family=Noto+Sans+KR:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --hd-wood-900: #0d0502; --hd-wood-800: #1b0c05; --hd-wood-700: #2a1409;
            --hd-wood-600: #3c1e0e; --hd-wood-500: #542b14; --hd-wood-400: #6f3b1e;
            --hd-gold-bright: #ffd700; --hd-gold-rim: #f5b041;
            --hd-parch-base: #f4e8c1; --hd-parch-light: #fdf6e2; --hd-parch-ink: #2b170a;
            --hd-danger: #e74c3c; --hd-stamina: #3498db;
            --font-pixel: 'DungGeunMo', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; image-rendering: pixelated; }
        body { background-color: #050201; color: var(--hd-parch-light); font-family: var(--font-pixel); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #app { width: 100%; max-width: 440px; height: 100%; background: var(--hd-wood-900); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.98); overflow: hidden; }

        header { flex-shrink: 0; background: linear-gradient(to bottom, var(--hd-wood-600), var(--hd-wood-800)); border-bottom: 2px solid var(--hd-wood-900); padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; z-index: 100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .guild-badge { display: flex; align-items: center; gap: 6px; font-size: 1rem; color: var(--hd-gold-bright); text-shadow: 1px 1px 0 #000; }
        .rank-badge { background: var(--hd-wood-900); color: var(--hd-gold-bright); border: 1px solid var(--hd-gold-rim); padding: 1px 5px; font-size: 0.75rem; }
        .time-box { display: flex; align-items: center; gap: 5px; font-size: 0.92rem; background: #100602; padding: 3px 8px; border: 1px solid var(--hd-wood-500); }
        .open-status { font-size: 0.68rem; padding: 1px 4px; border-radius: 1px; }
        .open-status.open { background: #27ae60; color: #05260f; }
        .open-status.closed { background: #c0392b; color: #fff; }
        .btn-speed { background: var(--hd-wood-500); border: 1px solid var(--hd-wood-900); color: #fff; padding: 2px 7px; font-family: var(--font-pixel); cursor: pointer; }
        .header-sub { display: flex; justify-content: space-between; align-items: center; background: #150903; padding: 5px 10px; border: 1px solid var(--hd-wood-700); }
        .resource-pill { font-size: 0.92rem; color: var(--hd-gold-bright); }

        main { flex: 1; position: relative; overflow: hidden; background: #0d0502; }
        .view-pane { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none; flex-direction: column; overflow-y: auto; }
        .view-pane.active { display: flex; }

        #view-hall { background: radial-gradient(circle at 50% 25%, rgba(255, 190, 90, 0.35) 0%, rgba(13, 5, 2, 0.96) 82%); }
        .facility-stand { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; z-index: 2; pointer-events: none; }
        .fac-sign { background: #1f0c04; color: var(--hd-gold-bright); padding: 3px 8px; border: 1px solid var(--hd-wood-900); font-size: 0.65rem; margin-bottom: 3px; }
        .npc-emblem { width: 40px; height: 40px; border: 2px solid var(--hd-wood-900); background: #180a04; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .merc-sprite { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 10; }
        .floor-bubble { position: absolute; bottom: 55px; background: var(--hd-parch-light); color: var(--hd-parch-ink); font-size: 0.68rem; padding: 4px 8px; opacity: 0; white-space: nowrap; pointer-events: none; border: 1px solid #000; }
        .floor-bubble.show { opacity: 1; }
        .merc-emblem { width: 42px; height: 42px; border: 2px solid #000; background: #140702; display: flex; justify-content: center; align-items: center; position: relative; }
        .merc-emblem img { width: 100%; height: 100%; object-fit: cover; }
        .cond-tag { position: absolute; top: -6px; left: -6px; font-size: 0.8rem; z-index: 5; }
        .nameplate { background: #140803; padding: 2px 4px; font-size: 0.6rem; margin-top: 2px; border: 1px solid #000; text-align: center; }
        .hp-bar-bg { width: 30px; height: 3px; background: #000; margin-top:1px; overflow: hidden; }
        .hp-bar-fill { height: 100%; background: #2ecc71; width: 100%; }

        .list-container { padding: 12px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 30px; }
        .sub-header-banner { background: #230d04; border-left: 4px solid var(--hd-gold-bright); padding: 6px 10px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        .idle-card { background: var(--hd-parch-base); color: var(--hd-parch-ink); border: 1px solid var(--hd-wood-900); padding: 9px; display: flex; flex-direction: column; gap: 5px; }
        .boss-card { background: linear-gradient(135deg, #3d140b, #200a04); color: #fff; border: 2px solid var(--hd-gold-bright); }
        .adv-card { background: linear-gradient(135deg, #2d1a42, #160c24); color: #fff; border: 2px solid #af7ac5; }
        .card-row { display: flex; align-items: center; justify-content: space-between; }
        .badge-pill { padding: 2px 5px; font-size: 0.65rem; border: 1px solid #000; background: #fff; color: #000;}
        .btn-action-wide { background: #642e10; border: 1px solid var(--hd-wood-900); color: var(--hd-gold-bright); font-family: var(--font-pixel); padding: 10px; cursor: pointer; width: 100%; }

        nav#bottom-nav { flex-shrink: 0; height: 56px; background: #1c0b04; border-top: 2px solid var(--hd-wood-900); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 100; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: transparent; border: none; color: #926647; cursor: pointer; font-family: var(--font-pixel); font-size: 0.65rem; }
        .nav-btn.active { background: rgba(0,0,0,0.45); color: var(--hd-gold-bright); box-shadow: inset 0 -3px 0 var(--hd-gold-bright); }

        .modal-backdrop { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 500; display: none; justify-content: center; align-items: flex-end; }
        .bottom-sheet { width: 100%; background: var(--hd-parch-base); color: var(--hd-parch-ink); padding: 16px; display: flex; flex-direction: column; gap: 10px; max-height: 85vh; overflow-y: auto; }
        .sheet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--hd-parch-light); padding: 8px; border: 1px solid #000; font-size: 0.76rem; }
        .sheet-grid-item { display: flex; justify-content: space-between; }
        .btn-sheet { padding: 9px; font-size: 0.8rem; font-family: var(--font-pixel); border: 1px solid #000; cursor: pointer; }
        
        #toast-log { position: absolute; top: 85px; left: 50%; transform: translateX(-50%); background: #150702; border: 1px solid var(--hd-gold-bright); padding: 6px 12px; font-size: 0.76rem; display: none; z-index: 600; white-space: nowrap; }
    </style>
</head>
<body>

<div id="app">
    <header>
        <div class="header-top">
            <div class="guild-badge"><span class="rank-badge" id="ui-rank-badge">[F급]</span><span>🍺 멧돼지 여관</span></div>
            <div class="time-box"><span class="day-tag" id="ui-day">D.1</span><span class="clock-tag" id="ui-clock">08:00</span><span class="open-status open" id="ui-open-status">영업중</span><button class="btn-speed" id="btn-speed" onclick="toggleSpeed()">1x</button></div>
        </div>
        <div class="header-sub">
            <div class="resource-pill gold">🪙 <span id="ui-money">500</span> G</div>
            <div class="resource-pill cap">👥 <span id="ui-cap">0/5</span> | 👑 <span id="ui-rep">10</span></div>
        </div>
    </header>

    <main>
        <!-- 뷰 1: 여관 홀 (캔버스) -->
        <div class="view-pane active" id="view-hall">
            <div class="hall-depth-layer"></div>
            <!-- 시설물 앵커 (스크립트에서 좌표 할당) -->
            <div class="facility-stand" id="fac-board"><div class="fac-sign">의뢰소</div><div class="npc-emblem"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Eileen"></div></div>
            <div class="facility-stand" id="fac-inn"><div class="fac-sign">침실</div><div class="npc-emblem"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Martha"></div></div>
            <div class="facility-stand" id="fac-tavern"><div class="fac-sign">주점</div><div class="npc-emblem"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Gordon"></div></div>
            <div class="facility-stand" id="fac-train"><div class="fac-sign">수련장</div><div class="npc-emblem"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Baron"></div></div>
            <div class="facility-stand" id="fac-shop"><div class="fac-sign">대장간</div><div class="npc-emblem"><img src="https://api.dicebear.com/9.x/adventurer/svg?seed=Brock"></div></div>
        </div>

        <!-- 뷰 2: 용병단 -->
        <div class="view-pane" id="view-roster">
            <div class="list-container">
                <div class="sub-header-banner"><span>📜 소속 용병 명부</span></div>
                <div id="roster-card-list" style="display:flex; flex-direction:column; gap:8px;"></div>
                <button class="btn-action-wide" id="btn-upgrade" onclick="upgradeGuild()">침상 증축 (+2인) : 1000G</button>
            </div>
        </div>

        <!-- 뷰 3: 의뢰소 -->
        <div class="view-pane" id="view-quests">
            <div class="list-container">
                <div class="sub-header-banner"><span>📜 의뢰 게시판</span><span style="font-size:0.75rem; color:var(--hd-gold-bright);">수수료 20%</span></div>
                <div id="quest-card-list" style="display:flex; flex-direction:column; gap:8px;"></div>
            </div>
        </div>

        <!-- 뷰 4: 대장간 -->
        <div class="view-pane" id="view-forge">
            <div class="list-container">
                <div class="sub-header-banner"><span>⛏️ 대장간 창고</span></div>
                <div class="idle-card" id="mat-container" style="display:flex; flex-wrap:wrap; gap:4px;"></div>
                
                <div class="sub-header-banner" style="margin-top:4px;"><span>📦 쇼케이스 (자율 구매)</span></div>
                <div id="forge-stock-view" style="display:flex; flex-direction:column; gap:4px;"></div>
                <div id="forge-orders-view" style="display:flex; flex-direction:column; gap:4px; margin-top:4px;"></div>

                <div class="sub-header-banner" style="margin-top:4px;"><span>⚒️ 무기 단조 (5% 명작)</span></div>
                <div id="forge-recipes-view" style="display:flex; flex-direction:column; gap:6px;"></div>
            </div>
        </div>

        <!-- 뷰 5: 경영/도감 -->
        <div class="view-pane" id="view-manage">
            <div class="list-container">
                <div class="sub-header-banner"><span>👑 평판 승급 심사</span></div>
                <div class="idle-card">
                    <div class="card-row"><span id="ui-rank-req" style="font-size:0.8rem; color:#d35400;">조건 확인 중...</span></div>
                    <button class="btn-action-wide" id="btn-rankup" style="margin-top:5px;" onclick="promoteGuildRank()">승급 심사 신청</button>
                </div>

                <div class="sub-header-banner" style="margin-top:6px;"><span>🐉 보스 트로피</span></div>
                <div id="trophy-list" style="display:flex; flex-direction:column; gap:6px;"></div>

                <div class="sub-header-banner" style="margin-top:6px;"><span>📖 종합 도감 열람</span></div>
                <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:6px;">
                    <button class="btn-sheet" style="background:#e67e22; color:#fff;" onclick="openCompModal('job')">직업(36종)</button>
                    <button class="btn-sheet" style="background:#e67e22; color:#fff;" onclick="openCompModal('weapon')">무기 도감</button>
                    <button class="btn-sheet" style="background:#e67e22; color:#fff;" onclick="openCompModal('mat')">재료 도감</button>
                    <button class="btn-sheet" style="background:#e67e22; color:#fff;" onclick="openCompModal('food')">주점 음식</button>
                    <button class="btn-sheet" style="background:#e67e22; color:#fff; grid-column:span 2;" onclick="openCompModal('monster')">몬스터 도감</button>
                </div>
                
                <button onclick="resetGame()" style="background:none; border:none; color:#a06a44; font-size:0.7rem; font-family:var(--font-pixel); margin-top:15px; cursor:pointer; text-decoration:underline;">새 게임 시작 (데이터 완전 초기화)</button>
            </div>
        </div>
    </main>

    <!-- 네비게이션 -->
    <nav id="bottom-nav">
        <button class="nav-btn active" onclick="switchNavTab('hall')"><span style="font-size:1.1rem;">🍺</span>여관홀</button>
        <button class="nav-btn" onclick="switchNavTab('roster')"><span style="font-size:1.1rem;">👥</span>용병단</button>
        <button class="nav-btn" onclick="switchNavTab('quests')"><span style="font-size:1.1rem;">📜</span>의뢰소</button>
        <button class="nav-btn" onclick="switchNavTab('forge')"><span style="font-size:1.1rem;">🔨</span>대장간</button>
        <button class="nav-btn" onclick="switchNavTab('manage')"><span style="font-size:1.1rem;">🏆</span>경영/도감</button>
    </nav>

    <!-- 용병 모달 -->
    <div class="modal-backdrop" id="merc-modal">
        <div class="bottom-sheet">
            <div style="display:flex; gap:12px; align-items:center;">
                <div class="card-avatar" id="mmodal-portrait"></div>
                <div>
                    <div style="font-size:1.1rem; font-family:var(--font-pixel);" id="mmodal-name">아서</div>
                    <div style="font-size:0.8rem;" id="mmodal-job">초보 모험가</div>
                </div>
            </div>
            <div class="sheet-grid">
                <div class="sheet-grid-item" style="grid-column:span 2;"><span>칭호</span><span id="mmodal-titles" style="color:var(--hd-gold-bright);">없음</span></div>
                <div class="sheet-grid-item"><span>컨디션</span><span id="mmodal-cond" style="color:#27ae60;">보통</span></div>
                <div class="sheet-grid-item"><span>전투력</span><span id="mmodal-power" style="color:var(--hd-danger);">⚔️ 25</span></div>
                <div class="sheet-grid-item"><span>STR/AGI</span><span id="mmodal-stats1">10/10</span></div>
                <div class="sheet-grid-item"><span>INT/VIT</span><span id="mmodal-stats2">10/10</span></div>
                <div class="sheet-grid-item"><span>체력(기력)</span><span id="mmodal-stamina" style="color:var(--hd-stamina);">⚡ 100/100</span></div>
                <div class="sheet-grid-item"><span>소지금</span><span id="mmodal-gold" style="color:#d35400;">🪙 150</span></div>
                <div class="sheet-grid-item" style="grid-column:span 2;"><span>장착 무기</span><span id="mmodal-equip">기본 장비</span></div>
                <div class="sheet-grid-item" style="grid-column:span 2;"><span>주점 버프</span><span id="mmodal-buff">없음</span></div>
                <div class="sheet-grid-item" style="grid-column:span 2;"><span>현재 상태</span><span id="mmodal-status">여관 홀</span></div>
            </div>
            <div class="sheet-actions">
                <button class="btn-sheet" style="background:#27ae60; color:#fff;" onclick="encourageSelectedMerc()">💬 맥주 쏘기(30G)</button>
                <button class="btn-sheet" style="background:#d35400; color:#fff;" onclick="tipSelectedMerc()">🪙 팁 지급(100G)</button>
                <button class="btn-sheet" style="background:#c0392b; color:#fff; grid-column:span 2;" onclick="dismissSelectedMerc()">🚪 용병 방출</button>
                <button class="btn-sheet" style="background:#555; color:#fff; grid-column:span 2;" onclick="closeMercModal()">닫기</button>
            </div>
        </div>
    </div>

    <!-- 도감 모달 -->
    <div class="modal-backdrop" id="comp-modal">
        <div class="bottom-sheet" style="max-height:85vh;">
            <div style="font-size:1.05rem; text-align:center; font-family:var(--font-pixel);" id="comp-modal-title">📖 도감</div>
            <div id="comp-modal-content" style="display:flex; flex-direction:column; gap:6px; overflow-y:auto; padding-right:2px; max-height:60vh;"></div>
            <button class="btn-sheet" style="background:#555; color:#fff; margin-top:10px;" onclick="document.getElementById('comp-modal').style.display='none'">닫기</button>
        </div>
    </div>

    <div id="toast-log">알림</div>
</div>

<script>
    // ==========================================
    // 1. 데이터베이스 및 구조
    // ==========================================
    const FIRST_NAMES = ["아서", "렌", "엘리스", "바츠", "카일", "루시", "테오", "세리아", "카론", "제이드"];
    const LAST_NAMES = ["스톤", "블레이드", "윈드", "나이트", "스타", "실버", "골드", "다크"];

        "CLR_2A": { tier: 2, name: "프리스트", mainStat: "int", color: "#f39c12", nextJobs: ["CLR_3A1", "CLR_3A2"], req: 15, cost: 2000 },
        "CLR_2B": { tier: 2, name: "이단심문관", mainStat: "str", color: "#e67e22", nextJobs: ["CLR_3B1", "CLR_3B2"], req: 15, cost: 2000 },

        "WAR_3B1": { tier: 3, name: "워로드", mainStat: "str", color: "#78281f", nextJobs: [], req: 30, cost: 8000 },
        "WAR_3B2": { tier: 3, name: "블러드버서커", mainStat: "str", color: "#641e16", nextJobs: [], req: 30, cost: 8000 },

    class Mercenary {
        constructor() {
            this.id = 'M_' + Date.now() + Math.random(); this.name = generateUniqueName();
            this.jobId = "ADV_0"; this.level = 1; this.exp = 0; this.money = 150;
            this.str = 10 + Math.floor(Math.random()*5); this.agi = 10 + Math.floor(Math.random()*5);
            this.int = 10 + Math.floor(Math.random()*5); this.vit = 10 + Math.floor(Math.random()*5);
            this.gearAtk = 10; this.gearName = "기본 장비"; this.titles = [];
            this.stamina = 100; this.cond = "보통"; this.buff = null; this.buffEndMin = 0;
            this.status = 'idle'; this.targetMin = 0; this.tx=50; this.ty=90; this.targetX=50; this.targetY=50;
            this.portraitUrl = `https://api.dicebear.com/9.x/adventurer/svg?seed=${ADVENTURER_SEEDS[Math.floor(Math.random()*ADVENTURER_SEEDS.length)]}_${Math.floor(Math.random()*99)}`;
        }
        get job() { return CLASS_DB[this.jobId]; }
        get power() {
            let primary = this.job.mainStat === 'str' ? this.str : (this.job.mainStat === 'agi' ? this.agi : this.int);
            let base = (primary * 4) + ((this.str + this.agi + this.int + this.vit) * 1.5) + this.gearAtk;
            let p = base * (1 + this.level * 0.15) * (this.job.tier + 1);
            if(this.cond === "최상") p *= 1.15; else if(this.cond === "악화") p *= 0.7;
            if(this.buff && this.buff.buffType === 'atk' && guild.timeMin < this.buffEndMin) p *= (1 + this.buff.buffVal);
            return Math.floor(p);
        }
        think() {
            if(this.status !== 'idle') return;

            // 전직 퀘스트 발주
            if(this.job.nextJobs && this.job.nextJobs.length > 0 && this.level >= CLASS_DB[this.job.nextJobs[0]].req) {
                if(!guild.quests.some(q => q.isAdvance && q.assignedMercId === this.id)) {
                    guild.quests.unshift(new Quest(null, this));
                    showToast(`📜 ${this.name}님의 승급 심사 발주!`);
                }
            }

            let h = Math.floor(guild.timeMin/60)%24; let isNight = h>=18 || h<7;
            if(isNight) {
                if(this.stamina < 70) { this.status='moving'; this.pendingAction="fac|inn"; this.targetX=20; this.targetY=55; return; }
                else { this.status='moving'; this.pendingAction="fac|tavern"; this.targetX=30; this.targetY=85; return; }
            }

            if(Math.random() < 0.1) { this.targetX = 25+Math.random()*50; this.targetY = 30+Math.random()*50; }
            if(Math.random() > 0.35) return;

            if(this.stamina < 35 && this.money >= 100) { this.status='moving'; this.pendingAction="fac|inn"; this.targetX=20; this.targetY=55; return; }
            if(this.stamina > 50 && this.money >= 300 && Math.random() < 0.2) { this.status='moving'; this.pendingAction="fac|train"; this.targetX=80; this.targetY=55; return; }

            if(this.stamina >= 20) {
                let advQ = guild.quests.find(q => q.isAdvance && q.assignedMercId === this.id && !q.departed);
                if(advQ) { this.status='moving'; this.pendingAction=`quest|${advQ.id}`; this.targetX=50; this.targetY=15; return; }

                let avail = guild.quests.filter(q => !q.departed && !q.isAdvance).sort((a,b)=>b.reward - a.reward);
                for(let q of avail) {
                    if(q.isBoss && this.job.tier < 3) continue;
                    let reqS = this.buff && this.buff.buffType==='stam' ? Math.floor(q.reqStamina*(1-this.buff.buffVal)) : q.reqStamina;
                    if(this.power >= q.minPower && this.stamina >= reqS) {
                        if(!q.isParty) { q.assignedMercId = this.id; this.status='moving'; this.pendingAction=`quest|${q.id}`; this.targetX=50; this.targetY=15; return; }
                        else if(q.partyIds.length < q.maxParty) { q.partyIds.push(this.id); if(q.partyIds.length===1) q.gatherStartMin = guild.timeMin; this.status='moving'; this.pendingAction=`gather|${q.id}`; this.targetX=50; this.targetY=15; return; }
                    }
                }
            }
        }
        executePendingAction() {
            if(!this.pendingAction) return;
            let [type, target] = this.pendingAction.split('|'); this.pendingAction = null;

            if(type === 'fac') {
                let fac = FACILITIES[target]; this.money -= fac.cost; guild.money += fac.cost;
                this.status = target==='train' ? 'training' : 'resting';
                this.currentAction = target; this.targetMin = guild.timeMin + fac.duration;
                if(target==='tavern') {
                    let f = TAVERN_FOODS[Math.floor(Math.random()*TAVERN_FOODS.length)];
                    this.buff = f; this.buffEndMin = guild.timeMin + f.duration; this.cond = "최상";
                }
            } else if(type === 'quest') {
                let q = guild.quests.find(x=>x.id===target);
                if(q) {
                    let reqS = this.buff && this.buff.buffType==='stam' ? Math.floor(q.reqStamina*(1-this.buff.buffVal)) : q.reqStamina;
                    this.stamina -= reqS; this.status = 'questing'; q.departed = true; q.targetMin = guild.timeMin + q.durationMin; this.targetMin = q.targetMin;
                } else this.status = 'idle';
            } else if(type === 'gather') {
                let q = guild.quests.find(x=>x.id===target);
                if(q) {
                    let reqS = this.buff && this.buff.buffType==='stam' ? Math.floor(q.reqStamina*(1-this.buff.buffVal)) : q.reqStamina;
                    this.stamina -= reqS; this.status = 'gathering';
                } else this.status = 'idle';
            }
        }
    }

    class Quest {
        constructor(forceBossId = null, advanceMerc = null) {
            this.id = 'Q_' + Date.now() + Math.random(); this.departed = false; this.targetMin = 0;
            if(advanceMerc) {
                this.isAdvance = true; this.assignedMercId = advanceMerc.id; this.advanceTarget = advanceMerc.job.nextJobs[0];
                this.title = `⚡ [승급] ${advanceMerc.name}의 ${CLASS_DB[this.advanceTarget].name} 심사`;
                this.isParty = false; this.minParty=1; this.maxParty=1;
                this.reqPower = Math.floor(advanceMerc.power*0.95); this.minPower = Math.floor(this.reqPower*0.8);
                this.reward = CLASS_DB[this.advanceTarget].cost; this.durationMin = 180; this.reqStamina = 30;
                this.matReward = { iron:2, essence:1 };
            } else if(forceBossId || (guild.roster.some(m=>m.job.tier>=3) && Math.random()<0.25 && !guild.quests.some(q=>q.isBoss))) {
                let keys = ["boss_goblin"];
                if(guild.unlockedTrophies.includes("goblin")) keys.push("boss_bandit");
                if(guild.unlockedTrophies.includes("bandit")) keys.push("boss_orc");
                if(guild.unlockedTrophies.includes("orc")) keys.push("boss_dragon");
                let b = NAMED_BOSS_DB[forceBossId || keys[Math.floor(Math.random()*keys.length)]];
                this.isBoss = true; this.bossKey = b.id; this.title = b.title; this.isParty = true;
                this.minParty = 4; this.maxParty = 4; this.partyIds = []; this.gatherStartMin = null;
                this.reqPower = b.reqPower; this.minPower = b.minPower; this.reward = b.reward; this.durationMin = b.durationMin; this.reqStamina = 40;
                this.matReward = { black_iron:3, magicEssence:3 };
            } else {
                this.isAdvance = false; this.isParty = Math.random()<0.4;
                const POOL = [
                    { t: "광산 탐사", m: { iron:4, black_iron:1 }, pwr: 60 },
                    { t: "설원 토벌", m: { leather:4, ancient_wood:1 }, pwr: 80 },
                    { t: "마력 유적", m: { magicEssence:3, abyss_crystal:1 }, pwr: 130 },
                    { t: "바람 절벽", m: { roc_feather:2, wind_stone:1 }, pwr: 160 },
                    { t: "성지 순례", m: { holy_essence:2, mithril:1 }, pwr: 200 }
                ];
                let c = POOL[Math.floor(Math.random()*POOL.length)];
                this.title = c.t + (this.isParty?" (파티)":""); this.matReward = c.m; this.durationMin = 240;
                this.minParty = this.isParty?2:1; this.maxParty = this.isParty?3:1; this.partyIds = [];
                this.reqPower = Math.floor(c.pwr * (1 + guild.rankIdx*0.3)); this.minPower = Math.floor(this.reqPower*0.7);
                this.reqStamina = 25; this.reward = this.reqPower * 5;
            }
        }
    }

            for(let k in MAT_DB) c.innerHTML += `<div class="idle-card"><b>${MAT_DB[k]}</b></div>`;
        } else if(type === 'food') {
            c.innerHTML = TAVERN_FOODS.map(f=>`<div class="idle-card card-row"><div><b>${f.icon} ${f.name}</b> (${f.cost}G)<br><small style="color:#27ae60;">${f.desc}</small></div></div>`).join('');
        } else if(type === 'monster') {
            let h = MONSTER_CATALOG.map(m=>`<div class="idle-card card-row"><div><b>${m.name}</b> <span class="badge-pill">${m.type}</span><br><small>전투력 ⚔️${m.pwr} | 드랍: ${m.drop}</small></div></div>`).join('');
            h += Object.values(NAMED_BOSS_DB).map(b=>`<div class="idle-card boss-card"><div><b>${b.title}</b><br><small style="color:#fdf6e2;">권장 ⚔️${b.reqPower} | 칭호: [${b.grant}]</small></div></div>`).join('');
            c.innerHTML = h;
        }
        document.getElementById('comp-modal').style.display='flex';
    }

    function openMercModal(id) {
        selectedMercId = id; let m = guild.roster.find(x=>x.id===id); if(!m) return;
        document.getElementById('mmodal-portrait').innerHTML = `<img src="${m.portraitUrl}" onerror="applyFallback(this, '${m.jobId}')" style="width:100%;height:100%;">`;
        document.getElementById('mmodal-name').innerText = m.name; document.getElementById('mmodal-job').innerText = `Lv.${m.level} ${m.job.name}`;
        document.getElementById('mmodal-job').style.color = m.job.color;
        document.getElementById('mmodal-titles').innerText = m.titles.length>0 ? m.titles.map(t=>`[${t}]`).join(' ') : "없음";
        document.getElementById('mmodal-cond').innerText = m.cond;
        document.getElementById('mmodal-power').innerText = `⚔️ ${m.power}`;
        document.getElementById('mmodal-stats1').innerText = `${m.str} / ${m.agi}`; document.getElementById('mmodal-stats2').innerText = `${m.int} / ${m.vit}`;
        document.getElementById('mmodal-stamina').innerText = `⚡ ${Math.floor(m.stamina)} / 100`; document.getElementById('mmodal-gold').innerText = `🪙 ${m.money}`;
        document.getElementById('mmodal-equip').innerText = m.gearName;
        document.getElementById('mmodal-buff').innerText = m.buff && guild.timeMin<m.buffEndMin ? `${m.buff.icon} ${m.buff.name}` : "없음";
        document.getElementById('mmodal-status').innerText = m.status==='resting'?"휴식 중":m.status==='training'?"수련 중":m.status==='questing'?"원정 중":"대기 중";
        document.getElementById('merc-modal').style.display = 'flex';
    }
    function closeMercModal() { document.getElementById('merc-modal').style.display = 'none'; }
    function encourageSelectedMerc() { let m=guild.roster.find(x=>x.id===selectedMercId); if(m && guild.money>=30) { guild.money-=30; m.stamina=100; m.cond="최상"; updateUI(); showToast("기력 회복!"); } }
    function tipSelectedMerc() { let m=guild.roster.find(x=>x.id===selectedMercId); if(m && guild.money>=100) { guild.money-=100; m.money+=100; m.cond="양호"; updateUI(); } }
    function dismissSelectedMerc() { let m=guild.roster.find(x=>x.id===selectedMercId); if(m && m.status!=='questing' && confirm("방출?")) { guild.roster=guild.roster.filter(x=>x.id!==m.id); closeMercModal(); updateUI(); } }
    function upgradeGuild() { if(guild.money >= guild.upgradeCost) { guild.money -= guild.upgradeCost; guild.capacity += 2; guild.upgradeCost = Math.floor(guild.upgradeCost*1.5); updateUI(); } }
    function promoteGuildRank() {
        let n = GUILD_RANKS[guild.rankIdx+1];
        if(n && guild.rep >= n.reqRep && guild.money >= n.reqGold && guild.roster.some(m=>m.job.tier>=n.reqTier)) { guild.money-=n.reqGold; guild.rankIdx++; updateUI(); showToast(`🎉 [${n.rank}급] 승급!`); }
        else showToast("조건 미달입니다.");
    }
    function craftItem(rId) {
        let r = FORGE_RECIPES.find(x=>x.id===rId);
        if(guild.money < r.cost) return showToast("자금 부족");
        for(let m in r.mats) if((guild.materials[m]||0) < r.mats[m]) return alert(`재료 부족: ${MAT_DB[m]}`);
        guild.money -= r.cost; for(let m in r.mats) guild.materials[m] -= r.mats[m];
        
        let isGreat = Math.random() < 0.05; // 명작 5%
        let atk = isGreat ? Math.floor(r.atk*1.35) : r.atk; let name = isGreat ? `[명작] ${r.name}` : r.name;
        guild.forgeStock.push({ name: name, job: r.job, atk: atk, price: isGreat?Math.floor(r.price*1.4):r.price });
        showToast(isGreat ? `🎉 명작 대성공! [${name}] 단조 완료!` : `🔨 [${name}] 단조 완료`); updateUI();
    }
    function deliverOrder(idx) {
        let o = guild.forgeOrders[idx]; let sIdx = guild.forgeStock.findIndex(i=>i.name.includes(o.targetItem));
        if(sIdx===-1) return alert("진열대에 장비가 없습니다.");
        guild.forgeStock.splice(sIdx,1); guild.money+=o.rewardGold; guild.rep+=o.rewardRep; guild.forgeOrders.splice(idx,1);
        showToast(`📦 납품 완수: +${o.rewardGold}G!`); updateUI();
    }

    function updateUI() {
        let h = Math.floor(guild.timeMin/60)%24; let m = Math.floor(guild.timeMin%60); let isNight = h>=18 || h<7;
        document.getElementById('ui-day').innerText = `D.${Math.floor(guild.timeMin/1440)+1}`;
        document.getElementById('ui-clock').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        document.getElementById('ui-open-status').innerText = isNight ? "마감" : "영업중"; document.getElementById('ui-open-status').className = isNight ? "open-status closed" : "open-status open";
        document.getElementById('ui-money').innerText = Math.floor(guild.money).toLocaleString();
        document.getElementById('ui-cap').innerText = `${guild.roster.length}/${guild.capacity}`; document.getElementById('ui-rep').innerText = guild.rep;
        document.getElementById('ui-rank-badge').innerText = `[${GUILD_RANKS[guild.rankIdx].rank}급]`;
        
        if(document.getElementById('view-roster').classList.contains('active')) {
            document.getElementById('roster-card-list').innerHTML = guild.roster.map(rm=>`
                <div class="idle-card" onclick="openMercModal('${rm.id}')">
                    <div class="card-row">
                        <div style="display:flex; gap:8px; align-items:center;">
                            <div class="card-avatar" style="border-color:${rm.job.color}"><img src="${rm.portraitUrl}" onerror="applyFallback(this, '${rm.jobId}')" style="width:100%;height:100%;"></div>
                            <div><b>${rm.name}</b> <small>Lv.${rm.level}</small><br><small style="color:${rm.job.color}">${rm.job.name}</small></div>
                        </div>
                        <div style="text-align:right;">⚔️ ${rm.power}<br><small>⚡ ${Math.floor(rm.stamina)} | 🪙 ${rm.money}</small></div>
                    </div>
                </div>`).join('');
            document.getElementById('btn-upgrade').innerText = `침상 증축 (+2인) : ${guild.upgradeCost}G`;
        }
        if(document.getElementById('view-quests').classList.contains('active')) {
            document.getElementById('quest-card-list').innerHTML = guild.quests.map(q=>`
                <div class="idle-card ${q.isAdvance?'adv-card':(q.isBoss?'boss-card':'')}">
                    <div class="card-row"><div><b>${q.title}</b><br><small>권장 ⚔️${q.reqPower}</small></div>
                    <div style="text-align:right;">${q.departed?'<small style="color:#e67e22">진행중</small>':`<b style="color:var(--hd-gold-bright)">🪙 ${q.reward}</b>`}</div></div>
                </div>`).join('');
        }
        if(document.getElementById('view-forge').classList.contains('active')) {
            let mHtml = "";
            for(let k in MAT_DB) if(guild.materials[k]>0) mHtml += `<div style="background:#230d04; padding:4px; font-size:0.7rem;">${MAT_DB[k]}: <b style="color:var(--hd-gold-bright)">${guild.materials[k]}</b></div>`;
            document.getElementById('mat-container').innerHTML = mHtml || "<small>재료 없음</small>";
            document.getElementById('forge-stock-view').innerHTML = guild.forgeStock.map(i=>`<div class="idle-card card-row"><div><b>${i.name}</b> <span class="badge-pill">${i.job}</span> (⚔️+${i.atk})</div><div style="color:var(--hd-gold-bright);">${i.price}G</div></div>`).join('');
            document.getElementById('forge-orders-view').innerHTML = guild.forgeOrders.map((o,idx)=>`<div class="idle-card card-row"><div><b>${o.title}</b><br><small>요청: ${o.targetItem}</small></div><button class="btn-sheet" onclick="deliverOrder(${idx})">납품</button></div>`).join('');
            document.getElementById('forge-recipes-view').innerHTML = FORGE_RECIPES.map(r=>{
                let mats = []; for(let k in r.mats) mats.push(`${MAT_DB[k]}:${r.mats[k]}`);
                return `<div class="idle-card"><div class="card-row"><div><b>${r.name}</b> <span class="badge-pill">${r.job}</span><br><small>비용:${r.cost}G | 재료:${mats.join(', ')}</small></div><button class="btn-sheet" onclick="craftItem('${r.id}')">제작</button></div></div>`;
            }).join('');
        }
        if(document.getElementById('view-manage').classList.contains('active')) {
            let nRank = GUILD_RANKS[guild.rankIdx+1];
            document.getElementById('ui-rank-req').innerText = nRank ? `${nRank.reqTier}차 용병 보유 | 명성 ${guild.rep}/${nRank.reqRep} | ${nRank.reqGold}G` : "최고 등급 달성";
            document.getElementById('trophy-list').innerHTML = Object.values(NAMED_BOSS_DB).map(b=>{
                let has = guild.unlockedTrophies.includes(b.id);
                return `<div class="idle-card" style="${has?'border-left:4px solid var(--hd-gold-bright);':'opacity:0.6'}"><div class="card-row"><div><b>${b.trophy}</b><br><small>칭호: [${b.grant}]</small></div>${has?'<small style="color:#27ae60">박제됨</small>':'<small>미토벌</small>'}</div></div>`;
            }).join('');
        }
    }

    // --- 5. 캔버스 AI 렌더링 ---
    const cvs = document.getElementById('innCanvas'); const ctx = cvs.getContext('2d');
    function draw() {
        ctx.fillStyle = "#1e2230"; ctx.fillRect(0,0,480,170); ctx.fillStyle = "#2d3345"; ctx.fillRect(0,60,480,110);
        ctx.fillStyle = "#3d2314"; ctx.fillRect(20, 75, 80, 45); ctx.fillStyle = "#6e3810"; ctx.fillRect(130, 75, 80, 45);
        ctx.fillStyle = "#5c4033"; ctx.fillRect(250, 75, 80, 45); ctx.fillStyle = "#2c3e50"; ctx.fillRect(360, 75, 80, 45);
        ctx.fillStyle = "#fff"; ctx.font="9px sans-serif";
        ctx.fillText("🛏️ 여관침실", 35, 95); ctx.fillText("🍺 주점", 150, 95); ctx.fillText("🎯 수련장", 270, 95); ctx.fillText("🔨 대장간", 380, 95);

        guild.roster.forEach(m => {
            if(m.status==='moving') { m.x += (m.targetX-m.x)*0.05; m.y += (m.targetY-m.y)*0.05; }
            else if(m.status==='idle') { m.x += 0.3; if(m.x<10||m.x>470) m.x=10; }
            else if(m.status==='resting') { if(m.currentAction==='tavern') m.x=170; else m.x=60; m.y=110; }
            else if(m.status==='training') { m.x=290; m.y=110; }
            else if(m.status==='questing' || m.status==='gathering') return;

            let cDef = CLASS_DB[m.jobId] || CLASS_DB["ADV_0"];
            ctx.fillStyle = cDef.color; ctx.fillRect(m.x-5, m.y-12, 10, 12);
            ctx.fillStyle = "#ffe0b2"; ctx.fillRect(m.x-4, m.y-18, 8, 7);
            ctx.fillStyle = "#fff"; ctx.textAlign="center"; ctx.fillText(m.name, m.x, m.y-22);
            let e = m.cond==="최상"?"😊":m.cond==="악화"?"🤢":"😐"; ctx.fillText(e, m.x, m.y-32);
        });
        requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // --- 6. 게임 루프 ---
    window.onload = () => {
        window.addEventListener('beforeunload', saveGameLocally);
        let s = localStorage.getItem(SAVE_KEY); if(s){ try{restoreGameLocally(s);}catch(e){initNewGame();} } else initNewGame();
        updateUI(); let frame = 0;

        setInterval(() => {
            frame++; guild.timeMin += 2 * gameSpeed;
            if(frame % 20 === 0) {
                guild.roster.forEach(m => m.think());
                guild.roster.forEach(m => {
                    let idx = guild.forgeStock.findIndex(i => i.job === m.job.name && m.money >= i.price && i.atk > m.gearAtk);
                    if(idx !== -1) {
                        let it = guild.forgeStock.splice(idx, 1)[0];
                        m.money -= it.price; guild.money += it.price; m.gearName = it.name; m.gearAtk = it.atk; m.cond = "최상";
                        showToast(`🛒 ${m.name}님이 [${it.name}] 장착!`);
                    }
                });
            }

            guild.roster.forEach(m => {
                if((m.status==='resting'||m.status==='training') && guild.timeMin >= m.targetMin) {
                    if(m.status==='training') { let prim = m.job.mainStat; m[prim] += 2; m.vit += 1; m.cond = "양호"; showToast(`💪 ${m.name} 훈련 완료!`); }
                    else { m.stamina = 100; m.cond="최상"; }
                    m.status='idle'; m.currentAction=null;
                }
            });

            guild.quests.forEach(q => {
                if(q.isParty && !q.departed && q.partyIds.length > 0) {
                    let pwr = q.partyIds.reduce((s,id)=>{ let m=guild.roster.find(x=>x.id===id); return s+(m?m.power:0); },0);
                    if(q.partyIds.length >= q.minParty && (pwr >= q.minPower || q.partyIds.length===q.maxParty)) {
                        q.departed = true; q.targetMin = guild.timeMin + q.durationMin;
                        q.partyIds.forEach(id=>{ let m=guild.roster.find(x=>x.id===id); if(m){ m.status='questing'; m.targetMin=q.targetMin; } });
                        showToast(`⚔️ [${q.title}] 파티 출격!`);
                    } else if(q.partyIds.length < q.minParty && (guild.timeMin - q.gatherStartMin) > 150) {
                        q.partyIds.forEach(id=>{ let m=guild.roster.find(x=>x.id===id); if(m){ m.status='idle'; m.cond="저하"; } });
                        q.deleteMe = true; showToast(`🚫 [${q.title}] 인원 미달로 해산`);
                    }
                }
                if(q.departed && guild.timeMin >= q.targetMin) {
                    let sq = [];
                    if(q.isParty) q.partyIds.forEach(id=>{let m=guild.roster.find(x=>x.id===id); if(m)sq.push(m);});
                    else if(q.assignedMercId) {let m=guild.roster.find(x=>x.id===q.assignedMercId); if(m)sq.push(m);}
                    
                    if(sq.length > 0) {
                        let win = Math.random() < 0.85; // 전투력 기반 생략, 기본 85% 승리
                        if(win) {
                            let fee = Math.floor(q.reward * getGuildFeeRate()); guild.money += fee; guild.questsCleared++; guild.rep+=3;
                            if(q.matReward) for(let k in q.matReward) guild.materials[k] += q.matReward[k];
                            if(q.isAdvance) { sq[0].jobId = q.advanceTarget; showToast(`🎉 ${sq[0].name} 승급!`); }
                            else if(q.isBoss && NAMED_BOSS_DB[q.bossKey]) { 
                                guild.unlockedTrophies.push(NAMED_BOSS_DB[q.bossKey].id); sq.forEach(m=>m.titles.push(NAMED_BOSS_DB[q.bossKey].grant)); showToast(`🏆 보스 토벌 성공!`); 
                            } else showToast(`📜 의뢰 성공! 보수 +${fee}G`);
                            sq.forEach(m => { m.money += Math.floor((q.reward-fee)/sq.length); m.exp += 60; m.cond="최상"; if(m.exp>=m.level*100){ m.level++; m.exp=0; m.str+=2; m.agi+=2; m.int+=2; m.vit+=2; showToast(`🌟 ${m.name} 렙업!`); } });
                        } else { sq.forEach(m=>m.cond="악화"); showToast(`🩸 의뢰 실패로 부상 귀환`); }
                        sq.forEach(m=>{ m.status='idle'; m.x=50; m.y=88; });
                    }
                    q.deleteMe = true;
                }
            });
            guild.quests = guild.quests.filter(q=>!q.deleteMe);
            if(guild.quests.length < 4 && Math.random() < 0.05 && isGuildOpen()) guild.quests.push(new Quest());
            if(guild.forgeOrders.length===0 && Math.random()<0.005) guild.forgeOrders.push({ title: "수비대 긴급납품", targetItem: "컴포지트 보우", rewardGold: 1000, rewardRep: 5 });

            if(frame % 10 === 0) updateUI();
            if(frame % 100 === 0) saveGameLocally();
        }, 100);
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a0c05">
    <title>판타지 용병 여관 (16비트 도트 타이쿤)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&family=Noto+Sans+KR:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 🏰 고밀도 마이크로 도트 팔레트 */
            --wood-black: #0c0502;
            --wood-shadow: #1e0d05;
            --wood-dark: #2c1408;
            --wood-base: #46220e;
            --wood-mid: #5e3015;
            --wood-light: #7a401e;
            --wood-highlight: #9c552a;
            --wood-rim: #bf6f3a;

            --parch-shadow: #b3925c;
            --parch-dark: #d2b37b;
            --parch-base: #ebd4a7;
            --parch-light: #faecd0;
            --parch-ink: #2b1509;

            --pixel-gold: #ffcc00;
            --pixel-amber: #e67e22;
            --pixel-red: #e74c3c;
            --pixel-green: #2ecc71;
            --pixel-blue: #3498db;

            --font-pixel: 'DungGeunMo', monospace;
            --font-main: 'Noto Sans KR', sans-serif;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none;
            touch-action: manipulation;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            text-rendering: geometricPrecision;
        }

        body {
            background-color: #060201;
            color: var(--parch-light);
            font-family: var(--font-pixel);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 📱 모바일 프레임 */
        #app {
            width: 100%;
            max-width: 440px;
            height: 100%;
            background: var(--wood-black);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 0 3px var(--wood-shadow);
            overflow: hidden;
        }

        /* 👑 16비트 도트 원목 현판 헤더 */
        header {
            flex-shrink: 0;
            background: 
                repeating-linear-gradient(0deg, #3d1b0a 0px, #3d1b0a 8px, #2a1105 8px, #2a1105 16px);
            border-bottom: 3px solid var(--wood-black);
            box-shadow: inset 0 2px 0 var(--wood-rim), 0 4px 10px rgba(0,0,0,0.8);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .guild-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1.05rem;
            color: var(--pixel-gold);
            text-shadow: 2px 2px 0 #000;
        }

        .time-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            background: #110602;
            padding: 3px 8px;
            border: 2px solid var(--wood-base);
            box-shadow: inset 1px 1px 0 #000, 1px 1px 0 var(--wood-highlight);
        }
        .day-tag { color: var(--pixel-gold); }
        .clock-tag { color: #fff; }
        .open-status {
            font-size: 0.72rem; padding: 1px 5px; border-radius: 2px;
            border: 1px solid #000;
        }
        .open-status.open { background: var(--pixel-green); color: #05260f; }
        .open-status.closed { background: var(--pixel-red); color: #fff; }

        .btn-speed {
            background: var(--wood-base);
            border: 2px solid var(--wood-black);
            box-shadow: inset 1px 1px 0 var(--wood-highlight), inset -1px -1px 0 #180802, 0 2px 0 #000;
            color: #fff; padding: 2px 8px;
            font-family: var(--font-pixel); font-size: 0.8rem; cursor: pointer;
        }
        .btn-speed:active { transform: translateY(1px); box-shadow: none; }

        .header-sub {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #190a04;
            padding: 5px 10px;
            border: 2px solid var(--wood-shadow);
            box-shadow: inset 1px 1px 0 #000;
        }
        .resource-pill { display: flex; align-items: center; gap: 5px; font-size: 0.95rem; }
        .resource-pill.gold { color: var(--pixel-gold); text-shadow: 1px 1px 0 #000; }
        .resource-pill.cap { color: #7bed9f; text-shadow: 1px 1px 0 #000; }

        .header-btn {
            background: #6c3483;
            border: 2px solid #110515;
            box-shadow: inset 1px 1px 0 #af7ac5, 0 2px 0 #000;
            color: #fff; padding: 3px 8px; font-size: 0.75rem; font-family: var(--font-pixel);
            cursor: pointer;
        }

        /* 🧭 메인 뷰 컨테이너 */
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #110703;
        }

        .view-pane {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .view-pane.active { display: flex; }

        /* ================== 🍻 뷰 1: 고밀도 도트 여관 홀 ================== */
        #view-hall {
            overflow: hidden;
            /* 정밀한 16비트 도트 원목 마루 바닥 텍스처 (도트 나뭇결 + 이음새 못 자국 패턴) */
            background: 
                radial-gradient(circle at 50% 20%, rgba(255, 180, 70, 0.28) 0%, rgba(16, 7, 3, 0.95) 85%),
                repeating-linear-gradient(0deg, #381a0b 0px, #381a0b 16px, #1a0a04 16px, #1a0a04 18px),
                repeating-linear-gradient(90deg, transparent 0px, transparent 96px, #140702 96px, #140702 98px);
            box-shadow: inset 0 0 60px rgba(0,0,0,0.85);
        }

        /* 원근 가이드 레이어 (미세 도트 격자) */
        .hall-depth-layer {
            position: absolute; top: 32%; left: 0; width: 100%; height: 68%;
            background-image: 
                linear-gradient(to right, transparent 49.5%, rgba(0,0,0,0.3) 49.5%, rgba(0,0,0,0.3) 50.5%, transparent 50.5%),
                linear-gradient(35deg, transparent 49.6%, rgba(0,0,0,0.2) 49.6%, rgba(0,0,0,0.2) 50.4%, transparent 50.4%),
                linear-gradient(-35deg, transparent 49.6%, rgba(0,0,0,0.2) 49.6%, rgba(0,0,0,0.2) 50.4%, transparent 50.4%);
            pointer-events: none;
        }

        /* 📍 시설 스탠드 (정교한 픽셀 보더) */
        .facility-stand {
            position: absolute; transform: translate(-50%, -100%);
            display: flex; flex-direction: column; align-items: center; z-index: 2; pointer-events: none;
        }
        .fac-sign {
            background: #231006; color: var(--pixel-gold);
            padding: 3px 7px; border: 2px solid var(--wood-black);
            box-shadow: inset 1px 1px 0 var(--wood-rim), 0 3px 0 #000;
            font-size: 0.65rem; font-family: var(--font-pixel); margin-bottom: 3px;
            white-space: nowrap; text-shadow: 1px 1px 0 #000;
        }
        .npc-emblem {
            width: 44px; height: 44px;
            border: 2px solid var(--wood-black);
            box-shadow: inset 2px 2px 0 var(--wood-highlight), inset -2px -2px 0 #100602, 0 4px 6px rgba(0,0,0,0.8);
            background: #381a0b; overflow: hidden;
        }
        .npc-emblem img { width: 100%; height: 100%; object-fit: cover; }
        .npc-nameplate {
            background: #140803; color: var(--parch-dark); padding: 2px 6px;
            border: 1px solid var(--wood-mid); font-size: 0.62rem; margin-top: 3px;
            box-shadow: 1px 1px 0 #000;
        }

        /* 🚶 고밀도 도트 용병 스프라이트 */
        .merc-sprite {
            position: absolute; transform: translate(-50%, -100%);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            cursor: pointer; pointer-events: auto;
            animation: pixelBob 1.6s infinite ease-in-out;
        }
        @keyframes pixelBob {
            0%, 100% { margin-top: 0px; }
            50% { margin-top: -2px; }
        }
        
        .floor-bubble {
            position: absolute; bottom: 62px; background: var(--parch-light);
            color: var(--parch-ink); border: 2px solid var(--wood-black);
            box-shadow: inset 1px 1px 0 #fff, 0 3px 0 rgba(0,0,0,0.8);
            font-size: 0.68rem; font-family: var(--font-pixel); padding: 4px 8px;
            width: max-content; max-width: 140px; text-align: center;
            opacity: 0; transition: opacity 0.15s; pointer-events: none;
        }
        .floor-bubble.show { opacity: 1; }

        .merc-emblem {
            width: 44px; height: 44px;
            border: 2px solid var(--wood-black);
            background: #2b1409;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.25), inset -2px -2px 0 rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; transition: transform 0.1s;
        }
        .merc-sprite:active .merc-emblem { transform: scale(0.92); }
        .merc-emblem img { width: 100%; height: 100%; object-fit: cover; }

        .nameplate {
            background: #180a04; padding: 2px 6px;
            border: 1px solid var(--wood-black);
            box-shadow: inset 1px 1px 0 var(--wood-base), 0 2px 0 #000;
            display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 3px;
        }
        .name-text { font-size: 0.64rem; font-family: var(--font-pixel); text-shadow: 1px 1px 0 #000; }
        
        /* 16비트 도트 체력바 (픽셀 눈금 분할) */
        .hp-bar-bg {
            width: 32px; height: 5px; background: #000;
            border: 1px solid #221006; overflow: hidden; position: relative;
        }
        .hp-bar-fill {
            height: 100%;
            background: repeating-linear-gradient(90deg, #2ecc71 0px, #2ecc71 4px, #27ae60 4px, #27ae60 5px);
            width: 100%;
        }

        /* 🍺 여관장 카운터 데스크 */
        .gm-desk {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50px;
            background: 
                repeating-linear-gradient(0deg, #4d230d 0px, #4d230d 8px, #361707 8px, #361707 16px);
            border-top: 3px solid var(--wood-black);
            box-shadow: inset 0 3px 0 var(--wood-rim), 0 -8px 20px rgba(0,0,0,0.85);
            z-index: 50; display: flex; justify-content: space-around; align-items: center;
        }
        .desk-props { font-size: 1.4rem; filter: drop-shadow(2px 2px 0 #000); }

        /* ================== 📜 도트 양피지 카드 UI ================== */
        .list-container {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sub-header-banner {
            background: #2a1206;
            border: 2px solid var(--wood-black);
            border-left: 5px solid var(--pixel-gold);
            box-shadow: inset 1px 1px 0 var(--wood-highlight), 0 2px 0 #000;
            padding: 6px 10px; font-size: 0.85rem; color: var(--parch-light);
            display: flex; justify-content: space-between; align-items: center;
        }

        /* 16비트 도트 테두리 양피지 카드 */
        .idle-card {
            background: var(--parch-base);
            color: var(--parch-ink);
            border: 2px solid var(--wood-black);
            box-shadow:
                inset 2px 2px 0px #fff,
                inset -2px -2px 0px var(--parch-shadow),
                0 4px 0px #0c0502;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.08s;
        }
        .idle-card:active { transform: translateY(2px); box-shadow: inset 2px 2px 0px #fff, inset -2px -2px 0px var(--parch-shadow), 0 2px 0px #0c0502; }

        .card-row { display: flex; align-items: center; justify-content: space-between; }

        .card-avatar {
            width: 42px; height: 42px; border: 2px solid var(--wood-black);
            box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 var(--parch-shadow);
            overflow: hidden; background: #2b1409; flex-shrink: 0;
        }
        .card-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .badge-pill {
            padding: 2px 5px; font-size: 0.65rem; border: 1px solid var(--wood-black);
            box-shadow: 1px 1px 0 #000;
        }

        .prog-track {
            width: 100%; height: 8px; background: #1a0c05;
            border: 1px solid var(--wood-black);
            overflow: hidden; margin-top: 3px;
        }
        .prog-bar {
            height: 100%;
            background: repeating-linear-gradient(90deg, #e67e22 0px, #e67e22 6px, #d35400 6px, #d35400 8px);
            width: 0%;
        }

        .btn-action-wide {
            background: #783814;
            border: 2px solid var(--wood-black);
            box-shadow: inset 2px 2px 0px var(--wood-rim), inset -2px -2px 0px #381504, 0 4px 0 #0c0502;
            color: var(--pixel-gold); font-family: var(--font-pixel); font-size: 0.92rem;
            padding: 11px; cursor: pointer; text-align: center;
        }
        .btn-action-wide:active { transform: translateY(2px); box-shadow: inset 2px 2px 0px var(--wood-rim), inset -2px -2px 0px #381504, 0 2px 0 #0c0502; }
        .btn-action-wide:disabled { background: #3d302a; border-color: #1f1815; color: #78665f; box-shadow: none; cursor: not-allowed; }

        /* ================== 📱 하단 16비트 내비바 ================== */
        nav#bottom-nav {
            flex-shrink: 0;
            height: 56px;
            background: #230f06;
            border-top: 3px solid var(--wood-black);
            box-shadow: inset 0 2px 0 var(--wood-base);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            z-index: 100;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: transparent;
            border: none;
            color: #9c6c4c;
            cursor: pointer;
            transition: 0.1s;
        }
        .nav-icon { font-size: 1.15rem; }
        .nav-label { font-size: 0.72rem; font-family: var(--font-pixel); }
        .nav-btn.active {
            background: rgba(0, 0, 0, 0.4);
            color: var(--pixel-gold);
            box-shadow: inset 0 -3px 0 var(--pixel-gold);
        }

        /* ================== 📜 도트 바텀시트 모달 ================== */
        .modal-backdrop {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 500; display: none;
            justify-content: center; align-items: flex-end;
        }

        .bottom-sheet {
            width: 100%;
            background: var(--parch-base);
            color: var(--parch-ink);
            border: 3px solid var(--wood-black);
            border-bottom: none;
            box-shadow: inset 3px 3px 0px #fff, inset -3px 0px 0px var(--parch-shadow), 0 -8px 25px rgba(0,0,0,0.9);
            padding: 16px 14px 20px 14px;
            display: flex; flex-direction: column; gap: 10px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.15s steps(6, end);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-pill-handle {
            width: 36px; height: 4px; background: var(--wood-base);
            box-shadow: 0 1px 0 #fff;
            align-self: center; margin-bottom: 2px;
        }

        .sheet-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
            background: var(--parch-light); padding: 8px;
            border: 2px solid var(--wood-black);
            box-shadow: inset 1px 1px 0 var(--parch-shadow);
            font-size: 0.76rem;
        }
        .sheet-grid-item { display: flex; justify-content: space-between; }
        .sheet-grid-item span:first-child { color: #5a3014; }
        .sheet-grid-item span:last-child { font-weight: 900; font-size: 0.88rem; }

        .sheet-actions {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
        }
        .btn-sheet {
            padding: 9px; font-size: 0.8rem; font-family: var(--font-pixel);
            border: 2px solid var(--wood-black);
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4), 0 3px 0 #0c0502;
            cursor: pointer; text-align: center;
        }
        .btn-sheet:active { transform: translateY(2px); box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4), 0 1px 0 #0c0502; }
        .btn-sheet.encourage { background: #27ae60; color: #fff; }
        .btn-sheet.tip { background: #d35400; color: #fff; }
        .btn-sheet.fire { background: #c0392b; color: #fff; grid-column: span 2; }
        .btn-sheet.close { background: #566573; color: #fff; grid-column: span 2; }

        /* 토스트 알림창 */
        #toast-log {
            position: absolute; top: 85px; left: 50%; transform: translateX(-50%);
            background: #180903;
            border: 2px solid var(--pixel-gold);
            box-shadow: inset 1px 1px 0 var(--wood-rim), 0 4px 12px rgba(0,0,0,0.9);
            color: var(--parch-light); padding: 6px 12px;
            font-size: 0.76rem; font-family: var(--font-pixel); display: none; z-index: 600;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="app">
    <header>
        <div class="header-top">
            <div class="guild-badge">
                <span>🍺 멧돼지 여관 길드</span>
            </div>
            <div class="time-box">
                <span class="day-tag" id="ui-day">D.1</span>
                <span class="clock-tag" id="ui-clock">08:00</span>
                <span class="open-status open" id="ui-open-status">영업중</span>
                <button class="btn-speed" id="btn-speed" onclick="toggleSpeed()">1x</button>
            </div>
        </div>
        <div class="header-sub">
            <div class="resource-pill gold">🪙 <span id="ui-money">500</span> G</div>
            <div class="resource-pill cap">👥 <span id="ui-cap">0 / 5</span></div>
            <button class="header-btn" onclick="openDict()">📖 직업 계통</button>
        </div>
    </header>

    <main>
        <div class="view-pane active" id="view-hall">
            <div class="hall-depth-layer"></div>
            
            <div class="gm-desk">
                <div class="desk-props">📜</div>
                <div class="desk-props">🍺</div>
                <div class="desk-props">🕯️</div>
                <div class="desk-props">🍖</div>
                <div class="desk-props">🪙</div>
            </div>

            <div class="facility-stand" id="fac-board">
                <div class="fac-sign">📜 의뢰 접수처</div>
                <div class="npc-emblem"><img src="https://api.dicebear.com/9.x/pixel-art/svg?seed=EileenReception&scale=110" alt="에일린"></div>
                <div class="npc-nameplate">[접수원] 에일린</div>
            </div>
            <div class="facility-stand" id="fac-inn">
                <div class="fac-sign">🛏️ 여관 침실</div>
                <div class="npc-emblem"><img src="https://api.dicebear.com/9.x/pixel-art/svg?seed=MarthaInnkeeper&scale=110" alt="마사"></div>
                <div class="npc-nameplate">[주모] 마사</div>
            </div>
            <div class="facility-stand" id="fac-tavern">
                <div class="fac-sign">🍺 주방 술통</div>
                <div class="npc-emblem"><img src="https://api.dicebear.com/9.x/pixel-art/svg?seed=GordonChef&scale=110" alt="고든"></div>
                <div class="npc-nameplate">[주방장] 고든</div>
            </div>
            <div class="facility-stand" id="fac-train">
                <div class="fac-sign">🎯 수련 짚단</div>
                <div class="npc-emblem"><img src="https://api.dicebear.com/9.x/pixel-art/svg?seed=BaronTrainer&scale=110" alt="바론"></div>
                <div class="npc-nameplate">[교관] 바론</div>
            </div>
            <div class="facility-stand" id="fac-shop">
                <div class="fac-sign">🛒 무기 모루</div>
                <div class="npc-emblem"><img src="https://api.dicebear.com/9.x/pixel-art/svg?seed=BrockSmith&scale=110" alt="브록"></div>
                <div class="npc-nameplate">[대장장이] 브록</div>
            </div>
        </div>

        <div class="view-pane" id="view-roster">
            <div class="list-container">
                <div class="sub-header-banner">
                    <span>📜 길드 숙박 용병 명부</span>
                    <span style="font-size:0.75rem; color:var(--pixel-gold);">터치하여 명령/관리</span>
                </div>
                <div id="roster-card-list" style="display:flex; flex-direction:column; gap:8px;"></div>
                <button class="btn-action-wide" id="btn-upgrade" onclick="upgradeGuild()" style="margin-top:6px;">여관 침상 증축 (+2인) : 1000G</button>
                <button onclick="resetGame()" style="background:none; border:none; color:#a06a44; font-size:0.7rem; font-family:var(--font-pixel); margin-top:8px; cursor:pointer; text-decoration:underline;">새 게임 시작 (데이터 초기화)</button>

<script>
    // ==========================================

        "R_3A1": { tier: 3, name: "나이트로드", color: "#1a252f", nextJobs: [], req: 30, cost: 8000 },

        "M_1": { tier: 1, name: "워록", color: "#7d3c98", nextJobs: ["M_2A", "M_2B"], req: 5, cost: 500 },
        "M_2A": { tier: 2, name: "아크메이지", color: "#5b2c6f", nextJobs: ["M_3A1", "M_3A2"], req: 15, cost: 2000 },
        "M_2B": { tier: 2, name: "서머너", color: "#4a235a", nextJobs: ["M_3B1", "M_3B2"], req: 15, cost: 2000 },
        "M_3A1": { tier: 3, name: "엘리멘탈마스터", color: "#154360", nextJobs: [], req: 30, cost: 8000 },

        "C_0": { tier: 0, name: "초보 성직자", color: "#d4ac0d", nextJobs: ["C_1"], req: 0, cost: 0 },
        "C_1": { tier: 1, name: "프리스트", color: "#b7950b", nextJobs: ["C_2A", "C_2B"], req: 5, cost: 500 },
        "C_2A": { tier: 2, name: "비숍", color: "#9a7d0a", nextJobs: ["C_3A1", "C_3A2"], req: 15, cost: 2000 },
        "C_2B": { tier: 2, name: "이단심문관", color: "#ba4a00", nextJobs: ["C_3B1", "C_3B2"], req: 15, cost: 2000 },
        "C_3A1": { tier: 3, name: "세인트", color: "#e67e22", nextJobs: [], req: 30, cost: 8000 },
        "C_3A2": { tier: 3, name: "하이프리스트", color: "#d35400", nextJobs: [], req: 30, cost: 8000 },
        "C_3B1": { tier: 3, name: "팔라딘", color: "#784212", nextJobs: [], req: 30, cost: 8000 },
        "C_3B2": { tier: 3, name: "다크프리스트", color: "#421a00", nextJobs: [], req: 30, cost: 8000 }
    };
    const BASE_CLASSES = ["W_0", "A_0", "R_0", "M_0", "C_0"];
    const EQUIP_SHOP = [
        { name: "무쇠 단검", cost: 300, powerUp: 20 },
        { name: "기사단 검", cost: 1000, powerUp: 50 },
        { name: "용비늘 보검", cost: 4000, powerUp: 150 }
    ];

    const FACILITIES = {
        board:  { name: "접수처", x: 50, y: 10 },
        inn:    { name: "침실", cost: 100, duration: 480, stam: 100, x: 16, y: 24 },
        train:  { name: "수련장", cost: 250, duration: 300, pwr: 5, x: 84, y: 24 },
        tavern: { name: "주방", cost: 30, duration: 60, stam: 40, x: 26, y: 60 },
        shop:   { name: "대장간", x: 74, y: 60 }
    };

    const SAVE_KEY = "fantasyGuild_Tavern_v11_finepixel";

    let guild = { timeMin: 480, money: 500, capacity: 5, upgradeCost: 1000, roster: [], quests: [] };
    let gameSpeed = 1; 
    let selectedMercId = null;

    function getDay() { return Math.floor(guild.timeMin / 1440) + 1; }
    function getHour() { return Math.floor(guild.timeMin / 60) % 24; }
    function getMin() { return Math.floor(guild.timeMin % 60); }
    function isGuildOpen() { let h = getHour(); return h >= 7 && h < 18; }

    // ==========================================
    // 2. 용병 & 의뢰 로직
    // ==========================================
    class Mercenary {
        constructor() {
            this.id = 'M_' + Date.now() + Math.floor(Math.random() * 10000);
            this.name = NAMES[Math.floor(Math.random() * NAMES.length)];
            this.baseJobId = BASE_CLASSES[Math.floor(Math.random() * BASE_CLASSES.length)];
            this.jobId = this.baseJobId; 
            
            // 고밀도 도트 픽셀 캐릭터 URL 생성 (Pixel Art 프리셋)
            this.portraitSeed = IMAGE_DB[this.baseJobId][Math.floor(Math.random() * IMAGE_DB[this.baseJobId].length)] + '_' + Math.floor(Math.random()*99);
            this.portraitUrl = `https://api.dicebear.com/9.x/pixel-art/svg?seed=${this.portraitSeed}&scale=110&backgroundColor=transparent`;
            
            this.level = 1; this.exp = 0; this.equipTier = 0;
            this.basePower = 15 + Math.floor(Math.random() * 10);
            this.money = 150 + Math.floor(Math.random() * 50); 
            
            this.stamina = 100; this.status = 'idle';
            this.targetMin = 0; this.currentAction = null; 
            this.pendingAction = null;
            
            this.thought = "맥주 한잔의 여유..."; this.showBubble = false; this.bubbleEnd = 0;
            this.tx = 50; this.ty = 90; this.targetX = 50; this.targetY = 50;
        }

        get job() { return CLASS_DB[this.jobId]; }
        get power() { return Math.floor(this.basePower * (1 + this.level * 0.15) * (this.job.tier + 1)); }

        setThought(text, durationGameMins = 30) {
            this.thought = text; this.showBubble = true;
            this.bubbleEnd = guild.timeMin + durationGameMins;
        }

        think() {
            if(this.status !== 'idle') return;
            if(Math.random() < 0.1) { this.targetX = 25 + Math.random()*50; this.targetY = 30 + Math.random()*50; }
            if(Math.random() > 0.35) return;

            // 1. 전직
            if(this.job.nextJobs && this.job.nextJobs.length > 0) {
                let nextJobId = this.job.nextJobs[Math.floor(Math.random() * this.job.nextJobs.length)];
                let nextJob = CLASS_DB[nextJobId];
                if(this.level >= nextJob.req && this.money >= nextJob.cost) {
                    this.status = 'moving';
                    this.pendingAction = "promote|" + nextJobId;
                    this.targetX = FACILITIES.board.x; this.targetY = FACILITIES.board.y + 8;
                    this.setThought(`승급 심사 받으러 가는 중!`, 20); return;
                }
            }

            // 2. 장비 구매
            if(this.equipTier < EQUIP_SHOP.length) {
                let eq = EQUIP_SHOP[this.equipTier];
                if(this.money >= eq.cost + 50) { 
                    this.status = 'moving';
                    this.pendingAction = "shop";
                    this.targetX = FACILITIES.shop.x; this.targetY = FACILITIES.shop.y + 8;
                    this.setThought(`무기 사러 모루로!`, 20); return;
                }
            }

            let isNight = !isGuildOpen();

            // 3. 휴식
            if(this.stamina < 30 || (isNight && this.stamina < 90)) {
                if(this.money >= FACILITIES.inn.cost && this.stamina < 60) return this.moveToFacility('inn');
                if(this.money >= FACILITIES.tavern.cost) return this.moveToFacility('tavern');
                if(isNight) return this.setThought("노숙 신세구만...", 40);
                else return this.setThought("피곤한데 돈이 없네...", 40);
            }

            // 4. 수련
            let trainChance = isNight ? 0.6 : 0.2;
            if(this.stamina > 50 && this.money >= FACILITIES.train.cost + 50 && Math.random() < trainChance) {
                return this.moveToFacility('train');
            }

            // 5. 의뢰 수주
            if(!isNight && this.stamina >= 20) {
                let avail = guild.quests.filter(q => !q.departed && (!q.isParty ? !q.assignedMercId : q.partyIds.length < q.maxParty)).sort((a,b) => b.reward - a.reward);
                if(avail.length > 0) {
                    for(let q of avail) {
                        if(this.stamina >= q.reqStamina) {
                            if(!q.isParty) {
                                q.assignedMercId = this.id;
                                this.status = 'moving';
                                this.pendingAction = "quest|" + q.id;
                                this.targetX = FACILITIES.board.x + (Math.random()*8 - 4); this.targetY = FACILITIES.board.y + 8;
                                return this.setThought(`게시판 의뢰 수주하러 감!`, 20);
                            } else {
                                q.partyIds.push(this.id);
                                if(q.partyIds.length === 1) q.gatherStartMin = guild.timeMin;
                                this.status = 'moving';
                                this.pendingAction = "gather|" + q.id;
                                this.targetX = FACILITIES.board.x + (Math.random()*16 - 8); this.targetY = FACILITIES.board.y + 8;
                                return this.setThought(`파티 모집에 합류하러 감!`, 20);
                            }
                        }
                    }
                } else if(Math.random() < 0.1) this.setThought("마땅한 의뢰가 없네...", 30);
            }
        }

        moveToFacility(type) {
            this.status = 'moving';
            this.pendingAction = "facility|" + type;
            let fac = FACILITIES[type];
            this.targetX = fac.x + (Math.random()*8 - 4); this.targetY = fac.y + (Math.random()*8 - 4);
            this.setThought(`[${fac.name}] 가는 중`, 20);
        }

        executePendingAction() {
            if(!this.pendingAction) { this.status = 'idle'; return; }
            let [type, target] = this.pendingAction.split('|');
            this.pendingAction = null;

            if(type === 'promote') {
                let nextJob = CLASS_DB[target];
                this.money -= nextJob.cost; guild.money += nextJob.cost; 
                this.jobId = target; this.status = 'idle';
                this.setThought(`✨ [${nextJob.name}] 승급 완료!`, 60); showToast(`📜 ${this.name} 전직 완료 (+${nextJob.cost}G)`);
            }
            else if(type === 'shop') {
                let eq = EQUIP_SHOP[this.equipTier];
                this.money -= eq.cost; guild.money += eq.cost;
                this.equipTier++; this.basePower += eq.powerUp; this.status = 'idle';
                this.setThought(`🛒 [${eq.name}] 장착! 든든하군.`, 60); showToast(`⚔️ ${this.name} 장비 구매 (+${eq.cost}G)`);
            }
            else if(type === 'facility') {
                let fac = FACILITIES[target];
                this.money -= fac.cost; guild.money += fac.cost; 
                this.status = target === 'train' ? 'training' : 'resting';
                this.currentAction = target; this.targetMin = guild.timeMin + fac.duration;
                this.setThought(`[${fac.name}] 이용 중...`, fac.duration);
            }
            else if(type === 'quest') {
                let q = guild.quests.find(x => x.id === target);
                if(q) {
                    if(this.power < q.minPower) {
                        q.assignedMercId = null;
                        this.status = 'idle';
                        this.setThought(`에일린: "전투력 ⚔️${q.minPower} 이상이어야 해요!"`, 80);
                        showToast(`🚫 [접수 거절] 에일린: "${this.name}님은 전투력(⚔️${this.power}/${q.minPower}) 미달로 반려되었습니다."`);
                        return;
                    }

                    this.stamina -= q.reqStamina; this.status = 'questing';
                    q.departed = true; q.targetMin = guild.timeMin + q.durationMin; this.targetMin = q.targetMin;
                    this.setThought(`[${q.title}] 출격 완료!`, 60);
                    showToast(`⚔️ [${this.name}] 의뢰 출격!`);
                } else this.status = 'idle';
            }
            else if(type === 'gather') {
                let q = guild.quests.find(x => x.id === target);
                if(q) {
                    let memberMinPower = Math.floor(q.minPower / q.maxParty * 0.6);
                    if(this.power < memberMinPower) {
                        q.partyIds = q.partyIds.filter(id => id !== this.id);
                        this.status = 'idle';
                        this.setThought(`에일린: "파티 최소 권장치(⚔️${memberMinPower})에 못 미쳐요!"`, 80);
                        showToast(`🚫 [접수 거절] 에일린: "${this.name}님은 파티 참가 자격이 부족합니다."`);
                        return;
                    }

                    this.stamina -= q.reqStamina; this.status = 'gathering';
                    this.setThought(`파티원 기다리는 중...`, 60);
                } else this.status = 'idle';
            }
        }
    }

    class Quest {
        constructor() {
            this.id = 'Q_' + Date.now() + Math.floor(Math.random()*100);
            this.isParty = Math.random() < 0.4; 
            
            if(this.isParty) {
                this.title = ["드래곤 수색(파티)", "산적단 소탕(파티)", "오크 군락(파티)", "심연 던전(파티)"][Math.floor(Math.random()*4)];
                this.minParty = 2;
                this.maxParty = 3 + Math.floor(Math.random() * 2);
                this.partyIds = []; this.gatherStartMin = null;
            } else {
                this.title = ["고블린 토벌", "양조장 호위", "도적단 추적", "묘지 정화", "약초 채집"][Math.floor(Math.random()*5)];
                this.assignedMercId = null;
                this.minParty = 1; this.maxParty = 1;
            }

            this.departed = false;
            this.durationMin = (2 + Math.floor(Math.random() * 4)) * 60; 
            
            let baseReq = 16 + (getDay() * 3);
            if(this.isParty) baseReq *= 2.6; 
            this.reqPower = Math.floor(baseReq * (0.8 + Math.random() * 0.6));
            this.minPower = Math.floor(this.reqPower * 0.72);

            this.reqStamina = 20 + Math.floor(Math.random() * 20); 
            this.reward = this.reqPower * (5 + Math.floor(Math.random() * 3)); 
            this.targetMin = 0;
        }
    }

    function switchNavTab(tabId) {
        document.querySelectorAll('.view-pane').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

        document.getElementById(`view-${tabId}`).classList.add('active');
        document.getElementById(`tab-btn-${tabId}`).classList.add('active');
        updateUI();
    }

    function toggleSpeed() {
        if(gameSpeed === 1) gameSpeed = 2;
        else if(gameSpeed === 2) gameSpeed = 5;
        else gameSpeed = 1;
        document.getElementById('btn-speed').innerText = `${gameSpeed}x`;
    }

    function showToast(msg) {
        const toast = document.getElementById('toast-log');
        toast.innerText = msg; toast.style.display = 'block';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.style.display = 'none', 2800);

    function openMercModal(id) {
        selectedMercId = id;
        updateMercModal();
        document.getElementById('merc-modal').style.display = 'flex';
    }

    function closeMercModal() {
        selectedMercId = null;
        document.getElementById('merc-modal').style.display = 'none';
    }

    function updateMercModal() {
        if(!selectedMercId) return;
        let m = guild.roster.find(x => x.id === selectedMercId);
        if(!m) { closeMercModal(); return; }

        let pBox = document.getElementById('mmodal-portrait');
        pBox.style.borderColor = m.job.color;
        pBox.innerHTML = `<img src="${m.portraitUrl}" alt="p">`;

        document.getElementById('mmodal-name').innerText = m.name;
        let jobEl = document.getElementById('mmodal-job');
        jobEl.innerText = `${m.job.tier}차 [${m.job.name}]`;
        jobEl.style.color = m.job.color;

        document.getElementById('mmodal-lv').innerText = `Lv.${m.level} (${m.exp}/${m.level*100})`;
        document.getElementById('mmodal-power').innerText = `⚔️ ${m.power}`;
        document.getElementById('mmodal-stamina').innerText = `⚡ ${Math.floor(m.stamina)} / 100`;
        document.getElementById('mmodal-gold').innerText = `🪙 ${m.money}`;
        document.getElementById('mmodal-equip').innerText = m.equipTier === 0 ? "기본 장비" : EQUIP_SHOP[m.equipTier - 1].name;

        let statusNames = { 'idle': '여관 홀에서 휴식', 'moving': '시설 이동 중', 'gathering': '파티 결성 대기', 'questing': '원정 의뢰 수행 중', 'resting': '기력 회복 중', 'training': '수련장에서 특훈 중' };
        document.getElementById('mmodal-status').innerText = statusNames[m.status] || m.status;
    }

    function encourageSelectedMerc() {
        if(!selectedMercId) return;
        let m = guild.roster.find(x => x.id === selectedMercId);
        if(!m) return;
        if(guild.money < 30) return showToast("⚠️ 길드 자금이 부족합니다 (30G 필요)");
        if(m.stamina >= 100) return showToast("⚠️ 기력이 이미 가득 찼습니다");

        guild.money -= 30; m.stamina = Math.min(100, m.stamina + 30);
        m.setThought("여관주인표 흑맥주 최고!", 50);
        showToast(`🍺 ${m.name}에게 맥주 한잔 대접 (기력 +30, -30G)`);
        updateUI();
    }

    function tipSelectedMerc() {
        if(!selectedMercId) return;
        let m = guild.roster.find(x => x.id === selectedMercId);
        if(!m) return;
        if(guild.money < 100) return showToast("⚠️ 길드 자금이 부족합니다 (100G 필요)");

        guild.money -= 100; m.money += 100;
        m.setThought("활동비 감사합니다! 장비 사러 가야지.", 60);
        showToast(`🪙 ${m.name}에게 100G 지급 완료`);
        updateUI();
    }

    function dismissSelectedMerc() {
        if(!selectedMercId) return;
        let m = guild.roster.find(x => x.id === selectedMercId);
        if(!m) return;
        if(m.status === 'questing') return showToast("⚠️ 원정 중인 용병은 방출할 수 없습니다");

        if(confirm(`${m.name} 용병을 여관에서 방출하시겠습니까?`)) {
            guild.quests.forEach(q => {
                if(!q.departed) {
                    if(q.assignedMercId === m.id) q.assignedMercId = null;
                    if(q.partyIds) q.partyIds = q.partyIds.filter(id => id !== m.id);
                }
            });
            let el = document.getElementById('sprite-' + m.id);
            if(el) el.remove();
            guild.roster = guild.roster.filter(x => x.id !== m.id);
            showToast(`🚪 ${m.name} 용병이 짐을 싸서 떠났습니다`);
            closeMercModal();
            updateUI();
        }
    }

    function upgradeGuild() {
        if(guild.money >= guild.upgradeCost) {
            guild.money -= guild.upgradeCost;
            guild.capacity += 2;
            guild.upgradeCost = Math.floor(guild.upgradeCost * 1.5);
            showToast(`🏰 여관 침상 증축! 최대 수용 ${guild.capacity}인`);
            updateUI();
        }
    }

        document.getElementById('ui-clock').innerText = `${h}:${m}`;
        let statusEl = document.getElementById('ui-open-status');
        if(isGuildOpen()) {
            statusEl.className = "open-status open"; statusEl.innerText = "영업중";
        } else {
            statusEl.className = "open-status closed"; statusEl.innerText = "마감";
        }

        document.getElementById('ui-money').innerText = Math.floor(guild.money).toLocaleString();
        document.getElementById('ui-cap').innerText = `${guild.roster.length} / ${guild.capacity}`;

        let btnUp = document.getElementById('btn-upgrade');
        btnUp.innerText = `여관 침상 증축 (+2인) : ${guild.upgradeCost}G`;
        btnUp.disabled = guild.money < guild.upgradeCost;

        // 용병 명부 렌더링
        if(document.getElementById('view-roster').classList.contains('active')) {

                            <div>

                    stateHtml = `

    // 🌟 1인칭 홀 스케일 렌더링
    let facStandRendered = false;
    function renderFloor() {
        if(!document.getElementById('view-hall').classList.contains('active')) return;

        if(!facStandRendered) {
            for(let key in FACILITIES) {
                let f = FACILITIES[key]; let el = document.getElementById('fac-' + key);
                if(el) {
                    let yDepth = f.y; 
                    let renderTop = 32 + (yDepth * 0.68); 
                    let scale = 0.52 + (yDepth * 0.005); 
                    el.style.left = f.x + '%'; el.style.top = renderTop + '%';
                    el.style.transform = `translate(-50%, -100%) scale(${scale})`;
                    el.style.zIndex = Math.floor(yDepth);
                }
            }
            facStandRendered = true;
        }

        const container = document.getElementById('view-hall');
        guild.roster.forEach(merc => {
            if(merc.showBubble && guild.timeMin >= merc.bubbleEnd) merc.showBubble = false;
            let el = document.getElementById('sprite-' + merc.id);
            
            if(merc.status === 'questing') { if(el) el.style.opacity = '0'; return; }
            
            if(!el) {
                el = document.createElement('div'); el.id = 'sprite-' + merc.id; el.className = 'merc-sprite';
                el.onclick = () => openMercModal(merc.id);
                el.innerHTML = `
                    <div class="floor-bubble" id="bubble-${merc.id}"></div>
                    <div class="merc-emblem" style="border-color: ${merc.job.color}"><img src="${merc.portraitUrl}" alt="${merc.name}"></div>
                    <div class="nameplate"><span class="name-text" style="color:${merc.job.color}">${merc.name}</span>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-${merc.id}"></div></div></div>`;
                container.appendChild(el);
            } else el.style.opacity = '1';
            
            let yDepth = Math.max(0, Math.min(100, merc.ty)); 
            let renderTop = 32 + (yDepth * 0.68); 
            let scale = 0.52 + (yDepth * 0.0055); 

            el.style.left = merc.tx + '%'; 
            el.style.top = renderTop + '%';
            el.style.transform = `translate(-50%, -100%) scale(${scale})`;
            el.style.zIndex = Math.floor(yDepth) + 1; 
            
            let hpEl = document.getElementById('hp-' + merc.id);
            if(hpEl) hpEl.style.width = `${(merc.stamina / 100)*100}%`;
            
            let bubble = document.getElementById('bubble-' + merc.id);
            if(bubble) {
                if(merc.showBubble) { bubble.innerText = merc.thought; bubble.classList.add('show'); } 
                else bubble.classList.remove('show');
            }
        });
    }

    // ==========================================
    // 💾 오토 세이브 & 라이프사이클
    // ==========================================
    function saveGameLocally() {
        let data = {
            t: guild.timeMin, m: guild.money, c: guild.capacity, u: guild.upgradeCost,
            r: guild.roster.map(m => [m.id, m.name, m.baseJobId, m.jobId, m.portraitSeed, m.level, m.exp, m.equipTier, m.basePower, m.money, m.stamina, m.status, m.currentAction, m.targetMin, m.pendingAction]),
            q: guild.quests.map(q => [q.id, q.title, q.durationMin, q.reqPower, q.reqStamina, q.reward, q.assignedMercId, q.targetMin, q.isParty?1:0, q.partyIds||[], q.maxParty||0, q.departed?1:0, q.gatherStartMin||0, q.minParty||1, q.minPower||0])
        };
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch(e){}
    }

    function restoreGameLocally(jsonStr) {
        let d = JSON.parse(jsonStr);
        guild.timeMin = d.t; guild.money = d.m; guild.capacity = d.c; guild.upgradeCost = d.u;
        
        guild.roster = [];
        for(let arr of d.r) {
            let m = new Mercenary();
            m.id = arr[0]; m.name = arr[1]; m.baseJobId = arr[2]; m.jobId = arr[3];
            m.portraitSeed = arr[4] || 'FelixKnight_1';
            m.portraitUrl = `https://api.dicebear.com/9.x/pixel-art/svg?seed=${m.portraitSeed}&scale=110&backgroundColor=transparent`;
            m.level = arr[5]; m.exp = arr[6]; m.equipTier = arr[7]; m.basePower = arr[8]; m.money = arr[9];
            m.stamina = arr[10]; m.status = arr[11] === 'moving' ? 'idle' : arr[11];
            m.currentAction = arr[12]; m.targetMin = arr[13]; m.pendingAction = null; 
            m.showBubble = false;
            guild.roster.push(m);
        }
        
        guild.quests = [];
        for(let arr of d.q) {
            let q = new Quest();
            q.id = arr[0]; q.title = arr[1]; q.durationMin = arr[2]; q.reqPower = arr[3]; q.reqStamina = arr[4];
            q.reward = arr[5]; q.assignedMercId = arr[6]; q.targetMin = arr[7];
            q.isParty = !!arr[8]; q.partyIds = arr[9]||[]; q.maxParty = arr[10]||1; q.departed = !!arr[11]; q.gatherStartMin = arr[12]||0;
            q.minParty = arr[13] || (q.isParty ? 2 : 1);
            q.minPower = arr[14] || Math.floor(q.reqPower * 0.72);
            guild.quests.push(q);
        }
    }

    function initNewGame() {
        guild = { timeMin: 480, money: 500, capacity: 5, upgradeCost: 1000, roster: [], quests: [] };
        for(let i=0; i<3; i++) { guild.roster.push(new Mercenary()); guild.quests.push(new Quest()); }
    }

    function resetGame() {
        if(confirm("모든 데이터를 초기화하고 처음부터 다시 시작하시겠습니까?")) {
            localStorage.removeItem(SAVE_KEY); location.reload();
        }
    }

    // ==========================================
    // 4. 메인 게임 루프
    // ==========================================
    window.onload = () => {
        window.addEventListener('beforeunload', saveGameLocally);

        let saved = localStorage.getItem(SAVE_KEY);
        if(saved) {
            try { restoreGameLocally(saved); showToast("여관 장부 데이터를 불러왔습니다."); } 
            catch(e) { initNewGame(); }
        } else { initNewGame(); }

        updateUI();
        let frame = 0;

        setInterval(() => { if(frame % 50 === 0) saveGameLocally(); }, 100);

        setInterval(() => {
            frame++;

            guild.roster.forEach(m => {
                let spd = 0.1 * gameSpeed;
                m.tx += (m.targetX - m.tx) * Math.min(1, spd);
                m.ty += (m.targetY - m.ty) * Math.min(1, spd);
                
                let dist = Math.hypot(m.targetX - m.tx, m.targetY - m.ty);
                if(m.status === 'moving' && dist < 1.5) {
                    m.executePendingAction();
                }
            });

            renderFloor();

            let prevH = getHour();
            guild.timeMin += (0.24 * gameSpeed);
            let currH = getHour();

            if(currH !== prevH) {
                if(currH === 0) {
                    let cost = guild.roster.length * 50; guild.money -= cost;
                    showToast(`🌙 자정 여관 숙박 유지비 -${cost}G`);
                }
                if(currH === 8 && guild.roster.length < guild.capacity && Math.random() < 0.8) {
                    guild.roster.push(new Mercenary());
                    showToast("🚪 새로운 방랑 모험가가 여관에 들어왔습니다");
                }
                if(currH === 18) showToast("🔒 접수처 의뢰 접수 마감");
                if(currH === 7) showToast("🔓 접수처 영업 시작");

                guild.roster.forEach(m => { if(m.status === 'idle') m.stamina = Math.min(100, m.stamina + 5); });
            }

            if(frame % Math.max(2, Math.floor(20 / gameSpeed)) === 0) {
                guild.roster.forEach(m => m.think());
            }

            if(isGuildOpen() && Math.random() < (0.005 * gameSpeed) && guild.quests.length < 6) {
                guild.quests.push(new Quest());
            }

            guild.roster.forEach(merc => {
                if(merc.status === 'resting' || merc.status === 'training') {
                    if(guild.timeMin >= merc.targetMin) {
                        if(merc.currentAction === 'train') {
                            merc.basePower += FACILITIES.train.pwr;
                            merc.setThought("특훈 완료! 몸이 단단해졌다.", 60);
                        } else if(FACILITIES[merc.currentAction]) {
                            merc.stamina = Math.min(100, merc.stamina + FACILITIES[merc.currentAction].stam);
                            merc.setThought("기력 충전 완료!", 60);
                        }
                        merc.status = 'idle'; merc.currentAction = null;
                    }
                }
            });

            // 퀘스트 출발 및 완료 판정
            guild.quests.forEach(q => {
                if(q.isParty && !q.departed && q.partyIds.length > 0) {
                    let pPower = q.partyIds.reduce((sum, id) => { let m = guild.roster.find(x=>x.id===id); return sum + (m?m.power:0); }, 0);
                    let waitTime = guild.timeMin - q.gatherStartMin;

                    let hasMinParty = (q.partyIds.length >= q.minParty);
                    let isFull = (q.partyIds.length >= q.maxParty);
                    let powerReady = (pPower >= q.minPower);

                    if(hasMinParty && (powerReady || isFull || waitTime > 150)) {
                        q.departed = true; q.targetMin = guild.timeMin + q.durationMin;
                        q.partyIds.forEach(id => {
                            let m = guild.roster.find(x=>x.id===id);
                            if(m) { m.status = 'questing'; m.targetMin = q.targetMin; }
                        });
                        let pNames = q.partyIds.map(id => guild.roster.find(m=>m.id===id)?.name).join(', ');
                        showToast(`⚔️ [${pNames}] 파티 원정 출발!`);
                    } else if(!hasMinParty && waitTime > 200) {
                        q.partyIds.forEach(id => {
                            let m = guild.roster.find(x=>x.id===id);
                            if(m) {
                                m.status = 'idle';
                                m.setThought(`인원 미달로 파티가 해산되었어...`, 60);
                            }
                        });
                        showToast(`🚫 [의뢰 취소] [${q.title}] 모집 인원 미달로 해산되었습니다.`);
                        q.deleteMe = true;
                    }
                }

                if(q.departed && guild.timeMin >= q.targetMin) {
                    let squad = [];
                    if(!q.isParty && q.assignedMercId) {
                        let m = guild.roster.find(x=>x.id===q.assignedMercId); if(m) squad.push(m);
                    } else if(q.isParty) {
                        q.partyIds.forEach(id => { let m = guild.roster.find(x=>x.id===id); if(m) squad.push(m); });
                    }

                    if(squad.length > 0) {
                        let totalPwr = squad.reduce((s,m) => s + m.power, 0);
                        let winRate = Math.min(95, Math.max(10, Math.floor((totalPwr / q.reqPower) * 70)));
                        let isWin = (Math.random() * 100 <= winRate);
                        let gCut = Math.floor(q.reward * 0.2);
                        let pReward = Math.floor((q.reward - gCut) / squad.length);

                        if(isWin) guild.money += gCut;

                        squad.forEach(merc => {
                            merc.status = 'idle'; merc.targetX = 50; merc.targetY = 88;
                            if(isWin) {
                                merc.money += pReward; merc.exp += (q.reqPower * 2);
                                merc.setThought("보수 두둑하게 챙겼다! 꿀맛이네.", 100);
                                if(merc.exp >= merc.level * 100) { merc.exp -= merc.level*100; merc.level++; }
                            } else {
                                merc.exp += q.reqPower; merc.setThought("크윽... 몬스터가 너무 강했어.", 100);
                            }
                        });

                        let sNames = squad.map(x=>x.name).join(', ');
                        if(isWin) showToast(`📜 [${sNames}] 의뢰 성공! (수수료: +${gCut}G)`);
                        else showToast(`🩸 [${sNames}] 의뢰 실패...`);
                    }
                    q.deleteMe = true;
                }
            });

            guild.quests = guild.quests.filter(q => !q.deleteMe);
            if(frame % 10 === 0) updateUI();
        }, 100);
    };
</script>

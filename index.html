<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판타지 용병 길드 (관찰형 타이쿤)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #110a05; --wood-floor: #3e2723;
            --gold: #f1c40f; --text-light: #fdf5e6;
            --font-main: 'Noto Sans KR', sans-serif;
            --ui-bg: rgba(25, 18, 12, 0.9); --ui-border: #8b5a2b;
        }

        body {
            background-color: var(--bg-dark); color: var(--text-light); font-family: var(--font-main);
            margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none;
        }

        /* 🔐 로그인 오버레이 */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;
            background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: var(--ui-bg); padding: 40px; border-radius: 8px; border: 2px solid var(--gold);
            text-align: center; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 300px;
        }
        .login-box h1 { margin: 0; color: var(--gold); font-size: 1.5rem; text-shadow: 2px 2px 0 #000; }
        .login-box input { padding: 10px; font-size: 1rem; border: 1px solid var(--ui-border); background: #111; color: #fff; border-radius: 4px; outline: none;}
        .login-box button { background: linear-gradient(to bottom, #d35400, #a04000); color: #fff; border: 1px solid #111; padding: 12px; font-weight: 900; font-size: 1rem; border-radius: 4px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.5);}
        .login-box button:hover { background: linear-gradient(to bottom, #e67e22, #ba4a00); transform: translateY(-2px);}

        /* 🏰 상단 길드 정보창 */
        header {
            position: absolute; top: 15px; left: 20px; right: 20px; z-index: 100;
            background: var(--ui-bg); padding: 12px 30px; border-radius: 8px; border: 2px solid var(--ui-border);
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,0.8);
        }

        .guild-title { font-size: 1.5rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        .guild-stats { display: flex; gap: 30px; align-items: center; font-weight: 700; font-size: 1.1rem;}
        
        .time-wrapper { display: flex; flex-direction: column; gap: 4px; align-items: center;}
        .time-header { display: flex; gap: 10px; align-items: center;}
        .time-text { font-weight: 900; font-family: monospace; font-size: 1.2rem; }
        
        /* ⏩ 배속 버튼 */
        .btn-speed { background: #34495e; color: #fff; border: 1px solid #2c3e50; padding: 2px 8px; border-radius: 4px; font-weight: 900; cursor: pointer; font-size: 0.8rem;}
        .btn-speed:hover { background: #415b76; }

        .time-bg { width: 180px; height: 6px; background: #000; border-radius: 3px; border: 1px solid #555;}
        .time-fill { height: 100%; background: linear-gradient(90deg, #f1c40f, #e67e22, #3498db); width: 0%; transition: width 0.1s linear;}
        
        .money-text { color: var(--gold); font-size: 1.3rem; }
        .capacity-text { color: #2ecc71; }

        .btn-save { background: #8e44ad; color: #fff; border: 1px solid #111; padding: 6px 12px; border-radius: 4px; font-weight: 900; cursor: pointer;}
        .btn-save:hover { background: #9b59b6; }

        /* ================== 메인 화면: 바닥 ================== */
        main { position: relative; width: 100%; height: 100%; display: flex; }

        #floor-container {
            flex: 1; position: relative; background-color: var(--wood-floor);
            background-image: 
                linear-gradient(90deg, rgba(0,0,0,0.8) 0px, transparent 4px, transparent 96px, rgba(0,0,0,0.8) 100px),
                linear-gradient(0deg, rgba(0,0,0,0.3) 0px, transparent 2px, transparent 18px, rgba(0,0,0,0.3) 20px);
            background-size: 100px 100px, 100px 20px;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.95);
        }

        .facility-area {
            position: absolute; padding: 15px 25px; border-radius: 8px; font-weight: 900; 
            background: rgba(0,0,0,0.7); border: 2px solid; pointer-events: none; text-shadow: 1px 1px 2px #000;
        }

        /* 🚶 용병 아바타 */
        .merc-sprite {
            position: absolute; transform: translate(-50%, -50%);
            transition: top 0.5s linear, left 0.5s linear; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        
        .floor-bubble {
            position: absolute; bottom: 65px; background: #fff; color: #111; font-size: 0.8rem; font-weight: 900; 
            padding: 6px 12px; border-radius: 6px; width: max-content; max-width: 150px; text-align: center; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .floor-bubble.show { opacity: 1; }

        .merc-emblem {
            width: 48px; height: 48px; border-radius: 50%; border: 3px solid; 
            overflow: hidden; background: #fff; 
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.8), inset 0 0 5px rgba(0,0,0,0.3);
        }
        .merc-emblem img { width: 100%; height: 100%; object-fit: cover; }

        .nameplate {
            background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; border: 1px solid #555;
            display: flex; flex-direction: column; align-items: center; gap: 3px; margin-top: 5px;
        }
        .name-text { font-size: 0.7rem; font-weight: 900; }
        .hp-bar-bg { width: 35px; height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
        .hp-bar-fill { height: 100%; background: #3498db; width: 100%; }

        /* ================== 우측: 사이드바 ================== */
        .sidebar {
            width: 340px; background: var(--ui-bg); border-left: 2px solid var(--ui-border);
            display: flex; flex-direction: column; z-index: 50; padding-top: 85px; box-shadow: -5px 0 15px rgba(0,0,0,0.7);
        }
        
        .side-panel { display: flex; flex-direction: column; flex: 1; border-bottom: 2px solid #333;}
        .side-header { background: rgba(0,0,0,0.6); padding: 10px; text-align: center; font-weight: 900; font-size: 0.9rem; color: #f1c40f;}
        .side-content { padding: 10px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }

        .list-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; border: 1px solid #444; display: flex; flex-direction: column; gap: 4px; }
        
        .side-merc-info { display: flex; gap: 10px; align-items: center; }
        .mini-portrait { width: 42px; height: 42px; border-radius: 50%; border: 2px solid; object-fit: cover; background: #fff;}

        .list-title { display: flex; justify-content: space-between; font-weight: 900; font-size: 0.85rem; color: #fff;}
        .list-desc { font-size: 0.75rem; color: #ccc; display: flex; justify-content: space-between;}
        
        .prog-bg-side { width: 100%; height: 6px; background: #111; border-radius: 3px; overflow: hidden; margin-top: 2px;}
        .prog-fill-side { height: 100%; background: #e67e22; width: 0%; }

        button.upgrade-btn {
            background: linear-gradient(to bottom, #8e44ad, #5b2c6f); border: 1px solid #111; color: #fff;
            padding: 10px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; margin: 10px;
        }
        button.upgrade-btn:hover:not(:disabled) { background: linear-gradient(to bottom, #9b59b6, #732d91); }
        button.upgrade-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

        #log-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(20, 10, 5, 0.95); padding: 12px 25px; border-radius: 8px; border: 2px solid #f1c40f; display: none; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.8); }
        #log-text { color: #fff; font-weight: 900; font-size: 0.9rem; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #8b5a2b; border-radius: 3px; }
    </style>
</head>
<body>

    <!-- 🔐 로그인/데이터 로드 화면 -->
    <div id="login-screen">
        <div class="login-box">
            <h1>🛡️ 용병 길드 로그인</h1>
            <div style="font-size:0.8rem; color:#aaa; margin-bottom:10px;">기존 아이디 입력 시 데이터를 불러옵니다.</div>
            <input type="text" id="login-id" placeholder="아이디" value="guildMaster">
            <input type="password" id="login-pw" placeholder="비밀번호" value="1234">
            <button onclick="login()">접속하기</button>
            <div style="font-size:0.75rem; color:#888; margin-top:10px; text-decoration:underline; cursor:pointer;" onclick="importData()">다른 기기에서 데이터 불러오기(코드 입력)</div>
        </div>
    </div>

    <header>
        <div class="guild-title">길드 : 칠흑의 까마귀</div>
        <div class="guild-stats">
            <div class="time-wrapper">
                <div class="time-header">
                    <div class="time-text" id="ui-time">DAY 1 [ 08:00 ]</div>
                    <!-- ⏩ 배속 기능 -->
                    <button class="btn-speed" id="btn-speed" onclick="toggleSpeed()">▶ 1x</button>
                </div>
                <div class="time-bg"><div class="time-fill" id="ui-time-bar"></div></div>
            </div>
            <div class="capacity-text">👥 인원: <span id="ui-cap">0 / 5</span></div>
            <div class="money-text">자금 🪙 <span id="ui-money">500</span> G</div>
            <button class="btn-save" onclick="exportData()">💾 클라우드 연동</button>
        </div>
    </header>

    <main>
        <div id="floor-container">
            <div class="facility-area" style="top:15%; left:50%; transform:translateX(-50%); border-color:#f1c40f; color:#fdf5e6;">📜 의뢰 게시판</div>
            <div class="facility-area" style="bottom:10%; left:10%; border-color:#e67e22; color:#fdf5e6;">🍺 길드 주점</div>
            <div class="facility-area" style="top:15%; left:10%; border-color:#3498db; color:#fdf5e6;">🛏️ 길드 여관</div>
            <div class="facility-area" style="bottom:10%; right:10%; border-color:#e74c3c; color:#fdf5e6;">🎯 훈련장</div>
            <div class="facility-area" style="top:35%; right:10%; border-color:#9b59b6; color:#fdf5e6;">🛒 장비 상점</div>
        </div>

        <aside class="sidebar">
            <div class="side-panel">
                <div class="side-header">📜 진행 및 대기 의뢰 (수수료 20%)</div>
                <div class="side-content" id="quest-list"></div>
            </div>
            <div class="side-panel">
                <div class="side-header">🛡️ 머무는 프리랜서 명부</div>
                <div class="side-content" id="roster-list"></div>
                <button class="upgrade-btn" id="btn-upgrade" onclick="upgradeGuild()">길드 증축 (인원 +2) : 1000G</button>
            </div>
        </aside>
    </main>

    <div id="log-container"><span id="log-text"></span></div>

    <script>
        // ==========================================

        const CLASS_DB = {

            "W_1": { tier: 1, name: "검사", color: "#c0392b", nextJobs: ["W_2A", "W_2B"], req: 5, cost: 500 },

        const BASE_CLASSES = ["W_0", "A_0", "R_0", "M_0", "C_0"];
        const NAMES = ["아서", "렌", "엘리스", "바츠", "카일", "루시", "테오", "세리아", "카론", "제이드", "로웬", "미아"];

        const EQUIP_SHOP = [
            { name: "강철 장비", cost: 300, powerUp: 20 },
            { name: "미스릴 무기", cost: 1000, powerUp: 50 },
            { name: "전설의 장비", cost: 4000, powerUp: 150 }
        ];

        const FACILITIES = {
            drink: { name: "주점", cost: 30, duration: 60, stam: 40, x: 10, y: 90 },
            sleep: { name: "여관", cost: 100, duration: 480, stam: 100, x: 10, y: 15 },

        // ⏱️ 상태 변수
        let guild = { timeMin: 480, money: 500, capacity: 5, upgradeCost: 1000, roster: [], quests: [] };
        let gameSpeed = 1; // 배속 변수
        let currentUserId = "guildMaster"; // 현재 로그인 ID

        function getDay() { return Math.floor(guild.timeMin / 1440) + 1; }
        function getHour() { return Math.floor(guild.timeMin / 60) % 24; }
        function getMin() { return Math.floor(guild.timeMin % 60); }

        class Mercenary {
            constructor() {
                this.id = 'M_' + Date.now() + Math.floor(Math.random() * 1000);
                this.name = NAMES[Math.floor(Math.random() * NAMES.length)];
                this.baseJobId = BASE_CLASSES[Math.floor(Math.random() * BASE_CLASSES.length)];
                this.jobId = this.baseJobId; 
                let imgList = IMAGE_DB[this.baseJobId];
                this.portraitUrl = imgList[Math.floor(Math.random() * imgList.length)];
                
                this.level = 1; this.exp = 0; this.equipTier = 0;
                this.basePower = 15 + Math.floor(Math.random() * 10);
                this.money = 150 + Math.floor(Math.random() * 50); 
                
                this.stamina = 100; this.status = 'idle'; 
                this.targetMin = 0; this.currentAction = null; 
                this.thought = "대기 중..."; this.showBubble = false; this.bubbleEnd = 0;
                
                this.tx = 50; this.ty = 85; this.targetX = 50; this.targetY = 50;
            }

            get job() { return CLASS_DB[this.jobId]; }
            get power() { return Math.floor(this.basePower * (1 + this.level * 0.15) * (this.job.tier + 1)); }

            setThought(text, durationGameMins = 30) {
                this.thought = text; this.showBubble = true;
                this.bubbleEnd = guild.timeMin + durationGameMins;
            }

            think() {
                if(this.status !== 'idle') return;
                
                if(Math.random() < 0.1) { this.targetX = 20 + Math.random()*60; this.targetY = 30 + Math.random()*50; }
                if(Math.random() > 0.3) return;

                if(this.job.nextJobs && this.job.nextJobs.length > 0) {
                    let nextJobId = this.job.nextJobs[Math.floor(Math.random() * this.job.nextJobs.length)];
                    let nextJob = CLASS_DB[nextJobId];
                    if(this.level >= nextJob.req && this.money >= nextJob.cost) {
                        this.money -= nextJob.cost; guild.money += nextJob.cost; 
                        this.jobId = nextJobId;
                        this.setThought(`✨ [${nextJob.name}] 전직!`, 60);
                        showLog(`📜 ${this.name} 전직 완료! (심사 수입: +${nextJob.cost}G)`);
                        return;
                    }
                }

                if(this.equipTier < EQUIP_SHOP.length) {
                    let eq = EQUIP_SHOP[this.equipTier];
                    if(this.money >= eq.cost + 50) { 
                        this.money -= eq.cost; guild.money += eq.cost;
                        this.equipTier++; this.basePower += eq.powerUp;
                        this.targetX = FACILITIES.shop.x; this.targetY = FACILITIES.shop.y;
                        this.setThought(`🛒 ${eq.name} 구매!`, 60);
                        showLog(`⚔️ ${this.name} 장비 구매! (상점 수입: +${eq.cost}G)`);
                        return;
                    }
                }

                if(this.stamina < 30) {
                    if(this.money >= FACILITIES.sleep.cost) return this.useFacility('sleep');
                    if(this.money >= FACILITIES.drink.cost) return this.useFacility('drink');
                    return this.setThought("돈이 없어서 못 쉬어...", 40);
                }
                if(this.stamina > 80 && this.money >= FACILITIES.train.cost + 100 && Math.random() < 0.3) return this.useFacility('train');

                if(this.stamina >= 20) {
                    let avail = guild.quests.filter(q => !q.assignedMercId).sort((a,b) => b.reward - a.reward);
                    if(avail.length > 0) {
                        this.targetX = FACILITIES.board.x; this.targetY = FACILITIES.board.y + 10;
                        for(let q of avail) {
                            if(this.stamina >= q.reqStamina && Math.floor((this.power / q.reqPower) * 70) >= 30) { 
                                this.stamina -= q.reqStamina; this.status = 'questing';
                                q.assignedMercId = this.id; q.targetMin = guild.timeMin + q.durationMin;
                                this.targetMin = q.targetMin;
                                return this.setThought(`[${q.title}] 접수완료!`, 60);
                            }
                        }
                    } else if(Math.random() < 0.1) this.setThought("의뢰가 없군...", 30);
                }
            }

            useFacility(type) {
                let fac = FACILITIES[type];
                this.money -= fac.cost; guild.money += fac.cost; 
                this.status = type === 'train' ? 'training' : 'resting';
                this.currentAction = type; this.targetMin = guild.timeMin + fac.duration;
                this.setThought(`[${fac.name}] 이용 중`, fac.duration);
                this.targetX = fac.x + (Math.random()*10 - 5); this.targetY = fac.y + (Math.random()*10 - 5);
            }
        }

        class Quest {
            constructor() {
                this.id = 'Q_' + Date.now() + Math.floor(Math.random()*100);
                this.title = ["고블린 토벌", "마차 호위", "도적단 추적", "묘지 정화", "드래곤 수색", "약초 채집"][Math.floor(Math.random()*6)];
                this.durationMin = (2 + Math.floor(Math.random() * 6)) * 60; 
                this.reqPower = Math.floor((15 + getDay() * 2) * (0.6 + Math.random() * 0.8));
                this.reqStamina = 20 + Math.floor(Math.random() * 20); 
                this.reward = this.reqPower * (4 + Math.floor(Math.random() * 4)); 
                this.assignedMercId = null; this.targetMin = 0;
            }
        }

        // ==========================================
        // 💾 로그인 및 클라우드 연동 (Save/Load)
        // ==========================================
        function login() {
            let id = document.getElementById('login-id').value;
            let pw = document.getElementById('login-pw').value;
            if(id === "" || pw === "") return alert("아이디와 비밀번호를 입력해주세요.");
            
            currentUserId = id;
            let saveKey = "guildSave_" + id;
            let savedData = localStorage.getItem(saveKey);
            
            if(savedData) {
                restoreData(JSON.parse(savedData));
                showLog(`✅ 기존 데이터를 불러왔습니다. 환영합니다, ${id}님!`);
            } else {
                // 새 게임 초기화
                guild = { timeMin: 480, money: 500, capacity: 5, upgradeCost: 1000, roster: [], quests: [] };
                for(let i=0;i<3;i++) { guild.roster.push(new Mercenary()); guild.quests.push(new Quest()); }
                showLog(`👋 새로운 길드를 설립했습니다. 환영합니다, ${id}님!`);
            }
            document.getElementById('login-screen').style.display = 'none';
            updateUI();
        }

        function saveGameLocally() {
            if(!currentUserId) return;
            localStorage.setItem("guildSave_" + currentUserId, JSON.stringify(guild));
        }

        function exportData() {
            let code = btoa(encodeURIComponent(JSON.stringify(guild))); // Base64 인코딩
            let output = prompt("아래 문자열을 복사하여 다른 기기에서 불러오기 하세요.\n(PC ↔ 모바일 간 이동 시 유용합니다.)", code);
        }

        function importData() {
            let code = prompt("다른 기기에서 복사한 세이브 코드를 붙여넣어주세요.");
            if(!code) return;
            try {
                let parsed = JSON.parse(decodeURIComponent(atob(code)));
                restoreData(parsed);
                document.getElementById('login-screen').style.display = 'none';
                showLog("✅ 클라우드 데이터를 성공적으로 불러왔습니다!");
                updateUI();
            } catch (e) {
                alert("잘못된 세이브 코드입니다.");
            }
        }

        function restoreData(data) {
            guild = data;
            // 인스턴스(클래스 프로토타입) 복구
            guild.roster = guild.roster.map(m => Object.assign(new Mercenary(), m));
            guild.quests = guild.quests.map(q => Object.assign(new Quest(), q));
        }

        // ⏩ 배속 기능
        function toggleSpeed() {
            if(gameSpeed === 1) gameSpeed = 2;
            else if(gameSpeed === 2) gameSpeed = 5;
            else if(gameSpeed === 5) gameSpeed = 10;
            else gameSpeed = 1;
            document.getElementById('btn-speed').innerText = `▶ ${gameSpeed}x`;
        }

        // ==========================================
        // 3. UI 렌더링
        // ==========================================
        function updateUI() {
            let h = getHour().toString().padStart(2, '0'), m = getMin().toString().padStart(2, '0');
            document.getElementById('ui-time').innerText = `DAY ${getDay()} [ ${h}:${m} ]`;
            document.getElementById('ui-time-bar').style.width = `${((getHour() + getMin() / 60) / 24) * 100}%`;
            document.getElementById('ui-money').innerText = Math.floor(guild.money).toLocaleString();
            document.getElementById('ui-cap').innerText = `${guild.roster.length} / ${guild.capacity}`;
            
            let btn = document.getElementById('btn-upgrade');
            btn.innerText = `길드 증축 (인원 +2) : ${guild.upgradeCost}G`;
            btn.disabled = guild.money < guild.upgradeCost;

            document.getElementById('quest-list').innerHTML = guild.quests.map(q => {
                let status = "", ratio = 0;
                if(q.assignedMercId) {
                    let m = guild.roster.find(m => m.id === q.assignedMercId);
                    ratio = Math.max(0, (q.targetMin - guild.timeMin) / q.durationMin);
                    status = `<div style="font-size:0.75rem; color:#e74c3c;">[진행 중] ${m ? m.name : '?'}</div><div class="prog-bg-side"><div class="prog-fill-side" style="width:${(1 - ratio)*100}%"></div></div>`;
                } else status = `<div style="font-size:0.75rem; color:#2ecc71;">[모집 중] ${Math.floor(q.durationMin/60)}시간</div>`;
                return `<div class="list-item"><div class="list-title"><span>${q.title}</span><span style="color:var(--gold)">🪙${q.reward}G</span></div><div class="list-desc"><span>⚔️${q.reqPower} | ⚡${q.reqStamina}</span></div>${status}</div>`;
            }).join('');

            document.getElementById('roster-list').innerHTML = guild.roster.map(merc => {
                let statusStr = merc.status === 'idle' ? '대기중' : (merc.status === 'questing' ? '임무중' : '시설이용');
                let ext = "";
                if(merc.status === 'resting' || merc.status === 'training') {
                    let fac = FACILITIES[merc.currentAction];
                    let ratio = Math.max(0, (merc.targetMin - guild.timeMin) / fac.duration);
                    ext = `<div class="prog-bg-side"><div class="prog-fill-side" style="background:#3498db; width:${(1 - ratio)*100}%"></div></div>`;
                }
                
                let emblem = `<div class="merc-emblem" style="width: 40px; height: 40px; border-width: 2px; border-color:${merc.job.color}; flex-shrink:0;"><img src="${merc.portraitUrl}" alt="img"></div>`;
                
                return `<div class="list-item" style="border-left: 3px solid ${merc.job.color}">
                    <div class="side-merc-info">${emblem}<div style="flex:1;">
                    <div class="list-title"><span>${merc.name} <span style="font-size:0.7rem; color:#888;">Lv.${merc.level}</span></span><span style="font-size:0.8rem; color:#ccc;">${statusStr}</span></div>
                    <div class="list-desc" style="margin-top:2px;"><span>⚔️${merc.power} | ⚡${merc.stamina}</span><span style="color:var(--gold)">🪙${merc.money}G</span></div>
                    </div></div>${ext}</div>`;
            }).join('');
        }

        function renderFloor() {
            const container = document.getElementById('floor-container');
            guild.roster.forEach(merc => {
                if(merc.showBubble && guild.timeMin >= merc.bubbleEnd) merc.showBubble = false;
                
                let el = document.getElementById('sprite-' + merc.id);
                if(merc.status === 'questing') { if(el) el.style.display = 'none'; return; }
                
                if(!el) {
                    el = document.createElement('div'); el.id = 'sprite-' + merc.id; el.className = 'merc-sprite';
                    el.innerHTML = `
                        <div class="floor-bubble" id="bubble-${merc.id}"></div>
                        <div class="merc-emblem" style="border-color: ${merc.job.color}">
                            <img src="${merc.portraitUrl}" alt="img">
                        </div>
                        <div class="nameplate"><span class="name-text" style="color:${merc.job.color}">${merc.name}</span>
                        <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-${merc.id}"></div></div></div>`;
                    container.appendChild(el);
                } else el.style.display = 'flex';
                
                let spd = 0.1 * gameSpeed; // 배속에 맞춰 이동속도도 빠르게 보정
                merc.tx += (merc.targetX - merc.tx) * Math.min(1, spd); 
                merc.ty += (merc.targetY - merc.ty) * Math.min(1, spd);
                el.style.left = merc.tx + '%'; el.style.top = merc.ty + '%';
                
                document.getElementById('hp-' + merc.id).style.width = `${(merc.stamina / 100)*100}%`;
                let bubble = document.getElementById('bubble-' + merc.id);
                if(merc.showBubble) { bubble.innerText = merc.thought; bubble.classList.add('show'); } 
                else bubble.classList.remove('show');
            });
        }

        function showLog(msg) {
            const logBox = document.getElementById('log-container');
            document.getElementById('log-text').innerHTML = msg;
            logBox.style.display = 'block'; setTimeout(() => logBox.style.display = 'none', 3000);
        }

        function upgradeGuild() {
            if(guild.money >= guild.upgradeCost) {
                guild.money -= guild.upgradeCost; guild.capacity += 2; guild.upgradeCost = Math.floor(guild.upgradeCost * 1.5);
                showLog(`🏰 길드 증축! 최대 인원이 ${guild.capacity}명으로 증가.`); updateUI();
            }
        }

        // ==========================================
        // 4. 메인 루프 (배속 적용)
        // ==========================================
        let frame = 0;
        setInterval(() => {
            frame++; renderFloor();
            
            let prevHour = getHour();
            // ⏩ 1프레임당 0.24분 * 배속(gameSpeed)
            guild.timeMin += (0.24 * gameSpeed); 
            let currHour = getHour();

            if(currHour !== prevHour) {
                saveGameLocally(); // 💾 매 시간 자동 저장

                if (currHour === 0) {
                    let cost = guild.roster.length * 50; guild.money -= cost;
                    showLog(`🌙 자정 일일 유지비 -${cost}G 납부`);
                }
                if (currHour === 8 && guild.roster.length < guild.capacity && Math.random() < 0.8) {
                    guild.roster.push(new Mercenary()); showLog(`🚪 새로운 프리랜서 용병이 길드에 합류했습니다.`);
                }
                guild.roster.forEach(m => { if(m.status === 'idle') m.stamina = Math.min(100, m.stamina + 5); });
            }

            if(frame % Math.max(2, Math.floor(20 / gameSpeed)) === 0) {
                guild.roster.forEach(m => m.think());
            }

            if(Math.random() < (0.005 * gameSpeed) && guild.quests.length < 5) guild.quests.push(new Quest());

            guild.roster.forEach(merc => {
                if(merc.status === 'resting' || merc.status === 'training') {
                    if(guild.timeMin >= merc.targetMin) {
                        if(merc.currentAction === 'train') { merc.basePower += FACILITIES.train.pwr; merc.setThought("수련 성과가 확실해!", 60); } 
                        else { merc.stamina = Math.min(100, merc.stamina + FACILITIES[merc.currentAction].stam); merc.setThought("몸이 가볍군.", 60); }
                        merc.status = 'idle'; merc.currentAction = null;
                    }
                }
            });

            guild.quests.forEach((q, idx) => {
                if (q.assignedMercId && guild.timeMin >= q.targetMin) {
                    let merc = guild.roster.find(m => m.id === q.assignedMercId);
                    if(merc) {
                        merc.status = 'idle'; merc.targetX = 50; merc.targetY = 85; 
                        let win = Math.min(95, Math.max(10, Math.floor((merc.power / q.reqPower) * 70))); 
                        if(Math.random() * 100 <= win) {
                            let gCut = Math.floor(q.reward * 0.2); 
                            guild.money += gCut; merc.money += (q.reward - gCut); merc.exp += q.reqPower * 2;
                            merc.setThought(`의뢰 성공! 돈 벌었다.`, 120);
                            showLog(`📜 ${merc.name} 의뢰 성공! (길드 수수료: +${gCut} G)`);
                            if(merc.exp >= merc.level * 100) { merc.exp -= merc.level*100; merc.level++; }
                        } else {
                            merc.exp += q.reqPower; merc.setThought("실패다... 아파...", 120);
                        }
                    }
                    guild.quests.splice(idx, 1);
                }
            });

            if(frame % 10 === 0) updateUI();
        }, 100);

    </script>
</body>

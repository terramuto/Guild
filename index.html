<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중세 용병 길드 타이쿤</title>
    <!-- 중세 판타지 느낌을 살리기 위한 세리프 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 중세 양피지와 나무 질감 컬러 팔레트 */
            --bg-wood: #2e1d15;
            --bg-wood-dark: #1c100b;
            --parchment: #f4e8d3;
            --parchment-dark: #e6d3b3;
            --border-gold: #c5a059;
            --border-dark: #5c3a21;
            --text-main: #3e2723;
            --text-light: #5d4037;
            --gold: #b8860b;
            --red-fail: #900c3f;
            --green-success: #1e8449;
            --btn-base: #4a2e1b;
            --btn-hover: #6e462a;
            
            --font-title: 'Cinzel', serif;
            --font-main: 'Noto Serif KR', serif;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-wood), var(--bg-wood-dark));
            color: var(--text-main);
            font-family: var(--font-main);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
            background-attachment: fixed;
        }

        /* 🏰 길드 헤더 (명판 스타일) */
        header {
            background: linear-gradient(135deg, #1f1209, #3a2416);
            padding: 15px 40px;
            border-radius: 4px;
            border: 3px solid var(--border-gold);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
            color: #fff;
        }

        .guild-title { font-family: var(--font-title); font-size: 1.6rem; color: var(--border-gold); text-shadow: 2px 2px 4px #000; letter-spacing: 2px; }
        .guild-stats { display: flex; gap: 40px; font-size: 1.2rem; font-weight: 700; font-family: var(--font-title); text-shadow: 1px 1px 2px #000;}
        
        main { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 20px; flex: 1; overflow: hidden; }

        /* 📜 양피지 패널 */
        .panel { 
            background: var(--parchment); 
            border: 4px solid var(--border-dark); 
            border-radius: 8px; 
            display: flex; flex-direction: column; 
            box-shadow: 5px 5px 15px rgba(0,0,0,0.7), inset 0 0 20px rgba(139, 69, 19, 0.1);
            position: relative;
        }
        
        .panel-header { 
            background: var(--border-dark); color: #f4e8d3; 
            padding: 12px; font-weight: 900; font-size: 1.1rem; 
            border-bottom: 3px solid #3a1f0f; display: flex; justify-content: space-between; align-items: center;
            font-family: var(--font-title); letter-spacing: 1px; text-shadow: 1px 1px 2px #000;
        }
        
        .panel-content { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px; }

        /* 🏷️ 의뢰서/계약서 형태의 카드 */
        .card { 
            background: var(--parchment-dark); 
            border: 2px solid #a68b6c; 
            border-radius: 4px; padding: 12px; 
            display: flex; flex-direction: column; gap: 10px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            position: relative;
        }
        
        /* 🖼️ 중세 일러스트 초상화 */
        .card-info-wrapper { display: flex; gap: 12px; align-items: center; }
        .portrait-box { 
            width: 60px; height: 60px; background: #e0d0b0; 
            border: 3px solid var(--border-dark); border-radius: 50%; /* 둥근 뱃지 형태 */
            overflow: hidden; flex-shrink: 0;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.4);
        }
        /* 픽셀 렌더링 제거, 부드러운 일러스트 출력 */
        .portrait-box img { width: 110%; height: 110%; object-fit: cover; margin-left: -5%; margin-top: -5%; } 
        
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; border-bottom: 1px solid #c9b18c; padding-bottom: 4px;}
        .merc-name { font-weight: 900; font-size: 1.15rem; color: #2e1b0f; }
        .merc-class { font-size: 0.75rem; padding: 4px 8px; border-radius: 3px; font-weight: bold; color: #fff; box-shadow: 1px 1px 2px rgba(0,0,0,0.5);}
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; font-size: 0.9rem; color: var(--text-light); row-gap: 6px; font-weight: 700; }
        .stat-highlight { color: #8a2be2; }
        
        /* 🪓 나무/금속 질감 버튼 */
        button { 
            background: linear-gradient(to bottom, #5c3a21, #3a1f0f); 
            color: #f4e8d3; border: 2px solid #1a0b05; padding: 8px 12px; border-radius: 3px; 
            font-weight: 700; cursor: pointer; transition: 0.2s; font-family: var(--font-main);
            box-shadow: 0 4px 0 #1a0b05, 0 5px 5px rgba(0,0,0,0.5); text-shadow: 1px 1px 2px #000;
        }
        button:hover:not(:disabled) { background: linear-gradient(to bottom, #6e462a, #4a2e1b); transform: translateY(2px); box-shadow: 0 2px 0 #1a0b05, 0 3px 3px rgba(0,0,0,0.5); }
        button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 #1a0b05; }
        button:disabled { background: #887a6c; color: #b3aba0; box-shadow: 0 2px 0 #4a423a; cursor: not-allowed; border-color: #4a423a; transform: translateY(2px);}
        
        button.action-promote { background: linear-gradient(to bottom, #5b2c6f, #4a235a); border-color: #1a0b1c; box-shadow: 0 4px 0 #1a0b1c; }
        button.action-dispatch { background: linear-gradient(to bottom, #b9770e, #935116); border-color: #4a2205; box-shadow: 0 4px 0 #4a2205; }
        
        .progress-bg { background: #3e2723; height: 10px; border-radius: 5px; border: 1px solid #1a0b05; overflow: hidden; margin-top: 8px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);}
        .progress-fill { background: linear-gradient(90deg, #d35400, #f1c40f); height: 100%; width: 0%; transition: width 0.3s; }

        /* 📜 고급스러운 알림 로그 */
        #log-container { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: linear-gradient(to bottom, rgba(46, 29, 21, 0.95), rgba(28, 16, 11, 0.95)); 
            padding: 15px 30px; border-radius: 4px; border: 2px solid var(--border-gold); 
            display: none; z-index: 100; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }
        #log-text { color: #f4e8d3; font-weight: 700; font-size: 1.1rem; text-shadow: 1px 1px 3px #000; }

        select { padding: 6px; background: #e6d3b3; color: #3e2723; border: 2px solid #8b5a2b; border-radius: 3px; font-family: inherit; font-weight: bold; outline: none; }
        
        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--parchment); border-left: 1px solid var(--border-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="guild-title">⚔️ 픽셀 용병 길드</div>
        <div class="guild-stats">
            <div>DAY <span id="ui-day">1</span></div>
            <div style="color:var(--border-gold);">🪙 <span id="ui-money">2,000</span> G</div>
        </div>
    </header>

    <main>
        <!-- 1. 주점 -->
        <section class="panel">
            <div class="panel-header" style="justify-content: center;">🍺 낡은 선술집 (고용)</div>
            <div class="panel-content" id="tavern-list"></div>
        </section>

        <!-- 2. 로스터 -->
        <section class="panel" style="border-color: #2c3e50;">
            <div class="panel-header" style="background: #1a252f; border-color:#0f171e; justify-content: center;">🛡️ 길드 소속 명부</div>
            <div class="panel-content" id="roster-list"></div>
        </section>

        <!-- 3. 의뢰 게시판 -->
        <section class="panel" style="border-color: #78281f;">
            <div class="panel-header" style="background: #4a1111; border-color:#2c0808;">
                <span>📜 의뢰 게시판</span>
                <button id="btn-auto-dispatch" onclick="toggleAutoDispatch()" style="font-size:0.75rem; padding:4px 8px; background: #555; box-shadow: 0 3px 0 #222;">자동 파견 끄기</button>
            </div>
            <div class="panel-content" id="quest-list"></div>
        </section>
    </main>

    <!-- 알림 로그창 -->
    <div id="log-container"><span id="log-text"></span></div>

    <script>
        const CLASS_DB = {
            "W_0": { tier: 0, name: "초보 전사", color: "#c0392b", nextJobs: ["W_1"], reqLevel: 0, cost: 0 },
            "W_1": { tier: 1, name: "검사", color: "#e74c3c", nextJobs: ["W_2A", "W_2B"], reqLevel: 5, cost: 500 },
            "W_2A": { tier: 2, name: "기사", color: "#922b21", nextJobs: ["W_3A1", "W_3A2"], reqLevel: 15, cost: 2000 },
            "W_2B": { tier: 2, name: "광전사", color: "#7b241c", nextJobs: ["W_3B1", "W_3B2"], reqLevel: 15, cost: 2000 },
            "W_3A1": { tier: 3, name: "성기사", color: "#f1c40f", nextJobs: [], reqLevel: 30, cost: 10000 },
            "W_3A2": { tier: 3, name: "다크나이트", color: "#4a235a", nextJobs: [], reqLevel: 30, cost: 10000 },
            "W_3B1": { tier: 3, name: "워로드", color: "#641e16", nextJobs: [], reqLevel: 30, cost: 10000 },
            "W_3B2": { tier: 3, name: "블러드마스터", color: "#a93226", nextJobs: [], reqLevel: 30, cost: 10000 },

            "A_0": { tier: 0, name: "초보 궁수", color: "#27ae60", nextJobs: ["A_1"], reqLevel: 0, cost: 0 },
            "A_1": { tier: 1, name: "헌터", color: "#2ecc71", nextJobs: ["A_2A", "A_2B"], reqLevel: 5, cost: 500 },
            "A_2A": { tier: 2, name: "스나이퍼", color: "#1e8449", nextJobs: ["A_3A1"], reqLevel: 15, cost: 2000 }, 
            "A_2B": { tier: 2, name: "트래퍼", color: "#145a32", nextJobs: ["A_3B1"], reqLevel: 15, cost: 2000 },
            "A_3A1": { tier: 3, name: "보우마스터", color: "#117a65", nextJobs: [], reqLevel: 30, cost: 10000 },
            "A_3B1": { tier: 3, name: "생존전문가", color: "#0b5345", nextJobs: [], reqLevel: 30, cost: 10000 },

            "R_0": { tier: 0, name: "초보 도적", color: "#7f8c8d", nextJobs: ["R_1"], reqLevel: 0, cost: 0 },
            "R_1": { tier: 1, name: "암살자", color: "#95a5a6", nextJobs: ["R_2A", "R_2B"], reqLevel: 5, cost: 500 },
            "R_2A": { tier: 2, name: "섀도우", color: "#34495e", nextJobs: ["R_3A1"], reqLevel: 15, cost: 2000 },
            "R_2B": { tier: 2, name: "시프마스터", color: "#2c3e50", nextJobs: ["R_3B1"], reqLevel: 15, cost: 2000 },
            "R_3A1": { tier: 3, name: "나이트로드", color: "#1a252f", nextJobs: [], reqLevel: 30, cost: 10000 },
            "R_3B1": { tier: 3, name: "팬텀", color: "#5d6d7e", nextJobs: [], reqLevel: 30, cost: 10000 },

            "M_0": { tier: 0, name: "초보 마법사", color: "#8e44ad", nextJobs: ["M_1"], reqLevel: 0, cost: 0 },
            "M_1": { tier: 1, name: "워록", color: "#9b59b6", nextJobs: ["M_2A", "M_2B"], reqLevel: 5, cost: 500 },
            "M_2A": { tier: 2, name: "아크메이지", color: "#5b2c6f", nextJobs: ["M_3A1"], reqLevel: 15, cost: 2000 },
            "M_2B": { tier: 2, name: "서머너", color: "#4a235a", nextJobs: ["M_3B1"], reqLevel: 15, cost: 2000 },
            "M_3A1": { tier: 3, name: "엘리멘탈마스터", color: "#154360", nextJobs: [], reqLevel: 30, cost: 10000 },
            "M_3B1": { tier: 3, name: "일루저니스트", color: "#1b4f72", nextJobs: [], reqLevel: 30, cost: 10000 },

            "C_0": { tier: 0, name: "초보 성직자", color: "#e67e22", nextJobs: ["C_1"], reqLevel: 0, cost: 0 },
            "C_1": { tier: 1, name: "프리스트", color: "#d35400", nextJobs: ["C_2A", "C_2B"], reqLevel: 5, cost: 500 },
            "C_2A": { tier: 2, name: "비숍", color: "#a04000", nextJobs: ["C_3A1"], reqLevel: 15, cost: 2000 },
            "C_2B": { tier: 2, name: "이단심문관", color: "#873600", nextJobs: ["C_3B1"], reqLevel: 15, cost: 2000 },
            "C_3A1": { tier: 3, name: "세인트", color: "#6e2c00", nextJobs: [], reqLevel: 30, cost: 10000 },
            "C_3B1": { tier: 3, name: "팔라딘", color: "#784212", nextJobs: [], reqLevel: 30, cost: 10000 },
        };

        const BASE_CLASSES = ["W_0", "A_0", "R_0", "M_0", "C_0"];
        const NAMES = ["아서", "렌", "엘리스", "바츠", "카일", "루시", "테오", "세리아", "카론", "제이드", "로웬", "미아"];

        let guild = {
            day: 1,
            money: 2000,
            autoDispatch: false,
            roster: [],
            tavern: [],
            quests: []
        };

        class Mercenary {
            constructor(id) {
                this.id = id || 'M_' + Date.now() + Math.floor(Math.random() * 10000);
                this.name = NAMES[Math.floor(Math.random() * NAMES.length)];
                this.jobId = BASE_CLASSES[Math.floor(Math.random() * BASE_CLASSES.length)];
                
                this.level = 1;
                this.exp = 0;
                this.basePower = 15 + Math.floor(Math.random() * 10);
                this.baseWage = 10 + Math.floor(Math.random() * 5); 
                
                this.status = 'idle'; 
                this.hireCost = 150 + Math.floor(Math.random() * 50);
            }

            get job() { return CLASS_DB[this.jobId]; }
            get maxExp() { return this.level * 100; }
            get power() { return Math.floor(this.basePower * (1 + this.level * 0.15) * (this.job.tier + 1)); }
            get currentWage() { return Math.floor(this.baseWage * Math.pow(1.2, this.level - 1) * Math.pow(2, this.job.tier)); }
            
            // 🎨 [변경됨] 중세 모험가 스타일 일러스트 API (DiceBear Adventurer)
            get portraitUrl() {
                return `https://api.dicebear.com/9.x/adventurer/svg?seed=${this.id}&backgroundColor=transparent`;
            }

            addExp(amount) {
                this.exp += amount;
                if (this.exp >= this.maxExp) {
                    this.exp -= this.maxExp;
                    this.level++;
                    showLog(`🎉 ${this.name} 레벨 업! (Lv.${this.level})`);
                }
            }

            promote() {
                let currentJob = this.job;
                if (currentJob.nextJobs.length === 0) return { success: false, msg: "최고 랭크입니다." };
                
                let targetJobIds = currentJob.nextJobs;
                let nextJobPreview = CLASS_DB[targetJobIds[0]];
                
                if (this.level < nextJobPreview.reqLevel) return { success: false, msg: `레벨 부족 (필요: Lv.${nextJobPreview.reqLevel})` };
                if (guild.money < nextJobPreview.cost) return { success: false, msg: `심사비 부족 (${nextJobPreview.cost}G)` };

                guild.money -= nextJobPreview.cost;
                let chosenJobId = targetJobIds[Math.floor(Math.random() * targetJobIds.length)];
                this.jobId = chosenJobId;

                return { 
                    success: true, 
                    msg: `📜 ${this.name}(은)는 맹세를 바치고...<br>✨ [${this.job.name}](으)로 전직했습니다!` 
                };
            }
        }

        class Quest {
            constructor() {
                this.id = 'Q_' + Date.now() + Math.floor(Math.random()*100);
                this.title = ["고블린 부락 토벌", "귀족 영애 호위", "도적단 추적", "저주받은 묘지 탐색", "드래곤 둥지 정찰"][Math.floor(Math.random()*5)];
                this.timeTotal = 6 + Math.floor(Math.random() * 10);
                this.timeLeft = this.timeTotal;
                
                // ⚠️ [추가됨] 퀘스트 권장 전투력 (날짜에 비례하여 점점 어려워짐)
                let baseReq = 15 + (guild.day * 1.5);
                this.reqPower = Math.floor(baseReq * (0.8 + Math.random() * 0.6));
                
                this.reward = this.reqPower * (2 + Math.floor(Math.random() * 3));
                this.expReward = this.reqPower * 2;
                this.assignedMercId = null;
            }
        }

        // ==========================================
        // 3. UI 렌더링 함수
        // ==========================================
        function updateHeader() {
            document.getElementById('ui-day').innerText = guild.day;
            document.getElementById('ui-money').innerText = guild.money.toLocaleString();
        }

        function renderTavern() {
            const container = document.getElementById('tavern-list');
            container.innerHTML = '';
            guild.tavern.forEach((merc, index) => {
                let div = document.createElement('div'); div.className = 'card';
                div.innerHTML = `
                    <div class="card-info-wrapper">
                        <div class="portrait-box"><img src="${merc.portraitUrl}"></div>
                        <div style="flex:1;">
                            <div class="card-top">
                                <span class="merc-name">${merc.name}</span>
                                <span class="merc-class" style="background:${merc.job.color}">${merc.job.name}</span>
                            </div>
                            <div class="stat-grid">
                                <span>기본 전투력: ⚔️${merc.power}</span>
                                <span>요구 주급: 🪙<span style="color:var(--text-main); font-weight:900;">${merc.currentWage}</span></span>
                            </div>
                        </div>
                    </div>
                    <button onclick="hireMerc(${index})" ${guild.money < merc.hireCost ? 'disabled' : ''}>
                        서명 및 고용 (-${merc.hireCost} G)
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function renderRoster() {
            const container = document.getElementById('roster-list');
            container.innerHTML = '';
            guild.roster.forEach((merc, index) => {
                let nextJobsStr = merc.job.nextJobs.length > 0 ? `(Lv.${CLASS_DB[merc.job.nextJobs[0]].reqLevel} 전직가능)` : "(마스터)";
                
                let div = document.createElement('div'); div.className = 'card';
                div.innerHTML = `
                    <div class="card-info-wrapper">
                        <div class="portrait-box"><img src="${merc.portraitUrl}"></div>
                        <div style="flex:1;">
                            <div class="card-top">
                                <span class="merc-name">${merc.name} <span style="font-size:0.85rem; color:var(--text-light);">Lv.${merc.level}</span></span>
                                <span class="merc-class" style="background:${merc.job.color}">${merc.job.name}</span>
                            </div>
                            <div class="stat-grid">
                                <span>전투력: ⚔️<span class="stat-highlight">${merc.power}</span></span>
                                <span>현재 주급: 🪙${merc.currentWage}</span>
                                <span>상태: ${merc.status === 'idle' ? '대기중' : '<span style="color:#d35400">임무중</span>'}</span>
                                <span style="font-size:0.75rem; color:#888;">${nextJobsStr}</span>
                            </div>
                        </div>
                    </div>
                    <div class="progress-bg"><div class="progress-fill" style="width: ${(merc.exp / merc.maxExp)*100}%; background: linear-gradient(90deg, #27ae60, #2ecc71);"></div></div>
                    <div style="display:flex; gap:5px;">
                        <button class="action-promote" style="flex:1;" onclick="promoteMerc(${index})" ${merc.status !== 'idle' ? 'disabled' : ''}>
                            승급 심사 (${merc.job.nextJobs.length > 0 ? CLASS_DB[merc.job.nextJobs[0]].cost + 'G' : '-'})
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderQuests() {
            const container = document.getElementById('quest-list');
            container.innerHTML = '';
            
            let idleMercs = guild.roster.filter(m => m.status === 'idle');
            // 드롭다운에 용병 전투력도 표시하여 비교하기 쉽게 함
            let optionsHTML = idleMercs.map(m => `<option value="${m.id}">${m.name} (전투력: ${m.power})</option>`).join('');

            let btnAuto = document.getElementById('btn-auto-dispatch');
            if(guild.autoDispatch) {
                btnAuto.innerText = "자동 파견 켜짐";
                btnAuto.style.background = "linear-gradient(to bottom, #1e8449, #145a32)";
                btnAuto.style.boxShadow = "0 3px 0 #0e3e23";
            } else {
                btnAuto.innerText = "자동 파견 꺼짐";
                btnAuto.style.background = "linear-gradient(to bottom, #7f8c8d, #555)";
                btnAuto.style.boxShadow = "0 3px 0 #222";
            }

            guild.quests.forEach((q, index) => {
                let div = document.createElement('div'); div.className = 'card';
                
                if (q.assignedMercId) {
                    let assignedMerc = guild.roster.find(m => m.id === q.assignedMercId);
                    div.innerHTML = `
                        <div class="card-top"><span class="merc-name">${q.title}</span></div>
                        <div class="card-info-wrapper" style="margin-top:5px;">
                            <div class="portrait-box" style="width:40px; height:40px;"><img src="${assignedMerc.portraitUrl}"></div>
                            <div class="stat-grid" style="flex:1;">
                                <span>파견: ${assignedMerc.name}</span>
                                <span>남은 시간: ⏳${q.timeLeft}초</span>
                            </div>
                        </div>
                        <div class="progress-bg"><div class="progress-fill" style="width: ${((q.timeTotal - q.timeLeft)/q.timeTotal)*100}%"></div></div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="card-top"><span class="merc-name">${q.title}</span></div>
                        <div class="stat-grid">
                            <span style="color:#c0392b;">권장 전투력: ⚔️${q.reqPower}</span>
                            <span>보상: 🪙<span style="color:#b8860b">${q.reward}</span></span>
                        </div>
                        <div style="display:flex; gap:5px; margin-top:5px;">
                            <select id="select-merc-${index}" style="flex:1;" ${guild.autoDispatch ? 'disabled' : ''}>
                                ${idleMercs.length > 0 ? optionsHTML : '<option disabled selected>대기중인 용병 없음</option>'}
                            </select>
                            <button class="action-dispatch" onclick="startQuest(${index})" ${(idleMercs.length === 0 || guild.autoDispatch) ? 'disabled' : ''}>
                                계약 체결
                            </button>
                        </div>
                    `;
                }
                container.appendChild(div);
            });
        }

        // ==========================================
        // 4. 게임 액션 로직
        // ==========================================
        function showLog(msg, isFail = false) {
            const logBox = document.getElementById('log-container');
            const logText = document.getElementById('log-text');
            logText.innerHTML = msg;
            
            if(isFail) {
                logBox.style.borderColor = "var(--red-fail)";
                logText.style.color = "#ffcccc";
            } else {
                logBox.style.borderColor = "var(--border-gold)";
                logText.style.color = "var(--parchment)";
            }
            
            logBox.style.display = 'block';
            setTimeout(() => { logBox.style.display = 'none'; }, 3000);
        }

        function refreshTavern() {
            guild.tavern = [new Mercenary(), new Mercenary(), new Mercenary()];
        }

        function refreshQuests() {
            guild.quests.push(new Quest());
            if(guild.quests.length > 4) guild.quests.shift();
        }

        function hireMerc(index) {
            let merc = guild.tavern[index];
            if (guild.money >= merc.hireCost) {
                guild.money -= merc.hireCost;
                guild.roster.push(merc);
                guild.tavern.splice(index, 1);
                showLog(`🤝 [${merc.job.name}] ${merc.name} 영입 완료!`);
                updateAll();
            }
        }

        function promoteMerc(index) {
            let merc = guild.roster[index];
            let result = merc.promote();
            if (result.success) {
                showLog(result.msg);
                updateAll();
            } else {
                alert(result.msg);
            }
        }

        function startQuest(qIndex) {
            if(guild.autoDispatch) return;
            let selectBox = document.getElementById(`select-merc-${qIndex}`);
            let mercId = selectBox.value;
            if(!mercId) return;

            let merc = guild.roster.find(m => m.id === mercId);
            let quest = guild.quests[qIndex];

            merc.status = 'questing';
            quest.assignedMercId = mercId;
            updateAll();
        }

        function toggleAutoDispatch() {
            guild.autoDispatch = !guild.autoDispatch;
            updateAll();
        }

        function updateAll() {
            updateHeader();
            renderTavern();
            renderRoster();
            renderQuests();
        }

        // ==========================================
        // 5. 게임 루프 (성공/실패 확률 로직 포함)
        // ==========================================
        setInterval(() => {
            let updated = false;

            // 자동 파견 (스마트 매칭: 성공률이 꽤 높은 애들 위주로 보내는 로직을 넣을 수도 있지만, 일단 순서대로 배정)
            if (guild.autoDispatch) {
                let idleMercs = guild.roster.filter(m => m.status === 'idle');
                let availableQuests = guild.quests.filter(q => !q.assignedMercId);
                
                // 전투력이 높은 용병이 어려운 퀘스트를 가도록 정렬
                idleMercs.sort((a, b) => b.power - a.power);
                availableQuests.sort((a, b) => b.reqPower - a.reqPower);

                while(idleMercs.length > 0 && availableQuests.length > 0) {
                    let merc = idleMercs.shift(); 
                    let quest = availableQuests.shift(); 
                    merc.status = 'questing';
                    quest.assignedMercId = merc.id;
                    updated = true;
                }
            }

            // 퀘스트 진행 및 결과(확률) 계산
            guild.quests.forEach((q, idx) => {
                if (q.assignedMercId) {
                    q.timeLeft--;
                    updated = true;
                    if (q.timeLeft <= 0) {
                        let merc = guild.roster.find(m => m.id === q.assignedMercId);
                        
                        if(merc) {
                            merc.status = 'idle';
                            
                            // 🎲 [핵심] 성공/실패 확률 계산 (최소 10% ~ 최대 95% 성공률 보장)
                            let winChance = Math.floor((merc.power / q.reqPower) * 70);
                            winChance = Math.min(95, Math.max(10, winChance)); 
                            
                            let roll = Math.random() * 100;

                            if(roll <= winChance) {
                                // ✅ 성공
                                guild.money += q.reward;
                                merc.addExp(q.expReward);
                                showLog(`💰 [성공] ${merc.name} 의뢰 완수! (+${q.reward} G)`);
                            } else {
                                // ❌ 실패 (돈 못벌고, 경험치는 절반만)
                                merc.addExp(Math.floor(q.expReward / 2));
                                showLog(`🩸 [실패] ${merc.name} 의뢰 실패... (위험에 빠져 도주함)`, true);
                            }
                        }
                        
                        guild.quests.splice(idx, 1);
                        refreshQuests();
                    }
                }
            });

            // 날짜 변경 및 주급 정산
            if(Math.random() < 0.1) {
                guild.day++;
                let totalWage = 0;
                guild.roster.forEach(m => totalWage += m.currentWage);
                guild.money -= totalWage;
                
                if (guild.day % 3 === 0) refreshTavern(); 
                updated = true;
            }

            if (updated) updateAll();
        }, 1000);

        refreshTavern();
        refreshQuests();
        refreshQuests();
        updateAll();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다크 판타지 용병 길드 (관찰형 타이쿤)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 제공해주신 이미지 기반 다크 판타지 컬러 */
            --bg-dark: #0a0a0c;
            --floor-base: #1a1a20;
            --floor-light: #25252d;
            --gold: #f1c40f;
            --text-light: #e0e0e0;
            --font-main: 'Noto Sans KR', sans-serif;
            --ui-bg: rgba(15, 15, 20, 0.85);
            --ui-border: #444455;
        }

        body {
            background-color: var(--bg-dark); color: var(--text-light); font-family: var(--font-main);
            margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            user-select: none;
        }

        /* 🏰 상단 정보창 (심플한 오버레이 형태) */
        header {
            position: absolute; top: 15px; left: 20px; right: 20px; z-index: 100;
            background: var(--ui-bg); padding: 15px 30px; border-radius: 8px; border: 1px solid var(--ui-border);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); backdrop-filter: blur(5px);
        }

        .guild-title { font-size: 1.4rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .guild-stats { display: flex; gap: 30px; align-items: center; font-weight: 700; font-size: 1.1rem;}
        
        .time-text { color: #aaa; font-weight: 900; }
        .money-text { color: var(--gold); font-size: 1.3rem; }
        .capacity-text { color: #3498db; }

        /* ================== 메인 화면: 다크 스톤 길드 바닥 ================== */
        main { position: relative; width: 100%; height: 100%; display: flex; }

        #floor-container {
            flex: 1; position: relative;
            /* 🪨 다크 판타지 던전 바닥 텍스처 느낌 */
            background: 
                linear-gradient(135deg, var(--floor-light) 25%, transparent 25%) -50px 0,
                linear-gradient(225deg, var(--floor-light) 25%, transparent 25%) -50px 0,
                linear-gradient(315deg, var(--floor-light) 25%, transparent 25%),
                linear-gradient(45deg, var(--floor-light) 25%, transparent 25%);
            background-size: 100px 100px; background-color: var(--floor-base);
            box-shadow: inset 0 0 150px rgba(0,0,0,0.95);
        }

        /* 📍 길드 내 시설 마커 */
        .facility-area {
            position: absolute; padding: 15px; border-radius: 8px; font-weight: 900; color: rgba(255,255,255,0.3);
            border: 2px dashed rgba(255,255,255,0.1); font-size: 1.2rem; pointer-events: none;
        }
        #area-board { top: 15%; left: 50%; transform: translateX(-50%); border-color: rgba(241, 196, 15, 0.2); color: rgba(241, 196, 15, 0.4);} /* 게시판 */
        #area-tavern { bottom: 10%; left: 10%; border-color: rgba(46, 204, 113, 0.2); color: rgba(46, 204, 113, 0.4);} /* 주점 */
        #area-inn { top: 15%; left: 10%; border-color: rgba(52, 152, 219, 0.2); color: rgba(52, 152, 219, 0.4);} /* 여관 */
        #area-train { bottom: 10%; right: 10%; border-color: rgba(231, 76, 60, 0.2); color: rgba(231, 76, 60, 0.4);} /* 훈련장 */

        /* ================== 🚶 2D 아바타 스프라이트 스타일 ================== */
        .merc-sprite {
            position: absolute; transform: translate(-50%, -100%);
            transition: top 1.5s linear, left 1.5s linear; /* 부드러운 이동 */
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            z-index: 10; width: 100px;
        }
        
        /* 💬 이미지와 똑같은 말풍선 */
        .floor-bubble {
            position: absolute; bottom: 85px; background: #fff; color: #333; font-size: 0.75rem; font-weight: 900; 
            padding: 6px 10px; border-radius: 6px; width: max-content; max-width: 160px; text-align: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.4); z-index: 20; opacity: 0; transition: opacity 0.3s;
        }
        .floor-bubble.show { opacity: 1; }
        .floor-bubble::after {
            content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
            border-width: 6px 6px 0; border-style: solid; border-color: #fff transparent transparent transparent;
        }

        /* 🖼️ 배경 박스 제거, 투명 이미지 그대로 노출 + 그림자 */
        .merc-sprite img {
            width: 70px; height: 70px; object-fit: contain;
            filter: drop-shadow(0px 10px 5px rgba(0,0,0,0.6));
        }

        /* 🏷️ 이름표 및 상태바 */
        .nameplate {
            background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px; border: 1px solid #444;
            display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: -5px; z-index: 15;
        }
        .name-text { font-size: 0.7rem; font-weight: 900; }
        .hp-bar-bg { width: 40px; height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
        .hp-bar-fill { height: 100%; background: #3498db; width: 100%; transition: width 0.3s;}

        /* ================== 우측: 정보 사이드바 ================== */
        .sidebar {
            width: 320px; background: var(--ui-bg); border-left: 1px solid var(--ui-border);
            display: flex; flex-direction: column; z-index: 50; padding-top: 90px;
        }
        
        .side-panel { display: flex; flex-direction: column; flex: 1; border-bottom: 1px solid #333;}
        .side-header { background: rgba(0,0,0,0.5); padding: 10px; text-align: center; font-weight: 900; font-size: 0.9rem; color: #aaa; letter-spacing: 1px;}
        .side-content { padding: 10px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }

        .list-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 4px; border: 1px solid #333; display: flex; flex-direction: column; gap: 5px; }
        .list-title { display: flex; justify-content: space-between; font-weight: 900; font-size: 0.9rem; color: #fff;}
        .list-desc { font-size: 0.75rem; color: #aaa; display: flex; justify-content: space-between;}
        
        button.upgrade-btn {
            background: linear-gradient(to bottom, #2980b9, #154360); border: 1px solid #111; color: #fff;
            padding: 10px; border-radius: 4px; font-weight: 900; cursor: pointer; transition: 0.2s; margin: 10px;
        }
        button.upgrade-btn:hover:not(:disabled) { background: linear-gradient(to bottom, #3498db, #1a5276); }
        button.upgrade-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

        #log-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); padding: 12px 25px; border-radius: 30px; border: 1px solid #555; display: none; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #log-text { color: #fff; font-weight: 700; font-size: 0.9rem; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
    </style>
</head>
<body>

    <header>
        <div class="guild-title">길드 : 칠흑의 까마귀</div>
        <div class="guild-stats">
            <div class="time-text" id="ui-time">DAY 1 [ 08:00 ]</div>
            <div class="capacity-text">👥 인원: <span id="ui-cap">0 / 5</span></div>
            <div class="money-text">자금 🪙 <span id="ui-money">500</span></div>
        </div>
    </header>

    <main>
        <!-- 👁️ 길드 내부 관찰 시점 -->
        <div id="floor-container">
            <div class="facility-area" id="area-board">📜 의뢰 게시판</div>
            <div class="facility-area" id="area-tavern">🍺 주점</div>
            <div class="facility-area" id="area-inn">🛏️ 여관</div>
            <div class="facility-area" id="area-train">🎯 훈련장</div>
            <!-- 용병 아바타 생성 영역 -->
        </div>

        <!-- 📌 우측 데이터 패널 -->
        <aside class="sidebar">
            <div class="side-panel">
                <div class="side-header">📜 접수된 의뢰 (길드 수수료 20%)</div>
                <div class="side-content" id="quest-list"></div>
            </div>
            <div class="side-panel">
                <div class="side-header">🛡️ 현재 머무는 용병 목록</div>
                <div class="side-content" id="roster-list"></div>
                <button class="upgrade-btn" id="btn-upgrade" onclick="upgradeGuild()">길드 증축 (최대 인원 +2) : 1000G</button>
            </div>
        </aside>
    </main>

    <div id="log-container"><span id="log-text"></span></div>

    <script>
        // ==========================================
        // 1. 기본 직업 및 시설 데이터
        // ==========================================
        const CLASS_DB = {
            "WARRIOR": { name: "전사", color: "#e74c3c" },
            "ARCHER": { name: "궁수", color: "#2ecc71" },
            "ROGUE": { name: "도적", color: "#95a5a6" },
            "MAGE": { name: "마법사", color: "#9b59b6" },
            "CLERIC": { name: "성직자", color: "#f1c40f" }
        };
        const BASE_CLASSES = Object.keys(CLASS_DB);
        const NAMES = ["아서", "렌", "엘리스", "바츠", "카일", "루시", "테오", "세리아", "카론", "제이드", "로웬", "미아"];

        const FACILITIES = {
            drink: { name: "주점", cost: 30, time: 3, stamRecover: 30, x: 10, y: 90 },
            sleep: { name: "여관", cost: 100, time: 8, stamRecover: 100, x: 10, y: 15 },
            train: { name: "훈련", cost: 250, time: 10, powerUp: 5, x: 90, y: 90 },
            board: { name: "게시판", x: 50, y: 15 }
        };

        // ==========================================
        // 2. 길드 상태 (플랫폼)
        // ==========================================
        let guild = { 
            day: 1, hour: 8, 
            money: 500,        // 초기 자금 (고용비가 아니라 시설 업그레이드용)
            capacity: 5,       // 길드가 수용 가능한 최대 용병 수
            upgradeCost: 1000,
            roster: [],        // 머무는 용병들
            quests: []         // 길드에 들어온 의뢰들
        };

        // ==========================================
        // 3. 용병 AI 에이전트
        // ==========================================
        class Mercenary {
            constructor() {
                this.id = 'M_' + Date.now() + Math.floor(Math.random() * 10000);
                this.name = NAMES[Math.floor(Math.random() * NAMES.length)];
                this.jobId = BASE_CLASSES[Math.floor(Math.random() * BASE_CLASSES.length)];
                
                this.level = 1; this.exp = 0;
                this.power = 15 + Math.floor(Math.random() * 10);
                
                // 💰 프리랜서의 개인 자산
                this.money = 50 + Math.floor(Math.random() * 50); 
                
                this.stamina = 100; this.maxStamina = 100;
                this.status = 'idle'; // idle, questing, resting, training
                this.actionTimeLeft = 0;
                this.thought = "의뢰를 찾아볼까..."; 
                this.showBubble = false;
                this.bubbleTimer = 0;
                
                // 🚶 길드 입장 시 초기 위치 (문 앞쪽 중앙)
                this.tx = 50; this.ty = 90; 
                this.targetX = 50; this.targetY = 50;
            }

            get job() { return CLASS_DB[this.jobId]; }
            get portraitUrl() { return `https://api.dicebear.com/9.x/adventurer/svg?seed=${this.id}&backgroundColor=transparent`; }

            setThought(text, duration = 3) {
                this.thought = text;
                this.showBubble = true;
                this.bubbleTimer = duration; // 지속시간(초)
            }

            // 🧠 용병 자율 행동 AI
            think() {
                // 말풍선 타이머 처리
                if(this.bubbleTimer > 0) {
                    this.bubbleTimer--;
                    if(this.bubbleTimer <= 0) this.showBubble = false;
                }

                if(this.status !== 'idle') return;
                
                // 1. 이동: 특별한 목적이 없으면 심심해서 바닥을 돌아다님 (30% 확률)
                if(Math.random() < 0.3) {
                    this.targetX = 20 + Math.random() * 60; 
                    this.targetY = 30 + Math.random() * 50;
                }

                if(Math.random() > 0.5) return; // 판단 딜레이

                // 2. 피로도 회복 (여관 or 주점)
                if(this.stamina < 40) {
                    if(this.money >= FACILITIES.sleep.cost) { this.useFacility('sleep'); return; } 
                    else if (this.money >= FACILITIES.drink.cost) { this.useFacility('drink'); return; } 
                    else { this.setThought("돈이 없어서 노숙해야겠어...", 4); return; }
                }

                // 3. 자기계발 (돈과 체력이 남을 때)
                if(this.stamina > 70 && this.money >= FACILITIES.train.cost + 100 && Math.random() < 0.3) { 
                    this.useFacility('train'); return; 
                }

                // 4. 게시판에서 스스로 의뢰 수락 (가장 중요)
                if(this.stamina >= 20) {
                    let available = guild.quests.filter(q => !q.assignedMercId);
                    if(available.length > 0) {
                        // 게시판 쪽으로 이동
                        this.targetX = FACILITIES.board.x + (Math.random()*10 - 5);
                        this.targetY = FACILITIES.board.y + 5;

                        // 보상이 높은 순으로 탐색
                        available.sort((a,b) => b.reward - a.reward);
                        for(let q of available) {
                            if(this.stamina >= q.reqStamina) {
                                let winChance = Math.floor((this.power / q.reqPower) * 70);
                                if(winChance >= 30) { // 승산이 30% 이상이면 과감하게 도전!
                                    this.stamina -= q.reqStamina;
                                    this.status = 'questing';
                                    q.assignedMercId = this.id;
                                    this.setThought(`[${q.title}] 이건 내가 접수한다!`, 3);
                                    return;
                                }
                            }
                        }
                        this.setThought("할만한 의뢰가 없군.", 2);
                    } else {
                        if(Math.random() < 0.2) this.setThought("누가 의뢰좀 안 주나...", 2);
                    }
                }
            }

            useFacility(type) {
                let fac = FACILITIES[type];
                this.money -= fac.cost;
                guild.money += fac.cost; // 🪙 용병이 쓴 돈이 길드의 수입이 됨!
                
                this.status = type === 'train' ? 'training' : 'resting';
                this.actionTimeLeft = fac.time;
                this.setThought(`[${fac.name}] 간다.`, 3);
                
                // 시설 위치로 이동
                this.targetX = fac.x + (Math.random()*10 - 5);
                this.targetY = fac.y + (Math.random()*10 - 5);
            }
        }

        class Quest {
            constructor() {
                this.id = 'Q_' + Date.now() + Math.floor(Math.random()*100);
                this.title = ["고블린 부락 토벌", "상단 마차 호위", "도적단 추적", "저주받은 묘지 정화", "드래곤 둥지 수색", "희귀 약초 채집"][Math.floor(Math.random()*6)];
                this.timeTotal = 6 + Math.floor(Math.random() * 8);
                this.timeLeft = this.timeTotal;
                
                let baseReq = 15 + (guild.day * 2);
                this.reqPower = Math.floor(baseReq * (0.6 + Math.random() * 0.8));
                this.reqStamina = 20 + Math.floor(Math.random() * 20); 
                
                // 용병들이 스스로 돈을 벌어야 하므로 보상을 넉넉하게 산정
                this.reward = this.reqPower * (4 + Math.floor(Math.random() * 4)); 
                this.assignedMercId = null;
            }
        }

        // ==========================================
        // 4. 화면 렌더링 함수
        // ==========================================
        function updateHeader() {
            document.getElementById('ui-time').innerText = `DAY ${guild.day} [ ${guild.hour.toString().padStart(2, '0')}:00 ]`;
            document.getElementById('ui-money').innerText = guild.money.toLocaleString();
            document.getElementById('ui-cap').innerText = `${guild.roster.length} / ${guild.capacity}`;
            
            let btn = document.getElementById('btn-upgrade');
            btn.innerText = `길드 증축 (최대 인원 +2) : ${guild.upgradeCost}G`;
            btn.disabled = guild.money < guild.upgradeCost;
        }

        function renderSidebar() {
            // 사이드바: 진행중 & 대기중 퀘스트
            const questCont = document.getElementById('quest-list');
            questCont.innerHTML = '';
            guild.quests.forEach((q) => {
                let statusText, mercName = "";
                if(q.assignedMercId) {
                    let m = guild.roster.find(m => m.id === q.assignedMercId);
                    statusText = `<span style="color:#e74c3c;">[진행 중]</span>`;
                    mercName = ` | 담당: ${m ? m.name : '알수없음'}`;
                } else {
                    statusText = `<span style="color:#2ecc71;">[모집 중]</span>`;
                }

                questCont.innerHTML += `
                    <div class="list-item">
                        <div class="list-title">${statusText} ${q.title}</div>
                        <div class="list-desc">
                            <span>권장: ⚔️${q.reqPower}</span>
                            <span style="color:var(--gold)">보상: 🪙${q.reward}G${mercName}</span>
                        </div>
                    </div>
                `;
            });

            // 사이드바: 현재 소속된 프리랜서 용병들 스탯
            const rosterCont = document.getElementById('roster-list');
            rosterCont.innerHTML = '';
            guild.roster.forEach((merc) => {
                let statusStr = merc.status === 'idle' ? '대기중' : (merc.status === 'questing' ? '임무중' : '시설이용중');
                rosterCont.innerHTML += `
                    <div class="list-item" style="border-left: 3px solid ${merc.job.color}">
                        <div class="list-title">
                            <span>${merc.name} <span style="font-size:0.7rem; color:#888;">Lv.${merc.level}</span></span>
                            <span style="font-size:0.8rem; color:#ccc;">${statusStr}</span>
                        </div>
                        <div class="list-desc">
                            <span>⚔️${merc.power} | ⚡${merc.stamina}</span>
                            <span style="color:var(--gold)">개인자산: 🪙${merc.money}G</span>
                        </div>
                    </div>
                `;
            });
        }

        // 👁️ [핵심] 아바타 바닥 렌더링 (애니메이션 처리)
        function renderFloor() {
            const container = document.getElementById('floor-container');
            
            guild.roster.forEach(merc => {
                let el = document.getElementById('sprite-' + merc.id);
                let bubble = document.getElementById('bubble-' + merc.id);
                
                // 파견을 나가면 화면에서 보이지 않게 처리
                if(merc.status === 'questing') {
                    if(el) el.style.display = 'none';
                    return;
                }
                
                // 처음 생성된 캐릭터면 DOM 엘리먼트 추가
                if(!el) {
                    el = document.createElement('div');
                    el.id = 'sprite-' + merc.id;
                    el.className = 'merc-sprite';
                    el.innerHTML = `
                        <div class="floor-bubble" id="bubble-${merc.id}"></div>
                        <div class="nameplate">
                            <span class="name-text" style="color:${merc.job.color}">${merc.name}</span>
                            <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-${merc.id}"></div></div>
                        </div>
                        <img src="${merc.portraitUrl}" alt="sprite">
                    `;
                    container.appendChild(el);
                    bubble = document.getElementById('bubble-' + merc.id);
                } else {
                    el.style.display = 'flex';
                }
                
                // 실제 위치(target)로 CSS 이동 처리 (부드러운 워킹)
                merc.tx += (merc.targetX - merc.tx) * 0.1; // 보간 이동
                merc.ty += (merc.targetY - merc.ty) * 0.1;
                el.style.left = merc.tx + '%';
                el.style.top = merc.ty + '%';
                
                // 체력(활력) 바 업데이트
                document.getElementById('hp-' + merc.id).style.width = `${(merc.stamina / merc.maxStamina)*100}%`;
                
                // 말풍선 제어
                if(merc.showBubble) {
                    bubble.innerText = merc.thought;
                    bubble.classList.add('show');
                } else {
                    bubble.classList.remove('show');
                }
            });
        }

        function showLog(msg) {
            const logBox = document.getElementById('log-container');
            document.getElementById('log-text').innerHTML = msg;
            logBox.style.display = 'block';
            setTimeout(() => { logBox.style.display = 'none'; }, 3000);
        }

        // 길드장 유일한 액션: 길드 인프라 증축
        function upgradeGuild() {
            if(guild.money >= guild.upgradeCost) {
                guild.money -= guild.upgradeCost;
                guild.capacity += 2;
                guild.upgradeCost = Math.floor(guild.upgradeCost * 1.5);
                showLog(`🏰 길드 증축 완료! 최대 수용 인원이 ${guild.capacity}명으로 늘어났습니다.`);
                updateHeader();
            }
        }

        function updateAll() { 
            updateHeader(); 
            renderSidebar(); 
            renderFloor();
        }

        // ==========================================
        // 5. ⏳ 메인 게임 루프 (초당 10번 프레임 + 1초 로직)
        // ==========================================
        let frameCount = 0;

        setInterval(() => {
            frameCount++;
            
            // 60프레임급 부드러운 위치 갱신 렌더링
            renderFloor();

            // 1초(10프레임)마다 실행되는 시스템 로직
            if(frameCount % 10 === 0) {
                guild.hour++;
                
                // 매 시간 자연 회복
                guild.roster.forEach(m => { if(m.status === 'idle') m.stamina = Math.min(m.maxStamina, m.stamina + 2); });

                // 하루 경과
                if (guild.hour >= 24) { guild.hour = 0; guild.day++; }

                // 🌟 길드의 명성(수용량)이 남아있으면, 아침(08:00)에 떠돌이 용병이 제 발로 찾아옴!
                if (guild.hour === 8 && guild.roster.length < guild.capacity) {
                    if(Math.random() < 0.7) { // 70% 확률로 방문
                        let newMerc = new Mercenary();
                        guild.roster.push(newMerc);
                        showLog(`🚪 새로운 떠돌이 용병 [${newMerc.name}]이(가) 길드에 머물기로 했습니다.`);
                    }
                }

                // 🌟 게시판에 퀘스트가 떨어지면 보충
                if(guild.quests.length < 4 && Math.random() < 0.3) {
                    guild.quests.push(new Quest());
                }

                // 🧠 용병 AI 실행
                guild.roster.forEach(merc => merc.think());

                // 시설 이용 시간 경과 처리
                guild.roster.forEach(merc => {
                    if(merc.status === 'resting' || merc.status === 'training') {
                        merc.actionTimeLeft--;
                        if(merc.actionTimeLeft <= 0) {
                            let fac = FACILITIES[merc.currentAction];
                            if(merc.currentAction === 'train') { 
                                merc.power += fac.powerUp; merc.setThought("강해졌다!", 2); 
                            } else { 
                                merc.stamina = Math.min(merc.maxStamina, merc.stamina + fac.stamRecover); 
                                merc.setThought("몸이 가볍군.", 2); 
                            }
                            merc.status = 'idle'; merc.currentAction = null;
                        }
                    }
                });

                // 퀘스트 파견 시간 및 판정 (🌟 길드 수수료 20% 떼어가기)
                guild.quests.forEach((q, idx) => {
                    if (q.assignedMercId) {
                        q.timeLeft--;
                        if (q.timeLeft <= 0) {
                            let merc = guild.roster.find(m => m.id === q.assignedMercId);
                            if(merc) {
                                merc.status = 'idle';
                                merc.targetX = 50; merc.targetY = 90; // 입구로 복귀
                                
                                let winChance = Math.min(95, Math.max(10, Math.floor((merc.power / q.reqPower) * 70))); 
                                
                                if(Math.random() * 100 <= winChance) {
                                    // 💰 수익 분배: 용병 80%, 길드(플레이어) 20%
                                    let guildCut = Math.floor(q.reward * 0.2); 
                                    let mercCut = q.reward - guildCut;
                                    
                                    guild.money += guildCut; 
                                    merc.money += mercCut; 
                                    merc.exp += 50;
                                    
                                    merc.setThought(`의뢰 성공! 🪙${mercCut}G 벌었다.`, 4);
                                    showLog(`📜 ${merc.name} 의뢰 성공! (수수료 입금: +${guildCut} G)`);
                                } else {
                                    merc.exp += 10;
                                    merc.setThought("죽을 뻔했네... 실패다.", 4);
                                }
                            }
                            guild.quests.splice(idx, 1);
                        }
                    }
                });

                updateHeader();
                renderSidebar();
            }
        }, 100); // 100ms = 1프레임

        // 초기화
        for(let i=0;i<3;i++) guild.roster.push(new Mercenary());
        for(let i=0;i<4;i++) guild.quests.push(new Quest());
        updateAll();

    </script>
</body>
